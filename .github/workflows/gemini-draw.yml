# Draws a set of images with the Gemini image API from a job file in
# design/gemini-jobs (logo rounds, icon sheets...), for a human to choose
# from, and commits them under design/. Uses the GEMINI_API_KEY secret.
# Price per image: see the README (0.034 to 0.134 USD at 1K, more at 2K).
name: Gemini drawings

on:
  workflow_dispatch:
    inputs:
      job:
        description: "Job file name in design/gemini-jobs, without .json (for example logo-v2)"
        required: true
        type: string
      model:
        description: "Override the model of the job (empty = the job's own)"
        default: ""
        type: string

permissions:
  contents: read

jobs:
  draw:
    name: Draw
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      JOB: ${{ inputs.job }}
    steps:
      - name: Check the job name
        run: case "$JOB" in ''|*[!a-z0-9-]*) echo "::error::job must be a file name like logo-v2"; exit 1 ;; esac

      - name: Check out the default branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Draw
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ inputs.model }}
        run: node scripts/gemini-draw.mjs "design/gemini-jobs/$JOB.json"

      - name: Commit the drawings
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add design
          if git diff --cached --quiet; then echo "Nothing new."; exit 0; fi
          git commit -m "Gemini drawings: $JOB"
          git pull --rebase origin "$DEFAULT_BRANCH"
          git push origin "HEAD:$DEFAULT_BRANCH"
