# Stores a Clearing run whose simulation succeeded but whose "Store the run"
# job failed. The simulation is not run again and nothing is spent: the run is
# read from the artifact that the failed workflow run kept (30 days).
#
# Start it from Actions > Clearing run recovery > Run workflow, with the number
# at the end of the failed run's address (.../actions/runs/<number>).
name: Clearing run recovery

on:
  workflow_dispatch:
    inputs:
      source_run:
        description: "Workflow run number of the failed Clearing run (from its address, .../actions/runs/<number>)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: clearing-recover-${{ inputs.source_run }}
  cancel-in-progress: false

jobs:
  store:
    name: Store the run
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      actions: write
    env:
      SOURCE_RUN: ${{ inputs.source_run }}
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
    steps:
      - name: Check the input
        run: |
          case "$SOURCE_RUN" in ''|*[!0-9]*) echo "::error::source_run must be a number"; exit 1 ;; esac

      - name: Check out the default branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Fetch the run from the failed workflow run
        uses: actions/download-artifact@v8
        with:
          name: clearing-run
          path: ${{ runner.temp }}/clearing-run
          run-id: ${{ inputs.source_run }}
          github-token: ${{ github.token }}

      - name: Check the site builds with the run
        run: |
          node clearing/store.mjs "$RUNNER_TEMP/clearing-run"
          npm run build
          git checkout -- data && git clean -fdq data

      # Takes the next free number if another run was stored meanwhile; if
      # another run is pushed between our fetch and our push, start again
      # from the new state of the branch.
      - name: Put the run in the corpus and commit it
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3 4 5 6; do
            git fetch -q origin "$DEFAULT_BRANCH"
            git reset -q --hard "origin/$DEFAULT_BRANCH"
            RUN_ID=$(node clearing/store.mjs "$RUNNER_TEMP/clearing-run" | tail -n 1)
            npm run validate
            git add data/clearing/runs
            git commit -q -m "Add Clearing run $RUN_ID (recovered from workflow run $SOURCE_RUN)"
            if git push -q origin "HEAD:$DEFAULT_BRANCH"; then echo "stored as $RUN_ID"; exit 0; fi
            sleep $((attempt * 10))
          done
          echo "::error::could not push the run after six attempts"; exit 1

      - name: Rebuild the site
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --ref "$DEFAULT_BRANCH"
