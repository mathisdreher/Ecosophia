    fr: "Les techniques et la ville organique."

- from: murray-bookchin
  to: janet-biehl
  type: influenced
  note:
    en: "Libertarian municipalism, carried forward."
    fr: "Le municipalisme libertaire, prolongé."
  source: biehl-1998

- from: murray-bookchin
  to: dimitrios-roussopoulos
  type: influenced
  note:
