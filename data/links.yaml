- from: jacques-ellul
  to: ivan-illich
  type: influenced
  note:
    en: "Illich tells Ellul in person that he owes him the idea of technique as a system."
    fr: "Illich dit à Ellul, de vive voix, qu'il lui doit l'idée de la technique comme système."
  source: illich-1993

- from: ivan-illich
  to: andre-gorz
  type: dialogue
  note:
    en: "Gorz presents Illich to French readers and argues with him about tools and autonomy."
    fr: "Gorz présente Illich aux lecteurs français et discute avec lui des outils et de l'autonomie."
  source: gorz-1975

- from: donella-meadows
  to: andre-gorz
  type: influenced
  note:
    en: "Debating the Limits report in 1972, Gorz asks whether capitalism can survive without growth and speaks of décroissance."
    fr: "En débattant du rapport sur les limites en 1972, Gorz demande si le capitalisme peut survivre sans croissance et parle de décroissance."
  source: kallis-2014

- from: nicholas-georgescu-roegen
  to: serge-latouche
  type: influenced
  note:
    en: "Bioeconomics gives degrowth its physical argument."
    fr: "La bioéconomie donne à la décroissance son argument physique."
  source: latouche-2006

- from: ivan-illich
  to: serge-latouche
  type: influenced
  note:
    en: "Conviviality and the critique of needs."
    fr: "La convivialité et la critique des besoins."
  source: latouche-2006

- from: andre-gorz
  to: serge-latouche
  type: influenced
  note:
    en: "Sufficiency, and the refusal of work as the centre of life."
    fr: "La suffisance, et le refus du travail comme centre de la vie."
  source: latouche-2006

- from: jacques-ellul
  to: serge-latouche
  type: influenced
  note:
    en: "Latouche counts Ellul among the forerunners of degrowth and devotes a book to him."
    fr: "Latouche range Ellul parmi les précurseurs de la décroissance et lui consacre un livre."
  source: latouche-2013

- from: serge-latouche
  to: giorgos-kallis
  type: influenced
  note:
    en: "The French décroissance becomes an international vocabulary."
    fr: "La décroissance française devient un vocabulaire international."
  source: kallis-2014

- from: jason-hickel
  to: giorgos-kallis
  type: dialogue
  note:
    en: "Co-authors of the review that tests green growth against the evidence."
    fr: "Coauteurs de la synthèse qui confronte la croissance verte aux données."
  source: hickel-2020b

- from: giorgos-kallis
  to: ted-nordhaus
  type: critiqued
  note:
    en: "A critical history of the post-environmentalism of the Breakthrough Institute."
    fr: "Une histoire critique du post-environnementalisme du Breakthrough Institute."
  source: kallis-2019b

