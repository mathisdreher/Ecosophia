# --- Anthropocene, Gaia and the counterpoints -------------------------------
- from: james-lovelock
  to: bruno-latour
  type: influenced
  note:
    en: "Latour rereads Gaia as a political figure rather than a superorganism."
    fr: "Latour relit Gaïa comme une figure politique plutôt que comme un superorganisme."
  source: latour-2015

- from: james-lovelock
  to: isabelle-stengers
  type: influenced
  note:
    en: "Stengers keeps the name Gaia for what intrudes and cannot be negotiated with."
    fr: "Stengers garde le nom de Gaïa pour ce qui fait intrusion et avec quoi l'on ne négocie pas."
  source: stengers-2009

- from: isabelle-stengers
  to: bruno-latour
  type: dialogue
  note:
    en: "Cosmopolitics: a word Stengers coins and Latour takes up."
    fr: "Cosmopolitiques : un mot que Stengers forge et que Latour reprend."
  source: latour-1999

- from: isabelle-stengers
  to: donna-haraway
  type: dialogue
  note:
    en: "Haraway thinks with Stengers about how to stay with the trouble rather than solve it from above."
    fr: "Haraway pense avec Stengers la manière de rester avec le trouble plutôt que de le résoudre d'en haut."
  source: haraway-2016

- from: donna-haraway
  to: anna-tsing
  type: dialogue
  note:
    en: "The word Plantationocene comes out of a conversation between them and other anthropologists."
    fr: "Le mot Plantationocène naît d'une conversation entre elles et d'autres anthropologues."
  source: haraway-2016b

- from: malcom-ferdinand
  to: donna-haraway
  type: dialogue
  note:
    en: "Ferdinand takes up the Plantationocene and answers it from the hold of the slave ship."
    fr: "Ferdinand reprend le Plantationocène et lui répond depuis la cale du navire négrier."
  source: ferdinand-2019

- from: james-lovelock
  to: stewart-brand
  type: influenced
  note:
    en: "Brand takes from Lovelock both the image of a self-regulating Earth and the case for nuclear power."
    fr: "Brand reprend à Lovelock à la fois l'image d'une Terre autorégulée et le plaidoyer pour le nucléaire."
  source: brand-2009

- from: bruno-latour
  to: ted-nordhaus
  type: dialogue
  note:
    en: "Latour writes for the Breakthrough Institute that we must care for our technologies as for our children."
    fr: "Latour écrit pour le Breakthrough Institute qu'il faut prendre soin de nos techniques comme de nos enfants."
  source: latour-2011

- from: michael-shellenberger
  to: ted-nordhaus
  type: dialogue
  note:
    en: "Co-authors of the essay that declared the death of environmentalism."
    fr: "Coauteurs de l'essai qui a proclamé la mort de l'environnementalisme."
  source: nordhaus-2004

