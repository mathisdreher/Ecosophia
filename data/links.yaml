# --- Ecosocialism -----------------------------------------------------------
- from: karl-marx
  to: john-bellamy-foster
  type: influenced
  note:
    en: "Foster reconstructs the metabolic rift from Marx's reading of the chemist Liebig."
    fr: "Foster reconstruit la rupture métabolique à partir de la lecture que Marx fait du chimiste Liebig."
  source: foster-2000

- from: karl-marx
  to: kohei-saito
  type: influenced
  note:
    en: "The late notebooks on natural science, read as an unfinished ecological critique."
    fr: "Les derniers cahiers sur les sciences de la nature, lus comme une critique écologique inachevée."
  source: saito-2017

- from: karl-marx
  to: michael-lowy
  type: influenced
  note:
    en: "A Marx to be kept for his critique of capital and corrected for his faith in the productive forces."
    fr: "Un Marx à garder pour sa critique du capital et à corriger pour sa foi dans les forces productives."
  source: lowy-2011

- from: william-morris
  to: michael-lowy
  type: influenced
  note:
    en: "A romantic critique of industrial civilisation from inside Marxism."
    fr: "Une critique romantique de la civilisation industrielle, de l'intérieur du marxisme."
  source: lowy-1992

- from: john-bellamy-foster
  to: kohei-saito
  type: influenced
  note:
    en: "The metabolic rift, taken into the archive of Marx's notebooks."
    fr: "La rupture métabolique, portée dans l'archive des cahiers de Marx."
  source: saito-2017

- from: andreas-malm
  to: bruno-latour
  type: critiqued
  note:
    en: "To fight warming one must tell society from nature, not dissolve the line between them."
    fr: "Pour combattre le réchauffement, il faut distinguer la société de la nature, non dissoudre la frontière."
  source: malm-2018

- from: michael-lowy
  to: giorgos-kallis
  type: dialogue
  note:
    en: "A joint text argues that ecosocialism and degrowth need each other."
    fr: "Un texte commun soutient que l'écosocialisme et la décroissance ont besoin l'un de l'autre."
  source: lowy-2022

# --- Technocritique and degrowth --------------------------------------------
- from: jacques-ellul
  to: bernard-charbonneau
  type: dialogue
  note:
    en: "Friends from their youth in Bordeaux: they write a personalist manifesto together in 1935."
    fr: "Amis depuis leur jeunesse bordelaise : ils rédigent ensemble un manifeste personnaliste en 1935."
