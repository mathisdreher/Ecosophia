# The mycelium: who read whom, and what they disagreed on.
#
# type: influenced  -> `from` influenced `to`      (solid thread, arrow)
#       critiqued   -> `from` criticised `to`      (dashed thread, arrow)
#       dialogue    -> the two answered each other (dotted thread, no arrow)
# source: id of a work (data/authors/*.yaml) or of a secondary source
#         (data/sources.yaml). No source, no link.
# status: to-verify -> kept on the author page with a flag, left out of the graph.

# --- Roots among themselves -------------------------------------------------
- from: francois-quesnay
  to: anne-robert-jacques-turgot
  type: influenced
  note:
    en: "Turgot takes the net product of the land from Quesnay and builds a theory of capital on it."
    fr: "Turgot reprend à Quesnay le produit net de la terre et bâtit dessus une théorie du capital."
  source: turgot-1766

- from: francois-quesnay
  to: karl-marx
  type: influenced
  note:
    en: "Marx reads the Tableau as the first picture of an economy that reproduces itself."
    fr: "Marx lit le Tableau comme la première image d'une économie qui se reproduit elle-même."
  source: marx-1862

- from: alexander-von-humboldt
  to: ernst-haeckel
  type: influenced
  note:
    en: "Haeckel reads Humboldt as a boy and takes from him the idea of nature as a living whole."
    fr: "Haeckel lit Humboldt dès l'enfance et lui emprunte l'idée d'une nature comme tout vivant."
  source: wulf-2015

- from: alexander-von-humboldt
  to: henry-david-thoreau
  type: influenced
  note:
    en: "Reading Humboldt, Thoreau learns to join exact measurement to poetry in his journal."
    fr: "En lisant Humboldt, Thoreau apprend à unir, dans son journal, la mesure exacte à la poésie."
  source: wulf-2015

- from: alexander-von-humboldt
  to: john-muir
  type: influenced
  note:
    en: "Muir annotates Humboldt and dreams of repeating his South American journey."
    fr: "Muir annote Humboldt et rêve de refaire son voyage en Amérique du Sud."
  source: wulf-2015

- from: henry-david-thoreau
  to: mohandas-gandhi
  type: influenced
  note:
    en: "In South Africa, Gandhi publishes extracts from Thoreau's essay on resistance to government."
    fr: "En Afrique du Sud, Gandhi publie des extraits de l'essai de Thoreau sur la résistance au gouvernement."
  source: gandhi-1907

- from: elisee-reclus
  to: peter-kropotkin
  type: dialogue
  note:
    en: "Friends and comrades in exile: Reclus edits and prefaces Kropotkin's first book."
    fr: "Amis et camarades d'exil : Reclus édite et préface le premier livre de Kropotkine."
  source: kropotkin-1885

- from: sergei-podolinsky
  to: karl-marx
  type: dialogue
  note:
    en: "Podolinsky sends Marx his essay on labour and energy; Engels judges that it confuses physics with economics."
    fr: "Podolinsky envoie à Marx son essai sur le travail et l'énergie ; Engels juge qu'il confond la physique et l'économie."
  source: engels-1882

- from: patrick-geddes
  to: lewis-mumford
  type: influenced
  note:
    en: "Mumford calls Geddes his master and takes from him the region as the unit of study."
    fr: "Mumford appelle Geddes son maître et lui emprunte la région comme unité d'étude."
  source: novak-1995

- from: peter-kropotkin
  to: lewis-mumford
  type: influenced
  note:
    en: "Mumford finds in Fields, Factories and Workshops the model of a decentralised industry."
    fr: "Mumford trouve dans Champs, usines et ateliers le modèle d'une industrie décentralisée."
  source: mumford-1961

# --- Ecosophy and deep ecology ----------------------------------------------
- from: baruch-spinoza
  to: arne-naess
  type: influenced
  note:
    en: "Every being strives to persist and unfold: the ground of Ecosophy T."
    fr: "Chaque être s'efforce de persévérer et de s'épanouir : le socle de l'Écosophie T."
  source: naess-1975

- from: mohandas-gandhi
  to: arne-naess
  type: influenced
  note:
    en: "Non-violence as a method, and the unity of all life."
    fr: "La non-violence comme méthode, et l'unité de toute vie."
  source: naess-1974

- from: rachel-carson
  to: arne-naess
  type: influenced
  status: to-verify
  note:
    en: "Silent Spring turns him toward the ecology movement."
    fr: "Printemps silencieux le tourne vers le mouvement écologiste."

- from: arne-naess
  to: george-sessions
  type: influenced
  note:
    en: "Sessions writes the eight-point platform with Næss and carries deep ecology to North America."
    fr: "Sessions rédige avec Næss la plateforme en huit points et porte l'écologie profonde en Amérique du Nord."
  source: devall-1985

- from: arne-naess
  to: bill-devall
  type: influenced
  note:
    en: "Devall turns the distinction between shallow and deep into a programme for the movement."
    fr: "Devall fait de la distinction entre superficiel et profond un programme pour le mouvement."
  source: devall-1985

- from: aldo-leopold
  to: george-sessions
  type: influenced
  note:
    en: "The land ethic is one of the sources Devall and Sessions name for deep ecology."
    fr: "L'éthique de la terre est l'une des sources que Devall et Sessions donnent à l'écologie profonde."
  source: devall-1985

- from: aldo-leopold
  to: holmes-rolston
  type: influenced
  note:
    en: "Rolston asks whether the land ethic can be an ethic in the philosophers' sense, and answers yes."
    fr: "Rolston demande si l'éthique de la terre peut être une éthique au sens des philosophes, et répond oui."
  source: rolston-1975

- from: aldo-leopold
  to: baptiste-morizot
  type: influenced
  note:
    en: "Thinking like a mountain becomes the starting point of a diplomacy with wolves."
    fr: "Penser comme une montagne devient le point de départ d'une diplomatie avec les loups."
  source: morizot-2016

- from: philippe-descola
  to: baptiste-morizot
  type: influenced
  note:
    en: "Naturalism as one ontology among others: the frame Morizot wants to leave."
    fr: "Le naturalisme comme une ontologie parmi d'autres : le cadre dont Morizot veut sortir."
  source: morizot-2020

- from: felix-guattari
  to: arne-naess
  type: dialogue
  label:
    en: "Same word, another sense"
    fr: "Même mot, autre sens"
  note:
    en: "Ecosophy as three ecologies: environmental, social and mental. Guattari does not build on Næss."
    fr: "L'écosophie comme trois écologies : environnementale, sociale et mentale. Guattari ne s'appuie pas sur Næss."
  source: guattari-1989

- from: murray-bookchin
  to: arne-naess
  type: critiqued
  note:
    en: "Deep ecology ignores the social roots of the ecological crisis."
    fr: "L'écologie profonde ignore les racines sociales de la crise écologique."
  source: bookchin-1987

- from: murray-bookchin
  to: george-sessions
  type: critiqued
  note:
    en: "To blame humanity as a whole is to excuse the hierarchies and the firms that do the damage."
    fr: "Accuser l'humanité entière, c'est excuser les hiérarchies et les entreprises qui causent les dégâts."
  source: bookchin-1987

- from: ramachandra-guha
  to: arne-naess
  type: critiqued
  note:
    en: "Wilderness preservation looks different from the global South."
    fr: "La préservation de la nature sauvage se voit autrement depuis le Sud global."
  source: guha-1989b

- from: val-plumwood
  to: arne-naess
  type: critiqued
  note:
    en: "A self that expands to include nature still absorbs the other instead of recognising it."
    fr: "Un soi qui s'élargit jusqu'à inclure la nature absorbe encore l'autre au lieu de le reconnaître."
  source: plumwood-1993

