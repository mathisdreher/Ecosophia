# The trunk: founding texts, roughly 1962 to 1975. Each entry points to a work
# defined in an author file. The selection is editorial (see the method page).
- work: carson-1962
  text:
    en: "Pesticides become a public question."
    fr: "Les pesticides deviennent une question publique."
- work: bookchin-1962
  text:
    en: "Chemicals, cities and health: the environment as a social problem."
    fr: "Chimie, villes et santé : l'environnement comme problème social."
- work: ellul-1954
  text:
    en: "Technique as a system with its own logic. Read worldwide after its English translation of 1964."
    fr: "La technique comme système doté de sa propre logique. Lu dans le monde entier après sa traduction anglaise de 1964."
- work: georgescu-roegen-1971
  text:
    en: "The economy obeys the entropy law."
    fr: "L'économie obéit à la loi de l'entropie."
- work: meadows-1972
  text:
    en: "A computer model sets limits to growth."
    fr: "Un modèle informatique fixe des limites à la croissance."
- work: naess-1973
  text:
    en: "Shallow and deep ecology part ways."
    fr: "L'écologie superficielle et l'écologie profonde se séparent."
- work: illich-1973
  text:
    en: "Tools should serve those who use them."
    fr: "L'outil doit servir celles et ceux qui l'utilisent."
- work: eaubonne-1974
  text:
    en: "The word ecofeminism appears."
    fr: "Le mot écoféminisme apparaît."
- work: gorz-1975
  text:
    en: "Ecology becomes a critique of capitalist production."
    fr: "L'écologie devient une critique de la production capitaliste."

- work: boulding-1966
  text:
    en: "The Earth is a closed ship, and the economy must learn to count throughput as a cost."
    fr: "La Terre est un vaisseau fermé, et l'économie doit apprendre à compter le flux de matière comme un coût."
- work: commoner-1971
  text:
    en: "Four laws of ecology, and pollution blamed on post-war technology."
    fr: "Quatre lois de l'écologie, et une pollution imputée aux techniques d'après-guerre."

- work: white-1967
  text:
    en: "The crisis is traced to the religious roots of the West."
    fr: "La crise est rapportée aux racines religieuses de l'Occident."
- work: hardin-1968
  text:
    en: "The commons is said to be ruined by free access."
    fr: "Le bien commun serait ruiné par le libre accès."
- work: ehrlich-1968
  text:
    en: "Population becomes the centre of the environmental question."
    fr: "La population devient le centre de la question environnementale."
- work: stone-1972
  text:
    en: "Trees, rivers and oceans are proposed as holders of rights."
    fr: "Arbres, rivières et océans sont proposés comme titulaires de droits."
- work: schumacher-1973
  text:
    en: "An economics at the scale of people and of their tools."
    fr: "Une économie à l'échelle des personnes et de leurs outils."
- work: dumont-1973
  text:
    en: "Political ecology enters French politics through the hunger of the Third World."
    fr: "L'écologie politique entre dans la politique française par la faim du tiers-monde."
