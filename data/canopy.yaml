# The Canopy: authors placed on three axes, from 0 to 100.
#
#   nature  0 anthropocentric (nature matters for humans) .. 100 ecocentric (nature matters in itself)
#   change  0 reform within existing institutions .......... 100 rupture with them
#   power   0 the state and its plans ...................... 100 the commune and autonomy
#
# Each placement is a reading of one work of the author, with the reason in a
# sentence. These are first readings by the editors, not measurements: status
# proposed means not yet reviewed. An author with no placement on an axis is
# shown hollow at the median of the branch.
#
# Format: axis: [score, work id, {en, fr}]

