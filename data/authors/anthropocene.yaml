      title: A Safe Operating Space for Humanity
      kind: article
      in: Nature
      issue: "461"
      by: {en: Rockström et al., fr: Rockström et al.}

- id: pablo-servigne
  name: Pablo Servigne
  sort: Servigne
  layer: leaf
  branch: anthropocene
  born: 1978
  place: {city: {en: Versailles, fr: Versailles}, country: {en: France, fr: France}, lat: 48.80, lon: 2.13}
  wikidata: Q24934340
  lede:
    en: "French agronomist and writer. With Raphaël Stevens he coined collapsology, the study of how industrial civilisation might collapse, and argued that preparing for it is a matter of mutual aid and of grief as much as of engineering."
    fr: "Agronome et auteur français. Avec Raphaël Stevens, il forge la collapsologie, l'étude de l'effondrement possible de la civilisation industrielle, et soutient que s'y préparer relève de l'entraide et du deuil autant que de l'ingénierie."
  seeds:
    - seed: collapsology
      text:
        en: "The collapse of industrial civilisation is a possibility to be studied, not a fantasy to dismiss."
        fr: "L'effondrement de la civilisation industrielle est une possibilité à étudier, non un fantasme à écarter."
      source: servigne-2015
  works:
    - id: servigne-2015
      year: 2015
      title: Comment tout peut s'effondrer
      by: {en: Servigne and Stevens, fr: Servigne et Stevens}
      note: {en: with Raphaël Stevens, fr: avec Raphaël Stevens}

- id: pierre-charbonnier
  name: Pierre Charbonnier
  sort: Charbonnier
  layer: leaf
  branch: anthropocene
  born: 1983
  place: {country: {en: France, fr: France}}
  wikidata: Q93725925
  lede:
    en: "French philosopher at Sciences Po, trained with Philippe Descola. Abondance et liberté rereads modern political thought from the ground up: the freedoms of the moderns were built on the abundance of land, colonies and coal."
    fr: "Philosophe français à Sciences Po, formé auprès de Philippe Descola. Abondance et liberté relit la pensée politique moderne depuis le sol : les libertés des modernes se sont construites sur l'abondance des terres, des colonies et du charbon."
  seeds:
    - seed: abundance-and-freedom
      text:
        en: "Modern freedom was tied to material abundance; an ecological politics must find a freedom that does not depend on it."
        fr: "La liberté moderne a été liée à l'abondance matérielle ; une politique écologique doit trouver une liberté qui n'en dépende pas."
      source: charbonnier-2020
  works:
    - {id: charbonnier-2015, year: 2015, title: "La Fin du grand partage : nature et société, de Durkheim à Descola"}
    - {id: charbonnier-2020, year: 2020, title: "Abondance et liberté : une histoire environnementale des idées politiques"}

- id: achille-mbembe
  name: Achille Mbembe
  sort: Mbembe
  layer: leaf
  branch: anthropocene
  also: [decolonial]
  born: 1957
  place: {country: {en: Cameroon, fr: Cameroun}}
  lede:
    en: "Cameroonian historian and political theorist, at the University of the Witwatersrand in Johannesburg. In Brutalisme he describes a planetary power that treats bodies, minds and the Earth alike as matter to be broken and extracted."
    fr: "Historien et théoricien politique camerounais, à l'université du Witwatersrand à Johannesburg. Dans Brutalisme, il décrit une puissance planétaire qui traite les corps, les esprits et la Terre comme une même matière à casser et à extraire."
  seeds:
    - seed: brutalism
      text:
        en: "Extraction now runs through bodies and the Earth alike: the same force breaks rock and breaks people."
        fr: "L'extraction traverse désormais les corps comme la Terre : la même force casse la roche et casse les personnes."
      source: mbembe-2020
  works:
    - {id: mbembe-2013, year: 2013, title: Critique de la raison nègre}
    - {id: mbembe-2020, year: 2020, title: Brutalisme}
