# Collapse and transition: the end of cheap energy, how complex societies
# fall, and how to prepare, adapt or rebuild locally.

- id: ugo-bardi
  name: Ugo Bardi
  sort: Bardi
  layer: leaf
  branch: collapse
  born: 1952
  place: {city: {en: Florence, fr: Florence}, country: {en: Italy, fr: Italie}, lat: 43.77, lon: 11.25}
  lede:
    en: "Italian chemist at Florence, a member of the Club of Rome. He defended The Limits to Growth against its critics, and named the Seneca effect: growth is slow, but ruin is rapid, because a system that exhausts its resources falls faster than it rose."
    fr: "Chimiste italien à Florence, membre du Club de Rome. Il défend Les Limites à la croissance contre ses critiques et nomme l'effet Sénèque : la croissance est lente, mais la ruine est rapide, car un système qui épuise ses ressources tombe plus vite qu'il ne s'est élevé."
  seeds:
    - seed: seneca-effect
      text:
        en: "Decline is steeper than growth: a system that has drawn down its stocks loses them faster than it built them."
        fr: "Le déclin est plus raide que la croissance : un système qui a puisé dans ses stocks les perd plus vite qu'il ne les a constitués."
      source: bardi-2017
  works:
    - {id: bardi-2011, year: 2011, title: The Limits to Growth Revisited}
    - {id: bardi-2014, year: 2014, title: "Extracted: How the Quest for Mineral Wealth Is Plundering the Planet"}
    - {id: bardi-2017, year: 2017, title: "The Seneca Effect: Why Growth Is Slow but Collapse Is Rapid"}

- id: joseph-tainter
  name: Joseph Tainter
  sort: Tainter
  layer: leaf
  branch: collapse
  born: 1949
  place: {country: {en: United States, fr: États-Unis}}
  lede:
    en: "American archaeologist. The Collapse of Complex Societies explains the fall of Rome or the Maya by diminishing returns on complexity: each new layer of administration solves a problem at a higher cost, until simplification becomes the rational choice."
    fr: "Archéologue américain. The Collapse of Complex Societies explique la chute de Rome ou des Mayas par les rendements décroissants de la complexité : chaque nouvelle couche d'administration résout un problème à un coût plus élevé, jusqu'à ce que la simplification devienne le choix rationnel."
  seeds:
    - seed: returns-on-complexity
      text:
        en: "Societies solve problems by adding complexity, whose returns diminish until collapse is a rational simplification."
        fr: "Les sociétés résolvent leurs problèmes en ajoutant de la complexité, dont les rendements décroissent jusqu'à faire de l'effondrement une simplification rationnelle."
      source: tainter-1988
  works:
    - {id: tainter-1988, year: 1988, title: The Collapse of Complex Societies}

- id: jared-diamond
  name: Jared Diamond
  sort: Diamond
  layer: leaf
  branch: collapse
  born: 1937
  place: {city: {en: Boston, fr: Boston}, country: {en: United States, fr: États-Unis}, lat: 42.36, lon: -71.06}
  lede:
    en: "American geographer and physiologist. Collapse compares Easter Island, the Norse of Greenland and others, and argues that societies choose to fail or succeed: environmental damage, climate, neighbours, trade and above all their responses decide."
    fr: "Géographe et physiologiste américain. Effondrement compare l'île de Pâques, les Scandinaves du Groenland et d'autres, et soutient que les sociétés choisissent d'échouer ou de réussir : dégâts environnementaux, climat, voisins, échanges et surtout leurs réponses en décident."
  seeds:
    - seed: chosen-collapse
      text:
        en: "Collapse is not fate: the decisive factor is how a society responds to the damage it does to its own environment."
        fr: "L'effondrement n'est pas une fatalité : le facteur décisif est la façon dont une société répond aux dégâts qu'elle fait à son propre milieu."
      source: diamond-2005
  works:
    - {id: diamond-2005, year: 2005, title: "Collapse: How Societies Choose to Fail or Succeed"}

- id: richard-heinberg
  name: Richard Heinberg
  sort: Heinberg
  layer: leaf
  branch: collapse
  born: 1950
  place: {country: {en: United States, fr: États-Unis}}
  lede:
    en: "American writer at the Post Carbon Institute. The Party's Over popularised peak oil: industrial civilisation was built on cheap fossil energy, and its decline forces a choice between competition for what remains and a planned power-down."
    fr: "Essayiste américain du Post Carbon Institute. The Party's Over popularise le pic pétrolier : la civilisation industrielle s'est bâtie sur une énergie fossile bon marché, et son déclin oblige à choisir entre la lutte pour ce qui reste et une descente énergétique planifiée."
  seeds:
    - seed: peak-oil
      text:
        en: "Once half the oil is gone, extraction declines whatever the price, and every economy built on cheap energy must contract."
        fr: "Une fois la moitié du pétrole extraite, la production décline quel que soit le prix, et toute économie bâtie sur une énergie bon marché doit se contracter."
      source: heinberg-2003
  works:
    - {id: heinberg-2003, year: 2003, title: "The Party's Over: Oil, War and the Fate of Industrial Societies"}

- id: rob-hopkins
  name: Rob Hopkins
  sort: Hopkins
  layer: leaf
  branch: collapse
  born: 1968
  place: {country: {en: United Kingdom, fr: Royaume-Uni}}
  lede:
    en: "British permaculture teacher, founder of the Transition Town movement at Totnes. Rather than wait for governments, towns plan their own energy descent and rebuild local food, energy and economy, with resilience as the goal."
    fr: "Enseignant britannique en permaculture, fondateur du mouvement des villes en transition à Totnes. Plutôt que d'attendre les gouvernements, les villes planifient leur propre descente énergétique et reconstruisent alimentation, énergie et économie locales, avec la résilience pour but."
  seeds:
    - seed: transition-towns
      text:
        en: "Communities can plan their own energy descent and make it a richer life, starting now and without waiting for the state."
        fr: "Les communautés peuvent planifier leur propre descente énergétique et en faire une vie plus riche, dès maintenant et sans attendre l'État."
      source: hopkins-2008
  works:
    - {id: hopkins-2008, year: 2008, title: "The Transition Handbook: From Oil Dependency to Local Resilience"}

- id: jem-bendell
  name: Jem Bendell
  sort: Bendell
  layer: leaf
  branch: collapse
  born: 1971
  place: {country: {en: United Kingdom, fr: Royaume-Uni}}
  lede:
    en: "British sustainability scholar. His paper Deep Adaptation, widely read and widely contested, argues that societal collapse driven by climate change is likely, and that the task is to prepare for it with resilience, relinquishment and restoration."
    fr: "Chercheur britannique en développement durable. Son article Deep Adaptation, très lu et très contesté, soutient qu'un effondrement des sociétés sous l'effet du climat est probable, et que la tâche est de s'y préparer par la résilience, le renoncement et la restauration."
  seeds:
    - seed: deep-adaptation
      text:
        en: "Prepare for likely collapse: keep what must be kept, let go of what cannot be, and restore what was lost."
        fr: "Se préparer à un effondrement probable : garder ce qui doit l'être, renoncer à ce qui ne peut l'être, restaurer ce qui a été perdu."
      source: bendell-2018
  works:
    - {id: bendell-2018, year: 2018, title: "Deep Adaptation: A Map for Navigating Climate Tragedy", kind: article}

- id: yves-cochet
  name: Yves Cochet
  sort: Cochet
  layer: leaf
  branch: collapse
  born: 1946
  place: {city: {en: Rennes, fr: Rennes}, country: {en: France, fr: France}, lat: 48.11, lon: -1.68}
  lede:
    en: "French mathematician and Green politician, minister of the environment in 2001 and 2002. From Pétrole apocalypse onwards he holds that the end of cheap oil makes a global collapse likely, and argues for degrowth and planned rationing."
    fr: "Mathématicien et homme politique écologiste français, ministre de l'Environnement en 2001 et 2002. Depuis Pétrole apocalypse, il tient pour probable un effondrement mondial dû à la fin du pétrole bon marché, et plaide pour la décroissance et un rationnement planifié."
  seeds:
    - seed: collapse-politics
      text:
        en: "A politician's duty is to prepare the population for collapse, with rationing and local resilience, rather than to promise growth."
        fr: "Le devoir d'un politique est de préparer la population à l'effondrement, par le rationnement et la résilience locale, plutôt que de promettre la croissance."
      source: cochet-2019
  works:
    - {id: cochet-2005, year: 2005, title: Pétrole apocalypse}
    - {id: cochet-2019, year: 2019, title: "Devant l'effondrement : essai de collapsologie"}
