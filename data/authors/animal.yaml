    en: "Belgian philosopher and psychologist. Que diraient les animaux, si… asks what animals would answer if scientists asked them the right questions, and shows how much of what we know about them depends on how we look."
    fr: "Philosophe et psychologue belge. Que diraient les animaux, si… demande ce que répondraient les animaux si les scientifiques leur posaient les bonnes questions, et montre combien ce que nous savons d'eux dépend de notre façon de regarder."
