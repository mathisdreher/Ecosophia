# Animal ethics and antispeciesism: the moral and political standing of
# animals, and its quarrel with ecocentric ethics over individuals and wholes.

- id: peter-singer
  name: Peter Singer
  sort: Singer
  layer: leaf
  branch: animal
  born: 1946
  place: {city: {en: Melbourne, fr: Melbourne}, country: {en: Australia, fr: Australie}, lat: -37.81, lon: 144.96}
  wikidata: Q211539
  lede:
    en: "Australian philosopher. Animal Liberation applies utilitarian equality to every being that can suffer and names speciesism, the prejudice that discounts the interests of other species. Ecocentrists answer that he cares for individuals, not for ecosystems."
    fr: "Philosophe australien. La Libération animale applique l'égalité utilitariste à tout être capable de souffrir et nomme le spécisme, le préjugé qui néglige les intérêts des autres espèces. Les écocentristes lui répondent qu'il se soucie des individus, non des écosystèmes."
  seeds:
    - seed: speciesism
      text:
        en: "Discounting the suffering of a being because of its species is a prejudice of the same kind as racism or sexism."
        fr: "Négliger la souffrance d'un être en raison de son espèce est un préjugé de même nature que le racisme ou le sexisme."
      source: singer-1975
  works:
    - {id: singer-1975, year: 1975, title: Animal Liberation}

- id: tom-regan
  name: Tom Regan
  sort: Regan
  layer: leaf
  branch: animal
  born: 1938
  died: 2017
  place: {city: {en: Pittsburgh, fr: Pittsburgh}, country: {en: United States, fr: États-Unis}, lat: 40.44, lon: -79.99}
  wikidata: Q314146
  lede:
    en: "American philosopher. Against Singer's utilitarianism, The Case for Animal Rights holds that every subject of a life has inherent value and rights that no sum of benefits can override: abolish, do not reform, the use of animals."
    fr: "Philosophe américain. Contre l'utilitarisme de Singer, Les Droits des animaux soutient que tout sujet d'une vie a une valeur inhérente et des droits qu'aucune somme d'avantages ne peut outrepasser : abolir l'usage des animaux, non le réformer."
  seeds:
    - seed: subject-of-a-life
      text:
        en: "A being with beliefs, desires and a welfare of its own has inherent value, and rights that cannot be traded away."
        fr: "Un être doté de croyances, de désirs et d'un bien-être propre a une valeur inhérente, et des droits qu'on ne peut pas monnayer."
      source: regan-1983
  works:
    - {id: regan-1983, year: 1983, title: The Case for Animal Rights}

- id: carol-j-adams
  name: Carol J. Adams
  sort: Adams
  layer: leaf
  branch: animal
  also: [ecofeminism]
  born: 1951
  place: {country: {en: United States, fr: États-Unis}}
  wikidata: Q1044179
  lede:
    en: "American feminist writer. The Sexual Politics of Meat links the butchering of animals and the objectification of women: in both, a living being becomes an absent referent, a piece to be consumed."
    fr: "Essayiste féministe américaine. La Politique sexuelle de la viande relie l'abattage des animaux et l'objectivation des femmes : dans les deux cas, un être vivant devient un référent absent, un morceau à consommer."
  seeds:
    - seed: absent-referent
      text:
        en: "Meat hides the animal it was, as the language of consumption hides the women it objectifies."
        fr: "La viande cache l'animal qu'elle était, comme le langage de la consommation cache les femmes qu'il objective."
      source: adams-1990
  works:
    - {id: adams-1990, year: 1990, title: "The Sexual Politics of Meat: A Feminist-Vegetarian Critical Theory"}

- id: will-kymlicka
  name: Will Kymlicka
  sort: Kymlicka
  layer: leaf
  branch: animal
  born: 1962
  place: {city: {en: "London, Ontario", fr: "London (Ontario)"}, country: {en: Canada, fr: Canada}, lat: 42.98, lon: -81.25}
  wikidata: Q523005
  lede:
    en: "Canadian political philosopher. With Sue Donaldson, Zoopolis moves animal ethics into political theory: domesticated animals as co-citizens, wild animals as sovereign communities, animals of the city as denizens."
    fr: "Philosophe politique canadien. Avec Sue Donaldson, Zoopolis fait passer l'éthique animale dans la théorie politique : les animaux domestiques comme concitoyens, les animaux sauvages comme communautés souveraines, ceux des villes comme résidents."
  seeds:
    - seed: animal-citizenship
      text:
        en: "Animals are owed not only negative rights but political membership, which differs for domesticated, wild and liminal animals."
        fr: "On ne doit pas aux animaux que des droits négatifs mais une appartenance politique, différente pour les animaux domestiques, sauvages et liminaires."
      source: kymlicka-2011
  works:
    - id: kymlicka-2011
      year: 2011
      title: "Zoopolis: A Political Theory of Animal Rights"
      by: {en: Donaldson and Kymlicka, fr: Donaldson et Kymlicka}
      note: {en: with Sue Donaldson, fr: avec Sue Donaldson}

- id: corine-pelluchon
  name: Corine Pelluchon
  sort: Pelluchon
  layer: leaf
  branch: animal
  born: 1967
  place: {country: {en: France, fr: France}}
  wikidata: Q2997292
  lede:
    en: "French philosopher. Les Nourritures grounds ethics in what we live from, food, places and other beings; the Manifeste animaliste makes the animal cause a political and democratic project rather than a private morality."
    fr: "Philosophe française. Les Nourritures fonde l'éthique sur ce dont nous vivons, la nourriture, les lieux, les autres êtres ; le Manifeste animaliste fait de la cause animale un projet politique et démocratique plutôt qu'une morale privée."
  seeds:
    - seed: animal-cause-politics
      text:
        en: "The condition of animals is a test of justice that belongs in law and public policy, not only in personal choices."
        fr: "La condition animale est une épreuve de justice qui relève du droit et des politiques publiques, pas seulement des choix personnels."
      source: pelluchon-2017
  works:
    - {id: pelluchon-2015, year: 2015, title: "Les Nourritures : philosophie du corps politique"}
    - {id: pelluchon-2017, year: 2017, title: "Manifeste animaliste : politiser la cause animale"}

- id: elisabeth-de-fontenay
  name: Élisabeth de Fontenay
  sort: Fontenay
  layer: leaf
  branch: animal
  born: 1934
  place: {city: {en: Paris, fr: Paris}, country: {en: France, fr: France}}
  wikidata: Q274715
  lede:
    en: "French philosopher. Le Silence des bêtes reads the whole history of philosophy from the side of the animals it excluded, and refuses both the denial of their suffering and its translation into a utilitarian sum."
    fr: "Philosophe française. Le Silence des bêtes relit toute l'histoire de la philosophie du côté des animaux qu'elle a exclus, et refuse à la fois le déni de leur souffrance et sa conversion en somme utilitariste."
  seeds:
    - seed: silence-of-beasts
      text:
        en: "Philosophy built the human by silencing the animal; justice begins by hearing that silence."
        fr: "La philosophie a construit l'humain en faisant taire l'animal ; la justice commence par entendre ce silence."
      source: fontenay-1998
  works:
    - {id: fontenay-1998, year: 1998, title: "Le Silence des bêtes : la philosophie à l'épreuve de l'animalité"}

- id: florence-burgat
  name: Florence Burgat
  sort: Burgat
  layer: leaf
  branch: animal
  born: 1962
  place: {country: {en: France, fr: France}}
  wikidata: Q3073947
  lede:
    en: "French philosopher. L'Humanité carnivore asks why humans keep eating animals when they no longer need to, and answers that eating meat is a cultural choice to affirm the human by sacrificing the animal."
    fr: "Philosophe française. L'Humanité carnivore demande pourquoi les humains continuent de manger des animaux alors qu'ils n'en ont plus besoin, et répond que manger de la viande est un choix culturel pour affirmer l'humain en sacrifiant l'animal."
  seeds:
    - seed: carnivorous-humanity
      text:
        en: "Meat-eating is not a need but a ritual by which humanity defines itself against the animal."
        fr: "Manger de la viande n'est pas un besoin mais un rite par lequel l'humanité se définit contre l'animal."
      source: burgat-2017
  works:
    - {id: burgat-2017, year: 2017, title: L'Humanité carnivore}

