# Ecological democracy and green populism: who decides, and how a people is
# built around the ecological question.

- id: ernesto-laclau
  name: Ernesto Laclau
  sort: Laclau
  layer: leaf
  branch: democracy
  born: 1935
  died: 2014
  place: {city: {en: Buenos Aires, fr: Buenos Aires}, country: {en: Argentina, fr: Argentine}, lat: -34.60, lon: -58.38}
  wikidata: Q454802
  lede:
    en: "Argentine political theorist at Essex. He wrote little on ecology, but his theory of hegemony and of populism, how scattered demands become a people against an adversary, is the frame in which Mouffe and the green left now think the ecological question."
    fr: "Théoricien politique argentin, à Essex. Il a peu écrit sur l'écologie, mais sa théorie de l'hégémonie et du populisme, la façon dont des demandes éparses deviennent un peuple face à un adversaire, est le cadre dans lequel Mouffe et la gauche verte pensent aujourd'hui la question écologique."
  seeds:
    - seed: chain-of-equivalence
      text:
        en: "Demands with nothing in common become one political force when they are linked against a shared adversary."
        fr: "Des demandes sans rien de commun deviennent une force politique quand elles se lient contre un adversaire partagé."
      source: laclau-2005
  works:
    - id: laclau-1985
      year: 1985
      title: "Hegemony and Socialist Strategy: Towards a Radical Democratic Politics"
      by: {en: Laclau and Mouffe, fr: Laclau et Mouffe}
      note: {en: with Chantal Mouffe, fr: avec Chantal Mouffe}
    - {id: laclau-2005, year: 2005, title: On Populist Reason}

- id: chantal-mouffe
  name: Chantal Mouffe
  sort: Mouffe
  layer: leaf
  branch: democracy
  born: 1943
  place: {city: {en: Charleroi, fr: Charleroi}, country: {en: Belgium, fr: Belgique}, lat: 50.41, lon: 4.44}
  wikidata: Q236173
  lede:
    en: "Belgian political theorist, co-author with Laclau of Hegemony and Socialist Strategy. Democracy lives on conflict between adversaries, not on consensus; she calls for a green democratic revolution that wins people through affects and a shared project rather than through expertise and guilt."
    fr: "Théoricienne politique belge, coautrice avec Laclau d'Hégémonie et stratégie socialiste. La démocratie vit du conflit entre adversaires, non du consensus ; elle appelle à une révolution démocratique verte qui gagne les gens par les affects et un projet partagé plutôt que par l'expertise et la culpabilité."
  seeds:
    - seed: agonism
      text:
        en: "Democracy needs a real conflict between adversaries; consensus politics leaves the field to the populist right."
        fr: "La démocratie a besoin d'un vrai conflit entre adversaires ; la politique du consensus laisse le terrain à la droite populiste."
      source: mouffe-2005
    - seed: green-democratic-revolution
      text:
        en: "Ecology wins when it speaks to protection and security as a democratic project, not as a technical fix or a call to sacrifice."
        fr: "L'écologie gagne quand elle parle de protection et de sécurité comme d'un projet démocratique, non comme d'une solution technique ou d'un appel au sacrifice."
      source: mouffe-2022
  works:
    - {id: mouffe-2005, year: 2005, title: On the Political}
    - {id: mouffe-2022, year: 2022, title: "Towards a Green Democratic Revolution: Left Populism and the Power of Affects"}

- id: john-dryzek
  name: John Dryzek
  sort: Dryzek
  layer: leaf
  branch: democracy
  born: 1953
  wikidata: Q6230210
  lede:
    en: "Political theorist working in Australia, a founder of deliberative democracy. From Rational Ecology onwards he asks which institutions can learn from ecosystems, and maps the competing discourses through which societies argue about the Earth."
    fr: "Théoricien politique, en Australie, l'un des fondateurs de la démocratie délibérative. Depuis Rational Ecology, il cherche quelles institutions peuvent apprendre des écosystèmes, et cartographie les discours rivaux par lesquels les sociétés débattent de la Terre."
  seeds:
    - seed: ecological-rationality
      text:
        en: "Institutions should be judged by their capacity to read and answer ecological feedback, which deliberation does better than markets or bureaucracies."
        fr: "Juger les institutions à leur capacité de lire les signaux écologiques et d'y répondre, ce que la délibération fait mieux que le marché ou la bureaucratie."
      source: dryzek-1987
  works:
    - {id: dryzek-1987, year: 1987, title: "Rational Ecology: Environment and Political Economy"}
    - {id: dryzek-1997, year: 1997, title: "The Politics of the Earth: Environmental Discourses"}

- id: andrew-dobson
  name: Andrew Dobson
  sort: Dobson
  layer: leaf
  branch: democracy
  born: 1957
  place: {country: {en: United Kingdom, fr: Royaume-Uni}}
  wikidata: Q504468
  lede:
    en: "British political theorist. Green Political Thought set ecologism apart from environmentalism, and his ecological citizenship defines duties owed to those who bear one's ecological footprint, wherever they live."
    fr: "Théoricien politique britannique. Green Political Thought distingue l'écologisme de l'environnementalisme, et sa citoyenneté écologique définit des devoirs envers ceux qui portent notre empreinte écologique, où qu'ils vivent."
  seeds:
    - seed: ecological-citizenship
      text:
        en: "Citizenship is owed not only to fellow nationals but to everyone one's ecological footprint reaches."
        fr: "La citoyenneté ne se doit pas seulement aux concitoyens, mais à tous ceux qu'atteint notre empreinte écologique."
      source: dobson-2003
  works:
    - {id: dobson-1990, year: 1990, title: Green Political Thought}
    - {id: dobson-2003, year: 2003, title: Citizenship and the Environment}

- id: dominique-bourg
  name: Dominique Bourg
  sort: Bourg
  layer: leaf
  branch: democracy
  born: 1953
  place: {country: {en: France, fr: France}}
  wikidata: Q3035015
  lede:
    en: "French philosopher, long at Lausanne. With Kerry Whiteside he argues that representative democracy, built for the short term and for individual rights, cannot handle ecological limits, and proposes institutions for the long term such as a chamber of the future."
    fr: "Philosophe français, longtemps à Lausanne. Avec Kerry Whiteside, il soutient que la démocratie représentative, faite pour le court terme et les droits individuels, ne sait pas traiter les limites écologiques, et propose des institutions du long terme, comme une chambre du futur."
  seeds:
    - seed: long-term-institutions
      text:
        en: "Give the long term its own institutions, such as a chamber of the future, since elections only see the next term."
        fr: "Donner au long terme ses propres institutions, comme une chambre du futur, puisque l'élection ne voit que le mandat suivant."
      source: bourg-2010
  works:
    - id: bourg-2010
      year: 2010
      title: "Vers une démocratie écologique : le citoyen, le savant et le politique"
      by: {en: Bourg and Whiteside, fr: Bourg et Whiteside}
      note: {en: with Kerry Whiteside, fr: avec Kerry Whiteside}
