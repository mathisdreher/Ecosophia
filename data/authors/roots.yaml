    fr: "Médecin et socialiste ukrainien. En 1880, il tente d'unir la théorie de la valeur-travail à la thermodynamique : le travail humain est ce qui accroît l'énergie solaire accumulée à la surface de la Terre. Engels lit l'essai sans être convaincu."
