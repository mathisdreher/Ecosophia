- id: henry-david-thoreau
  name: Henry David Thoreau
  sort: Thoreau
  layer: root
  root: romantics
  born: 1817
  died: 1862
  place: {city: {en: "Concord, Massachusetts", fr: "Concord (Massachusetts)"}, country: {en: United States, fr: États-Unis}, lat: 42.46, lon: -71.35}
  wikidata: Q131149
  lede:
    en: "American writer and land surveyor. He spent two years in a cabin by Walden Pond to live deliberately, and a night in jail for refusing to pay a tax to a state that upheld slavery."
    fr: "Écrivain et arpenteur américain. Il passe deux ans dans une cabane au bord de l'étang de Walden pour vivre délibérément, et une nuit en prison pour avoir refusé de payer l'impôt à un État qui maintenait l'esclavage."
  seeds:
    - seed: wildness
      text:
        en: "Not wilderness as a place but wildness as a quality, which a society needs in order to stay alive."
        fr: "Non pas la nature sauvage comme lieu, mais le sauvage comme qualité, dont une société a besoin pour rester vivante."
      source: thoreau-1862
    - seed: voluntary-simplicity
      text:
        en: "Reduce your wants to find out what life requires."
        fr: "Réduire ses besoins pour découvrir ce que la vie exige."
      source: thoreau-1854
    - seed: civil-disobedience
      text:
        en: "A citizen may withdraw cooperation from a government that makes them the agent of injustice."
        fr: "Un citoyen peut retirer sa coopération à un gouvernement qui fait de lui l'agent d'une injustice."
      source: thoreau-1849
  quote:
    text: "In Wildness is the preservation of the World."
    lang: en
    source: thoreau-1862
    gloss: {fr: "C'est dans le sauvage que réside la préservation du monde."}
  works:
