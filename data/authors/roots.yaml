- id: francois-quesnay
  name: François Quesnay
  sort: Quesnay
  layer: root
  root: physiocrats
  born: 1694
  died: 1774
  place: {city: {en: Méré, fr: Méré}, country: {en: France, fr: France}, lat: 48.785, lon: 1.815}
  wikidata: Q13575
  lede:
    en: "Physician at the court of Louis XV and founder of the physiocrats. His Tableau économique pictures the economy as a circulation fed by the land, the only source of a net product."
    fr: "Médecin à la cour de Louis XV et fondateur de la physiocratie. Son Tableau économique représente l'économie comme une circulation alimentée par la terre, seule source d'un produit net."
  seeds:
    - seed: net-product
      text:
        en: "Only agriculture yields more than it consumes: wealth begins in the soil."
        fr: "Seule l'agriculture rend plus qu'elle ne consomme : la richesse commence dans le sol."
      source: quesnay-1758
  works:
    - {id: quesnay-1758, year: 1758, title: Tableau économique}

- id: anne-robert-jacques-turgot
  name: Anne Robert Jacques Turgot
  sort: Turgot
  layer: root
  root: physiocrats
  born: 1727
  died: 1781
  place: {city: {en: Paris, fr: Paris}, country: {en: France, fr: France}, lat: 48.857, lon: 2.352}
  wikidata: Q221303
  lede:
    en: "Economist and minister of Louis XVI, close to the physiocrats without joining them. He stated the law of diminishing returns in agriculture: past a certain point, more work on the same land yields less and less."
    fr: "Économiste et ministre de Louis XVI, proche des physiocrates sans s'y rallier. Il énonce la loi des rendements décroissants en agriculture : passé un certain point, davantage de travail sur la même terre rapporte de moins en moins."
  seeds:
    - seed: diminishing-returns
      text:
        en: "The soil does not answer effort in proportion: each further advance returns less."
        fr: "Le sol ne répond pas à l'effort en proportion : chaque avance supplémentaire rend moins."
      source: turgot-1767
  works:
    - {id: turgot-1766, year: 1766, title: Réflexions sur la formation et la distribution des richesses}
    - {id: turgot-1767, year: 1767, title: Observations sur le mémoire de M. de Saint-Péravy, kind: article}

- id: alexander-von-humboldt
  name: Alexander von Humboldt
  sort: Humboldt
