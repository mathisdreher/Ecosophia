    fr: "Radiochimiste anglais, prix Nobel en 1921. Après la Première Guerre mondiale, il se tourne vers l'économie et soutient que la richesse réelle est un flux d'énergie soumis à la thermodynamique, tandis que la dette croît selon les règles de l'arithmétique."
