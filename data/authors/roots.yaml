  root: naturalists
  born: 1769
  died: 1859
  place: {city: {en: Berlin, fr: Berlin}, country: {en: Germany, fr: Allemagne}, lat: 52.52, lon: 13.405}
  wikidata: Q6694
  lede:
    en: "Prussian naturalist and explorer. From his American journey of 1799 to 1804 he drew a picture of nature as a web of forces in which climate, plants and human activity depend on one another."
    fr: "Naturaliste et explorateur prussien. De son voyage américain de 1799 à 1804, il tire un tableau de la nature comme tissu de forces où le climat, les plantes et l'activité humaine dépendent les uns des autres."
  seeds:
    - seed: unity-of-nature
      text:
        en: "Nothing in nature stands alone: to describe a plant is to describe its altitude, its climate and its neighbours."
        fr: "Rien dans la nature n'est isolé : décrire une plante, c'est décrire son altitude, son climat et ses voisines."
