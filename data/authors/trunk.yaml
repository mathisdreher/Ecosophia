# Authors of founding texts who do not sit on a branch. layer: trunk.

- id: rachel-carson
  name: Rachel Carson
  sort: Carson
  layer: trunk
  born: 1907
  died: 1964
  place: {city: {en: "Springdale, Pennsylvania", fr: "Springdale (Pennsylvanie)"}, country: {en: United States, fr: États-Unis}, lat: 40.54, lon: -79.78}
  wikidata: Q100948
  lede:
    en: "American marine biologist and writer. Silent Spring documented what synthetic pesticides do along the food chain and turned a technical question into a public one."
    fr: "Biologiste marine et écrivaine américaine. Printemps silencieux documente ce que les pesticides de synthèse font le long de la chaîne alimentaire et transforme une question technique en question publique."
  seeds:
    - seed: biocide
      text:
        en: "A poison sprayed on insects does not stop at insects: it travels up the food chain to birds, fish and children."
        fr: "Un poison répandu sur les insectes ne s'arrête pas aux insectes : il remonte la chaîne alimentaire jusqu'aux oiseaux, aux poissons et aux enfants."
      source: carson-1962
  works:
    - {id: carson-1951, year: 1951, title: The Sea Around Us}
    - {id: carson-1962, year: 1962, title: Silent Spring}

- id: donella-meadows
  name: Donella Meadows
  sort: Meadows
  layer: trunk
  born: 1941
  died: 2001
  place: {city: {en: "Elgin, Illinois", fr: "Elgin (Illinois)"}, country: {en: United States, fr: États-Unis}, lat: 42.04, lon: -88.28}
  wikidata: Q271226
  lede:
    en: "American systems scientist. Lead author of The Limits to Growth, the report to the Club of Rome that modelled the growth of population and industry on a finite planet."
    fr: "Scientifique américaine, spécialiste de la dynamique des systèmes. Première autrice des Limites à la croissance, le rapport au Club de Rome qui modélise la croissance de la population et de l'industrie sur une planète finie."
  seeds:
    - seed: limits-to-growth
      text:
        en: "Exponential growth in a finite system ends, by choice or by collapse."
        fr: "Une croissance exponentielle dans un système fini s'arrête, par choix ou par effondrement."
      source: meadows-1972
    - seed: overshoot
      text:
        en: "A system can exceed its limits for a time, because the signals that would stop it arrive late."
        fr: "Un système peut dépasser ses limites un temps, parce que les signaux qui l'arrêteraient arrivent tard."
      source: meadows-1972
  works:
    - id: meadows-1972
      year: 1972
      title: The Limits to Growth
      kind: report
      by: {en: Meadows et al., fr: Meadows et al.}
      note: {en: "with Dennis Meadows, Jørgen Randers and William W. Behrens III", fr: "avec Dennis Meadows, Jørgen Randers et William W. Behrens III"}
    - {id: meadows-2008, year: 2008, title: "Thinking in Systems: A Primer", note: {en: posthumous, fr: posthume}}

- id: barry-commoner
  name: Barry Commoner
  sort: Commoner
  layer: trunk
  born: 1917
  died: 2012
  place: {city: {en: "Brooklyn, New York", fr: "Brooklyn (New York)"}, country: {en: United States, fr: États-Unis}, lat: 40.68, lon: -73.94}
  wikidata: Q2306796
  lede:
    en: "American biologist and campaigner against atmospheric nuclear tests. The Closing Circle blamed post-war production technologies, rather than population, for pollution; he ran for the presidency of the United States in 1980 for the Citizens Party."
    fr: "Biologiste américain, militant contre les essais nucléaires atmosphériques. L'Encerclement impute la pollution aux techniques de production d'après-guerre plutôt qu'à la population ; il se présente à la présidence des États-Unis en 1980 pour le Citizens Party."
  seeds:
    - seed: laws-of-ecology
      text:
        en: "Everything is connected to everything else, everything must go somewhere, nature knows best, there is no free lunch."
        fr: "Tout est lié à tout, tout doit aller quelque part, la nature sait mieux, rien n'est gratuit."
      source: commoner-1971
  works:
    - {id: commoner-1971, year: 1971, title: "The Closing Circle: Nature, Man, and Technology"}

- id: kenneth-boulding
  name: Kenneth E. Boulding
  sort: Boulding
  layer: trunk
  born: 1910
  died: 1993
  place: {city: {en: Liverpool, fr: Liverpool}, country: {en: United Kingdom, fr: Royaume-Uni}, lat: 53.41, lon: -2.98}
  wikidata: Q505520
  lede:
    en: "British-born American economist, Quaker and peace researcher. His essay of 1966 contrasted the open cowboy economy of the past with the closed spaceship economy of a finite Earth, where throughput is a cost to be cut, not a measure of success."
    fr: "Économiste américain né en Angleterre, quaker et chercheur sur la paix. Son essai de 1966 oppose l'économie ouverte du cow-boy à l'économie fermée du vaisseau spatial qu'impose une Terre finie, où le flux de matière est un coût à réduire et non une mesure du succès."
  seeds:
    - seed: spaceship-earth
      text:
        en: "On a closed ship, the less we consume to keep the crew well, the better."
        fr: "Dans un vaisseau fermé, moins l'on consomme pour maintenir l'équipage en bonne santé, mieux c'est."
      source: boulding-1966
  works:
    - {id: boulding-1966, year: 1966, title: "The Economics of the Coming Spaceship Earth", kind: chapter, in: Environmental Quality in a Growing Economy}

- id: lynn-white
  name: Lynn White Jr.
  sort: White
  layer: trunk
  born: 1907
  died: 1987
  place: {city: {en: "San Francisco, California", fr: "San Francisco (Californie)"}, country: {en: United States, fr: États-Unis}, lat: 37.77, lon: -122.42}
  lede:
    en: "American historian of medieval technology. A short lecture printed in Science in 1967 laid the ecological crisis at the door of Western Christianity, and opened a debate on religion and nature that has not closed."
    fr: "Historien américain des techniques médiévales. Une courte conférence publiée dans Science en 1967 impute la crise écologique au christianisme occidental et ouvre un débat sur la religion et la nature qui ne s'est pas refermé."
  seeds:
    - seed: roots-of-the-crisis
      text:
        en: "By setting humans apart from and above nature, Western Christianity prepared the attitude that science and technology then put to work."
        fr: "En plaçant l'humain à part et au-dessus de la nature, le christianisme occidental prépare l'attitude que la science et la technique mettront ensuite en œuvre."
      source: white-1967
  works:
    - {id: white-1967, year: 1967, title: The Historical Roots of Our Ecologic Crisis, kind: article, in: Science, issue: "155"}

- id: garrett-hardin
  name: Garrett Hardin
  sort: Hardin
  layer: trunk
  born: 1915
  died: 2003
  place: {city: {en: "Dallas, Texas", fr: "Dallas (Texas)"}, country: {en: United States, fr: États-Unis}, lat: 32.78, lon: -96.80}
  wikidata: Q592132
  lede:
    en: "American ecologist. His essay of 1968 argued that a resource open to all is ruined by each user's rational choice, and drew from it a case for coercive limits on population; Elinor Ostrom's work on commons answered it."
    fr: "Écologue américain. Son essai de 1968 soutient qu'une ressource ouverte à tous est ruinée par le choix rationnel de chaque usager, et en tire la nécessité de limites contraignantes à la population ; les travaux d'Elinor Ostrom sur les communs lui répondent."
  seeds:
    - seed: tragedy-of-the-commons
      text:
        en: "Freedom in a commons brings ruin to all: only mutual coercion, mutually agreed upon, can save it."
        fr: "La liberté dans un bien commun mène tout le monde à la ruine : seule une coercition mutuelle, mutuellement consentie, peut le sauver."
      source: hardin-1968
  works:
    - {id: hardin-1968, year: 1968, title: The Tragedy of the Commons, kind: article, in: Science, issue: "162"}

- id: paul-ehrlich
  name: Paul R. Ehrlich
  sort: Ehrlich
  layer: trunk
  born: 1932
  died: 2026
  place: {city: {en: "Philadelphia, Pennsylvania", fr: "Philadelphie (Pennsylvanie)"}, country: {en: United States, fr: États-Unis}, lat: 39.95, lon: -75.17}
  wikidata: Q377983
  lede:
    en: "American biologist, specialist of butterflies, at Stanford. The Population Bomb, written with Anne Ehrlich, made population growth the centre of the environmental question in 1968; its forecasts of mass famine did not come to pass, and its framing was contested from the start."
    fr: "Biologiste américain, spécialiste des papillons, à Stanford. La Bombe P, écrite avec Anne Ehrlich, fait en 1968 de la croissance démographique le centre de la question environnementale ; ses prévisions de famines massives ne se sont pas réalisées et son cadrage a été contesté dès le départ."
  seeds:
    - seed: population-bomb
      text:
        en: "Population growth outruns food and resources: the cause of the crisis is too many people."
        fr: "La croissance de la population dépasse celle des vivres et des ressources : la cause de la crise est le trop grand nombre d'humains."
      source: ehrlich-1968
  works:
    - {id: ehrlich-1968, year: 1968, title: The Population Bomb}

- id: christopher-stone
  name: Christopher D. Stone
  sort: Stone
  layer: trunk
  born: 1937
  died: 2021
  place: {city: {en: New York, fr: New York}, country: {en: United States, fr: États-Unis}, lat: 40.71, lon: -74.01}
  wikidata: Q112438509
  lede:
    en: "American law professor at the University of Southern California. His article of 1972 asked whether forests, rivers and oceans could be parties to a lawsuit, and became the founding text of the rights of nature."
    fr: "Professeur de droit américain à l'université de Californie du Sud. Son article de 1972 demande si des forêts, des rivières et des océans peuvent être parties à un procès, et devient le texte fondateur des droits de la nature."
  seeds:
    - seed: rights-of-nature
      text:
        en: "Natural objects can be given legal standing, with guardians who speak for them in court."
        fr: "Les objets naturels peuvent recevoir la qualité pour agir, avec des tuteurs qui parlent pour eux devant le juge."
      source: stone-1972
  works:
    - {id: stone-1972, year: 1972, title: "Should Trees Have Standing? Toward Legal Rights for Natural Objects", kind: article, in: Southern California Law Review, issue: "45"}

- id: ernst-friedrich-schumacher
  name: E. F. Schumacher
  sort: Schumacher
  layer: trunk
  born: 1911
  died: 1977
  place: {city: {en: Bonn, fr: Bonn}, country: {en: Germany, fr: Allemagne}, lat: 50.74, lon: 7.10}
  wikidata: Q76526
  lede:
    en: "German-born British economist, for twenty years at the National Coal Board. Small Is Beautiful asked for an economics as if people mattered: production at a human scale, with tools that local communities can make and control."
    fr: "Économiste britannique né en Allemagne, vingt ans au National Coal Board. Small Is Beautiful demande une économie qui compte avec les personnes : une production à échelle humaine, avec des outils que les communautés locales peuvent fabriquer et maîtriser."
  seeds:
    - seed: intermediate-technology
      text:
        en: "Between the hoe and the tractor lies a technology that is cheap, simple and within reach of the people who use it."
        fr: "Entre la houe et le tracteur, il existe une technique bon marché, simple et à la portée de celles et ceux qui s'en servent."
      source: schumacher-1973
  works:
    - {id: schumacher-1973, year: 1973, title: "Small Is Beautiful: A Study of Economics as if People Mattered"}

- id: rene-dumont
  name: René Dumont
  sort: Dumont
  layer: trunk
  born: 1904
  died: 2001
  place: {city: {en: Cambrai, fr: Cambrai}, country: {en: France, fr: France}, lat: 50.18, lon: 3.24}
  wikidata: Q927879
  lede:
    en: "French agronomist of the Third World and author of L'Afrique noire est mal partie. In 1974 he was the first candidate of political ecology in a French presidential election, with a glass of water to announce its coming scarcity."
    fr: "Agronome français, spécialiste du tiers-monde, auteur de L'Afrique noire est mal partie. En 1974, il est le premier candidat de l'écologie politique à une élection présidentielle française, un verre d'eau à la main pour en annoncer la rareté prochaine."
  seeds:
    - seed: ecology-and-the-third-world
      text:
        en: "The consumption of the rich countries is paid for by the hunger of the poor: ecology begins with that inequality."
        fr: "La consommation des pays riches se paie de la faim des pays pauvres : l'écologie commence par cette inégalité."
      source: dumont-1973
  works:
    - {id: dumont-1973, year: 1973, title: "L'Utopie ou la mort !"}
