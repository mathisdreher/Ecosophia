- id: laura-pulido
  name: Laura Pulido
  sort: Pulido
  layer: leaf
  branch: decolonial
  also: [political-ecology]
  place: {country: {en: United States, fr: États-Unis}}
  wikidata: Q61951480
  lede:
    en: "American geographer and scholar of ethnic studies, at the University of Oregon. Studying Los Angeles, she argued that environmental racism comes less from deliberate siting decisions than from white privilege built into urban development."
    fr: "Géographe américaine, spécialiste des études ethniques, à l'université de l'Oregon. À partir de Los Angeles, elle soutient que le racisme environnemental tient moins à des décisions d'implantation délibérées qu'au privilège blanc inscrit dans le développement urbain."
  seeds:
    - seed: environmental-racism
      text:
        en: "Polluted neighbourhoods are produced by the whole history of where white residents could move, not only by where plants were sited."
        fr: "Les quartiers pollués sont produits par toute l'histoire des lieux où les Blancs ont pu s'installer, et pas seulement par l'implantation des usines."
      source: pulido-2000
  works:
    - {id: pulido-2000, year: 2000, title: "Rethinking Environmental Racism: White Privilege and Urban Development in Southern California", kind: article, in: Annals of the Association of American Geographers, issue: "90 (1)"}

- id: thomas-sankara
  name: Thomas Sankara
  sort: Sankara
  layer: leaf
  branch: decolonial
