        en: "Left and right governments alike accepted the export of raw materials as the only path, and made dissent look like a refusal of progress."
        fr: "Gouvernements de gauche comme de droite ont accepté l'exportation de matières premières comme seule voie, et fait passer la contestation pour un refus du progrès."
