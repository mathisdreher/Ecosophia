    fr: "Sociologue et écrivaine argentine. Elle décrit le consensus des commodities qui a lié les gouvernements latino-américains, de gauche comme de droite, à l'exportation de matières premières, et le tournant éco-territorial des luttes qui s'y opposent."
  seeds:
