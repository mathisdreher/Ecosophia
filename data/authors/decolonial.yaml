    fr: "Analyste uruguayen au Centre latino-américain d'écologie sociale de Montevideo. Il nomme le néo-extractivisme : les gouvernements progressistes d'Amérique latine ont gardé les mines et le pétrole au centre de leurs économies et en ont dépensé les revenus en programmes sociaux."
