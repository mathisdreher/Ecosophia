  died: 1987
  place: {city: {en: Yako, fr: Yako}, country: {en: Burkina Faso, fr: Burkina Faso}, lat: 12.96, lon: -2.26}
  lede:
    en: "President of Burkina Faso from 1983 until his assassination in 1987. His government planted millions of trees against the advance of the Sahel and fought bushfires and unregulated woodcutting, as part of a politics of self-reliance against debt and dependency."
    fr: "Président du Burkina Faso de 1983 à son assassinat en 1987. Son gouvernement fait planter des millions d'arbres contre l'avancée du Sahel et combat les feux de brousse et la coupe abusive du bois, dans une politique d'autonomie contre la dette et la dépendance."
  seeds:
    - seed: trees-against-the-desert
      text:
        en: "Saving the tree is saving the people: the fight against the desert is a fight against hunger and against imperialism."
        fr: "Sauver l'arbre, c'est sauver le peuple : la lutte contre le désert est une lutte contre la faim et contre l'impérialisme."
      source: sankara-1986
  works:
