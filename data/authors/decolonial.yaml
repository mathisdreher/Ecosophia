    fr: "Économiste, écrivain et musicien sénégalais. Afrotopia invite l'Afrique à cesser de se mesurer à un développement dessiné ailleurs et à fixer ses propres fins, à partir de ses cultures et de ses rapports au vivant."
  seeds:
    - seed: afrotopia
