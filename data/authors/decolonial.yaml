        en: "Africa does not have to catch up: it can define its own idea of a good life, which need not be growth."
        fr: "L'Afrique n'a pas à rattraper : elle peut définir sa propre idée de la vie bonne, qui n'est pas forcément la croissance."
      source: sarr-2016
  works:
    - {id: sarr-2016, year: 2016, title: Afrotopia}

- id: ailton-krenak
