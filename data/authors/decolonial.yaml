- id: fatima-ouassak
  name: Fatima Ouassak
  sort: Ouassak
  layer: leaf
  branch: decolonial
  born: 1976
  lede:
    en: "French political scientist and activist, co-founder of the Front de mères, a union of parents in working-class neighbourhoods. Pour une écologie pirate argues that the banlieues are not outside ecology but a place from which to rethink it, against an ecology that polices them."
    fr: "Politologue et militante française, cofondatrice du Front de mères, syndicat de parents des quartiers populaires. Pour une écologie pirate soutient que les banlieues ne sont pas hors de l'écologie mais un lieu d'où la repenser, contre une écologie qui les police."
  seeds:
    - seed: pirate-ecology
      text:
        en: "The working-class neighbourhoods, kept from land and air, can claim an ecology of freedom instead of being its target."
        fr: "Les quartiers populaires, privés de terre et d'air, peuvent revendiquer une écologie de la liberté au lieu d'en être la cible."
      source: ouassak-2023
  works:
    - {id: ouassak-2020, year: 2020, title: "La Puissance des mères : pour un nouveau sujet révolutionnaire"}
    - {id: ouassak-2023, year: 2023, title: "Pour une écologie pirate : et nous serons libres"}
