        en: "Oil extraction waged an ecological war on the Ogoni: their land, water and air were taken without their consent or their share."
        fr: "L'extraction pétrolière a mené une guerre écologique contre les Ogonis : leurs terres, leurs eaux et leur air leur ont été pris sans leur accord ni leur part."
