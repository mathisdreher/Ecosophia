- id: nnimmo-bassey
  name: Nnimmo Bassey
  sort: Bassey
  layer: leaf
  branch: decolonial
  born: 1958
  place: {country: {en: Nigeria, fr: Nigeria}}
  lede:
    en: "Nigerian architect, poet and environmental campaigner, founder of the Health of Mother Earth Foundation and former chair of Friends of the Earth International. He describes Africa as the continent that bears the extraction and the heat of a climate it did little to change."
    fr: "Architecte, poète et militant écologiste nigérian, fondateur de la Health of Mother Earth Foundation et ancien président des Amis de la Terre International. Il décrit l'Afrique comme le continent qui subit l'extraction et la chaleur d'un climat qu'il a peu contribué à changer."
  seeds:
    - seed: extractivism
      text:
        en: "Africa is cooked twice: by the extraction of its oil and minerals, and by the warming that this extraction feeds."
        fr: "L'Afrique est cuite deux fois : par l'extraction de son pétrole et de ses minerais, et par le réchauffement que cette extraction nourrit."
      source: bassey-2012
  works:
    - {id: bassey-2012, year: 2012, title: "To Cook a Continent: Destructive Extraction and the Climate Crisis in Africa"}

- id: felwine-sarr
