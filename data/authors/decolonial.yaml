# Decolonial ecology and environmental justice.

- id: malcom-ferdinand
  name: Malcom Ferdinand
  sort: Ferdinand
  layer: leaf
  branch: decolonial
  born: 1985
  place: {city: {en: Martinique, fr: Martinique}, country: {en: France, fr: France}, lat: 14.64, lon: -61.02}
  wikidata: Q100145747
  lede:
    en: "Martinican engineer and political scientist, researcher at the CNRS in Paris. He thinks the ecological crisis from the Caribbean: against an environmentalism that boards Noah's Ark and forgets who is left ashore, he sets the hold of the slave ship."
    fr: "Ingénieur et politiste martiniquais, chercheur au CNRS à Paris. Il pense la crise écologique depuis la Caraïbe : à un environnementalisme qui embarque sur l'arche de Noé en oubliant qui reste à quai, il oppose la cale du navire négrier."
  seeds:
    - seed: double-fracture
      text:
        en: "Environmental thought and anticolonial thought have grown apart: each forgets what the other knows."
        fr: "La pensée environnementale et la pensée anticoloniale ont grandi séparément : chacune oublie ce que l'autre sait."
      source: ferdinand-2019
    - seed: colonial-inhabitation
      text:
        en: "The plantation is a way of living on the Earth that clears land, imports labour and exports the harvest."
        fr: "La plantation est une manière d'habiter la Terre qui défriche, importe la main-d'œuvre et exporte la récolte."
      source: ferdinand-2019
    - seed: world-ship
      text:
        en: "Leave both the ark and the slave ship for a vessel where humans and non-humans meet on one deck."
        fr: "Quitter l'arche comme le navire négrier pour un navire où humains et non-humains se rencontrent sur un même pont."
      source: ferdinand-2019
  works:
    - {id: ferdinand-2019, year: 2019, title: "Une écologie décoloniale : penser l'écologie depuis le monde caribéen"}
    - {id: ferdinand-2024, year: 2024, title: "S'aimer la Terre : défaire l'habiter colonial"}

- id: ramachandra-guha
  name: Ramachandra Guha
  sort: Guha
  layer: leaf
  branch: decolonial
  also: [political-ecology]
  born: 1958
  place: {city: {en: Dehradun, fr: Dehradun}, country: {en: India, fr: Inde}, lat: 30.32, lon: 78.03}
  wikidata: Q3521662
  lede:
    en: "Indian historian. The Unquiet Woods is a history of peasant resistance in the Himalayan forests up to the Chipko movement; the same year he criticised deep ecology and wilderness protection as luxuries that displace the rural poor when exported to India."
    fr: "Historien indien. The Unquiet Woods retrace la résistance paysanne dans les forêts de l'Himalaya jusqu'au mouvement Chipko ; la même année, il critique l'écologie profonde et la protection de la nature sauvage comme des luxes qui, exportés en Inde, déplacent les ruraux pauvres."
  seeds:
    - seed: wilderness-critique
      text:
        en: "Tiger reserves designed on the American model evict the villagers who lived with the forest."
        fr: "Les réserves de tigres conçues sur le modèle américain expulsent les villageois qui vivaient avec la forêt."
      source: guha-1989b
    - seed: environmentalism-of-the-poor
      text:
        en: "In India the environmental movement is a movement for livelihood: forests, water, grazing land."
        fr: "En Inde, le mouvement écologiste est un mouvement pour les moyens de vivre : forêts, eau, pâturages."
      source: guha-1997
    - seed: omnivores
      text:
        en: "Omnivores consume the resources of the whole country; ecosystem people live from their locality and pay the price."
        fr: "Les omnivores consomment les ressources de tout le pays ; les gens des écosystèmes vivent de leur localité et en paient le prix."
      source: guha-1995
  works:
    - {id: guha-1989, year: 1989, title: "The Unquiet Woods: Ecological Change and Peasant Resistance in the Himalaya"}
    - {id: guha-1989b, year: 1989, title: "Radical American Environmentalism and Wilderness Preservation: A Third World Critique", kind: article, in: Environmental Ethics, issue: "11"}
    - id: guha-1995
      year: 1995
      title: "Ecology and Equity: The Use and Abuse of Nature in Contemporary India"
      by: {en: Gadgil and Guha, fr: Gadgil et Guha}
      note: {en: with Madhav Gadgil, fr: avec Madhav Gadgil}
      key: false
    - id: guha-1997
      year: 1997
      title: "Varieties of Environmentalism: Essays North and South"
      by: {en: Guha and Martínez-Alier, fr: Guha et Martínez-Alier}
      note: {en: with Joan Martínez-Alier, fr: avec Joan Martínez-Alier}
    - {id: guha-2000, year: 2000, title: "Environmentalism: A Global History"}

- id: robert-bullard
  name: Robert D. Bullard
  sort: Bullard
  layer: leaf
  branch: decolonial
  born: 1946
  place: {city: {en: "Elba, Alabama", fr: "Elba (Alabama)"}, country: {en: United States, fr: États-Unis}, lat: 31.41, lon: -86.07}
  wikidata: Q7343289
  lede:
    en: "American sociologist at Texas Southern University. Starting from a 1979 lawsuit over a landfill in a Black neighbourhood of Houston, he documented that waste sites follow race more closely than income, and gave the environmental justice movement its evidence."
    fr: "Sociologue américain à la Texas Southern University. À partir d'un procès de 1979 contre une décharge dans un quartier noir de Houston, il établit que les sites de déchets suivent la race de plus près que le revenu, et donne ses preuves au mouvement pour la justice environnementale."
  seeds:
    - seed: environmental-racism
      text:
        en: "Landfills and incinerators are sited where residents are Black and politically weak."
        fr: "Les décharges et les incinérateurs s'installent là où les habitants sont noirs et politiquement faibles."
      source: bullard-1990
    - seed: environmental-justice
      text:
        en: "No community should bear a larger share of pollution because of its race or its income."
        fr: "Aucune communauté ne devrait supporter une part plus grande de la pollution en raison de sa race ou de son revenu."
      source: bullard-1990
  works:
    - {id: bullard-1990, year: 1990, title: "Dumping in Dixie: Race, Class, and Environmental Quality"}
    - {id: bullard-1993, year: 1993, title: "Confronting Environmental Racism: Voices from the Grassroots", note: {en: editor, fr: direction}}

- id: aime-cesaire
  name: Aimé Césaire
  sort: Césaire
  layer: leaf
  branch: decolonial
  born: 1913
  died: 2008
  place: {city: {en: "Basse-Pointe, Martinique", fr: "Basse-Pointe (Martinique)"}, country: {en: France, fr: France}, lat: 14.87, lon: -61.12}
  lede:
    en: "Martinican poet, playwright and politician, co-founder of the négritude movement and mayor of Fort-de-France for over half a century. His Discourse on Colonialism describes colonisation as a machine that turns people and lands into things."
    fr: "Poète, dramaturge et homme politique martiniquais, cofondateur du mouvement de la négritude et maire de Fort-de-France pendant plus d'un demi-siècle. Son Discours sur le colonialisme décrit la colonisation comme une machine qui change les peuples et les terres en choses."
  seeds:
    - seed: thingification
      text:
        en: "Colonisation reduces the colonised to things, and degrades the coloniser along the way."
        fr: "La colonisation réduit le colonisé à une chose, et ensauvage le colonisateur au passage."
      source: cesaire-1950
  works:
    - {id: cesaire-1950, year: 1950, title: Discours sur le colonialisme, tr: {en: "Discourse on Colonialism, 1972"}}

- id: alberto-acosta
  name: Alberto Acosta
  sort: Acosta
  layer: leaf
  branch: decolonial
  also: [degrowth]
  born: 1948
  place: {city: {en: Quito, fr: Quito}, country: {en: Ecuador, fr: Équateur}, lat: -0.18, lon: -78.47}
  lede:
    en: "Ecuadorian economist and politician. As president of the Constituent Assembly of 2007 and 2008, he helped write the first constitution to grant rights to nature, and he has since defended buen vivir as an alternative to development rather than a kind of it."
    fr: "Économiste et homme politique équatorien. Président de l'Assemblée constituante de 2007 et 2008, il contribue à la première constitution qui reconnaît des droits à la nature, et défend depuis le buen vivir comme une alternative au développement plutôt qu'une variante de celui-ci."
  seeds:
    - seed: buen-vivir
      text:
        en: "Sumak kawsay, a good life in community and with nature, not a higher income."
        fr: "Le sumak kawsay, une vie bonne en communauté et avec la nature, et non un revenu plus élevé."
      source: acosta-2012
  works:
    - {id: acosta-2012, year: 2012, title: "El buen vivir: Sumak Kawsay, una oportunidad para imaginar otros mundos"}
    - id: acosta-2019
      year: 2019
      title: "Pluriverse: A Post-Development Dictionary"
      by: {en: "Kothari, Salleh, Escobar, Demaria and Acosta", fr: "Kothari, Salleh, Escobar, Demaria et Acosta"}
      note: {en: "edited with Ashish Kothari, Ariel Salleh, Arturo Escobar and Federico Demaria", fr: "dirigé avec Ashish Kothari, Ariel Salleh, Arturo Escobar et Federico Demaria"}

- id: robin-wall-kimmerer
  name: Robin Wall Kimmerer
  sort: Kimmerer
  layer: leaf
  branch: decolonial
  born: 1953
  place: {country: {en: United States, fr: États-Unis}}
  lede:
    en: "American botanist and writer, an enrolled member of the Citizen Potawatomi Nation, who taught at the State University of New York College of Environmental Science and Forestry. Braiding Sweetgrass sets the knowledge of plant science beside Indigenous teachings on reciprocity."
    fr: "Botaniste et écrivaine américaine, membre de la Citizen Potawatomi Nation, enseignante à la faculté des sciences de l'environnement et de la forêt de l'université d'État de New York. Tresser les herbes sacrées place le savoir botanique à côté des enseignements autochtones sur la réciprocité."
  seeds:
    - seed: honorable-harvest
      text:
        en: "Take only what is given, never the first or the last, and give something back."
        fr: "Ne prendre que ce qui est donné, jamais le premier ni le dernier, et rendre quelque chose en retour."
      source: kimmerer-2013
    - seed: gift-economy
      text:
        en: "Wealth that circulates as a gift binds people and land; wealth that is stored divides them."
        fr: "La richesse qui circule comme un don lie les gens et la terre ; la richesse que l'on stocke les sépare."
      source: kimmerer-2024
  works:
    - {id: kimmerer-2013, year: 2013, title: "Braiding Sweetgrass: Indigenous Wisdom, Scientific Knowledge and the Teachings of Plants"}
    - {id: kimmerer-2024, year: 2024, title: "The Serviceberry: Abundance and Reciprocity in the Natural World"}

- id: amitav-ghosh
  name: Amitav Ghosh
  sort: Ghosh
  layer: leaf
  branch: decolonial
  also: [anthropocene]
  born: 1956
  place: {city: {en: "Calcutta (now Kolkata)", fr: "Calcutta (aujourd'hui Kolkata)"}, country: {en: India, fr: Inde}, lat: 22.57, lon: 88.36}
  lede:
    en: "Indian novelist and essayist. The Great Derangement asks why modern fiction cannot tell climate change; The Nutmeg's Curse traces the crisis to the colonial conquest that treated land and its peoples as inert resources."
    fr: "Romancier et essayiste indien. Le Grand Dérangement demande pourquoi la fiction moderne ne sait pas raconter le changement climatique ; La Malédiction de la muscade fait remonter la crise à la conquête coloniale, qui traitait les terres et leurs peuples comme des ressources inertes."
  seeds:
    - seed: great-derangement
      text:
        en: "A culture whose novels exclude the improbable cannot imagine the climate it is making."
        fr: "Une culture dont les romans excluent l'improbable ne peut pas imaginer le climat qu'elle fabrique."
      source: ghosh-2016
    - seed: colonial-terraforming
      text:
        en: "The planetary crisis began with conquests that remade whole landscapes for a single crop."
        fr: "La crise planétaire commence avec des conquêtes qui refont des paysages entiers pour une seule culture."
      source: ghosh-2021
  works:
    - {id: ghosh-2016, year: 2016, title: "The Great Derangement: Climate Change and the Unthinkable"}
    - {id: ghosh-2021, year: 2021, title: "The Nutmeg's Curse: Parables for a Planet in Crisis"}
