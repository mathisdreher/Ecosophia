# Political ecology as a discipline (geography, anthropology, ecological economics).

- id: joan-martinez-alier
  name: Joan Martínez-Alier
  sort: Martínez-Alier
  layer: leaf
  branch: political-ecology
  also: [degrowth]
  born: 1939
  place: {city: {en: Barcelona, fr: Barcelone}, country: {en: Spain, fr: Espagne}, lat: 41.39, lon: 2.17}
  wikidata: Q1999236
  lede:
    en: "Catalan economist, emeritus at the Autonomous University of Barcelona and a founder of ecological economics. He studies conflicts over mines, dams and plantations as an environmentalism of the poor, and directs the Environmental Justice Atlas that maps them."
    fr: "Économiste catalan, professeur émérite à l'université autonome de Barcelone et l'un des fondateurs de l'économie écologique. Il étudie les conflits autour des mines, des barrages et des plantations comme un écologisme des pauvres, et dirige l'Atlas de la justice environnementale qui les cartographie."
  seeds:
    - seed: environmentalism-of-the-poor
      text:
        en: "People who defend a forest or a river to live from it are environmentalists, whatever they call themselves."
        fr: "Celles et ceux qui défendent une forêt ou un fleuve pour en vivre sont des écologistes, quel que soit le nom qu'ils se donnent."
      source: martinez-alier-2002
    - seed: ecological-distribution-conflicts
      text:
        en: "Conflicts over who bears pollution and who gets the resource, fought in several languages of value."
        fr: "Des conflits sur qui supporte la pollution et qui obtient la ressource, menés dans plusieurs langages de valeur."
      source: martinez-alier-2002
    - seed: ecological-debt
      text:
        en: "The North owes the South for resources taken cheaply and for the atmosphere it has filled."
        fr: "Le Nord doit au Sud les ressources prises à bas prix et l'atmosphère qu'il a saturée."
      source: martinez-alier-2002
  works:
    - {id: martinez-alier-1987, year: 1987, title: "Ecological Economics: Energy, Environment and Society"}
    - {id: martinez-alier-2002, year: 2002, title: "The Environmentalism of the Poor: A Study of Ecological Conflicts and Valuation"}

- id: arturo-escobar
  name: Arturo Escobar
  sort: Escobar
  layer: leaf
  branch: political-ecology
  also: [decolonial]
  born: 1952
  place: {city: {en: Manizales, fr: Manizales}, country: {en: Colombia, fr: Colombie}, lat: 5.07, lon: -75.52}
  wikidata: Q4801729
  lede:
    en: "Colombian anthropologist, emeritus at the University of North Carolina at Chapel Hill. Encountering Development reads development as a discourse that invented the Third World; his later work with Afro-Colombian movements of the Pacific coast defends a world where many worlds fit."
    fr: "Anthropologue colombien, professeur émérite à l'université de Caroline du Nord à Chapel Hill. Encountering Development lit le développement comme un discours qui a inventé le tiers-monde ; ses travaux ultérieurs avec les mouvements afro-colombiens de la côte pacifique défendent un monde où tiennent plusieurs mondes."
  seeds:
    - seed: post-development
      text:
        en: "Development is not a stage to reach but a way of seeing that made two thirds of the world deficient."
        fr: "Le développement n'est pas une étape à atteindre, mais un regard qui a rendu déficients les deux tiers du monde."
      source: escobar-1995
    - seed: territories-of-difference
      text:
        en: "A territory is not land with resources: it is the place where a people makes its world."
        fr: "Un territoire n'est pas une terre dotée de ressources : c'est le lieu où un peuple fait son monde."
      source: escobar-2008
    - seed: pluriverse
      text:
        en: "Not one world with many cultures, but many worlds that design can help to coexist."
        fr: "Non pas un monde et plusieurs cultures, mais plusieurs mondes que le design peut aider à faire coexister."
      source: escobar-2018
  works:
    - {id: escobar-1995, year: 1995, title: "Encountering Development: The Making and Unmaking of the Third World"}
    - {id: escobar-2008, year: 2008, title: "Territories of Difference: Place, Movements, Life, Redes"}
    - {id: escobar-2018, year: 2018, title: "Designs for the Pluriverse: Radical Interdependence, Autonomy, and the Making of Worlds"}

- id: philippe-descola
  name: Philippe Descola
  sort: Descola
  layer: leaf
  branch: political-ecology
  also: [anthropocene]
  born: 1949
  place: {city: {en: Paris, fr: Paris}, country: {en: France, fr: France}, lat: 48.857, lon: 2.352}
  wikidata: Q1197333
  lede:
    en: "French anthropologist, professor at the Collège de France from 2000 to 2019. From fieldwork among the Achuar of the Ecuadorian Amazon he concluded that the divide between nature and culture is one way of composing a world among four."
    fr: "Anthropologue français, professeur au Collège de France de 2000 à 2019. De son terrain chez les Achuar d'Amazonie équatorienne, il conclut que le partage entre nature et culture n'est qu'une manière parmi quatre de composer un monde."
  seeds:
    - seed: naturalism
      text:
        en: "The modern West alone holds that humans share their bodies with other beings and keep the mind to themselves."
        fr: "Seul l'Occident moderne tient que les humains partagent leur corps avec les autres êtres et gardent l'esprit pour eux."
      source: descola-2005
    - seed: four-ontologies
      text:
        en: "Animism, totemism, analogism and naturalism: four ways of sorting what resembles us from what does not."
        fr: "Animisme, totémisme, analogisme et naturalisme : quatre manières de répartir ce qui nous ressemble et ce qui en diffère."
      source: descola-2005
  works:
    - {id: descola-1986, year: 1986, title: "La Nature domestique : symbolisme et praxis dans l'écologie des Achuar"}
    - {id: descola-1993, year: 1993, title: Les Lances du crépuscule}
    - {id: descola-2005, year: 2005, title: Par-delà nature et culture}

- id: paul-robbins
  name: Paul Robbins
  sort: Robbins
  layer: leaf
  branch: political-ecology
  place: {country: {en: United States, fr: États-Unis}}
  lede:
    en: "American geographer at the University of Wisconsin–Madison. His textbook defines political ecology against apolitical explanations of environmental change, and Lawn People follows the chemistry of the American lawn back to its political economy."
    fr: "Géographe américain à l'université du Wisconsin à Madison. Son manuel définit la political ecology contre les explications apolitiques du changement environnemental, et Lawn People remonte de la chimie de la pelouse américaine à son économie politique."
  seeds:
    - seed: apolitical-ecology
      text:
        en: "To blame scarcity or overpopulation for degradation is already a political claim, one that hides who gains."
        fr: "Imputer la dégradation à la rareté ou à la surpopulation est déjà une thèse politique, qui masque qui en profite."
      source: robbins-2004
    - seed: hatchet-and-seed
      text:
        en: "The field works as a hatchet, to cut down dominant accounts, and as a seed, to grow alternatives."
        fr: "Le champ sert de hache, pour abattre les récits dominants, et de graine, pour faire pousser des alternatives."
      source: robbins-2004
  works:
    - {id: robbins-2004, year: 2004, title: "Political Ecology: A Critical Introduction"}
    - {id: robbins-2007, year: 2007, title: "Lawn People: How Grasses, Weeds, and Chemicals Make Us Who We Are"}

- id: marisol-de-la-cadena
  name: Marisol de la Cadena
  sort: Cadena
  layer: leaf
  branch: political-ecology
  born: 1957
  place: {city: {en: Lima, fr: Lima}, country: {en: Peru, fr: Pérou}, lat: -12.06, lon: -77.04}
  wikidata: Q51237954
  lede:
    en: "Peruvian anthropologist, professor at the University of California, Davis. From long conversations with two Quechua men near Cuzco, she shows mountains entering Andean politics as earth-beings, and asks what politics becomes when it must include them."
    fr: "Anthropologue péruvienne, professeure à l'université de Californie à Davis. À partir de longues conversations avec deux hommes quechuas près de Cuzco, elle montre des montagnes entrer dans la politique andine comme êtres-terre, et demande ce que devient la politique quand elle doit les inclure."
  seeds:
    - seed: earth-beings
      text:
        en: "A mountain can be a person with its own will, and a political actor in a dispute over a mine."
        fr: "Une montagne peut être une personne dotée d'une volonté propre, et un acteur politique dans un conflit autour d'une mine."
      source: delacadena-2015
    - seed: cosmopolitics
      text:
        en: "Indigenous movements bring beings into politics that modern politics had left to nature or to culture."
        fr: "Les mouvements autochtones font entrer en politique des êtres que la politique moderne laissait à la nature ou à la culture."
      source: delacadena-2010
  works:
    - {id: delacadena-2010, year: 2010, title: "Indigenous Cosmopolitics in the Andes: Conceptual Reflections beyond Politics", kind: article, in: Cultural Anthropology, issue: "25 (2)"}
    - {id: delacadena-2015, year: 2015, title: "Earth Beings: Ecologies of Practice across Andean Worlds"}

- id: elinor-ostrom
  name: Elinor Ostrom
  sort: Ostrom
  layer: leaf
  branch: political-ecology
  born: 1933
  died: 2012
  place: {city: {en: "Los Angeles, California", fr: "Los Angeles (Californie)"}, country: {en: United States, fr: États-Unis}, lat: 34.05, lon: -118.24}
  wikidata: Q153761
  lede:
    en: "American political economist, Nobel laureate in economics in 2009. From fisheries, forests and irrigation systems around the world, she showed that communities can govern shared resources for centuries, without the market or the state."
    fr: "Politiste et économiste américaine, prix Nobel d'économie en 2009. À partir de pêcheries, de forêts et de systèmes d'irrigation du monde entier, elle montre que des communautés peuvent gouverner des ressources partagées pendant des siècles, sans le marché ni l'État."
  seeds:
    - seed: commons
      text:
        en: "A commons is a resource with rules made by those who use it, and it can last."
        fr: "Un commun est une ressource dotée de règles faites par celles et ceux qui l'utilisent, et il peut durer."
      source: ostrom-1990
  works:
    - {id: ostrom-1990, year: 1990, title: "Governing the Commons: The Evolution of Institutions for Collective Action"}

- id: erik-swyngedouw
  name: Erik Swyngedouw
  sort: Swyngedouw
  layer: leaf
  branch: political-ecology
  born: 1956
  place: {country: {en: Belgium, fr: Belgique}}
  wikidata: Q1107767
  lede:
    en: "Belgian geographer at the University of Manchester, a founder of urban political ecology. He argues that consensual climate politics, managed by experts, depoliticises the question by leaving the economic order out of debate."
    fr: "Géographe belge à l'université de Manchester, l'un des fondateurs de l'écologie politique urbaine. Il soutient qu'une politique climatique de consensus, gérée par des experts, dépolitise la question en laissant l'ordre économique hors du débat."
  seeds:
    - seed: post-political
      text:
        en: "When climate becomes a matter of management, the choice between different worlds disappears from politics."
        fr: "Quand le climat devient affaire de gestion, le choix entre des mondes différents disparaît de la politique."
      source: swyngedouw-2010
  works:
    - {id: swyngedouw-2010, year: 2010, title: "Apocalypse Forever? Post-political Populism and the Spectre of Climate Change", kind: article, in: "Theory, Culture & Society", issue: "27 (2–3)"}

- id: robyn-eckersley
  name: Robyn Eckersley
  sort: Eckersley
  layer: leaf
  branch: political-ecology
  born: 1958
  place: {city: {en: Perth, fr: Perth}, country: {en: Australia, fr: Australie}, lat: -31.96, lon: 115.86}
  wikidata: Q4945654
  lede:
    en: "Australian political theorist at the University of Melbourne. The Green State asks whether the state, built for war and growth, can become the guardian of ecological democracy, and answers that it must be transformed rather than bypassed."
    fr: "Théoricienne politique australienne à l'université de Melbourne. The Green State demande si l'État, construit pour la guerre et la croissance, peut devenir le gardien d'une démocratie écologique, et répond qu'il faut le transformer plutôt que le contourner."
  seeds:
    - seed: green-state
      text:
        en: "Ecological democracy needs a state that answers to all those affected by its decisions, including those not yet born."
        fr: "La démocratie écologique a besoin d'un État qui réponde à tous ceux que ses décisions affectent, y compris ceux qui ne sont pas encore nés."
      source: eckersley-2004
  works:
    - {id: eckersley-2004, year: 2004, title: "The Green State: Rethinking Democracy and Sovereignty"}

- id: chico-mendes
  name: Chico Mendes
  sort: Mendes
  layer: leaf
  branch: political-ecology
  also: [decolonial]
  born: 1944
  died: 1988
  place: {city: {en: "Xapuri, Acre", fr: "Xapuri (Acre)"}, country: {en: Brazil, fr: Brésil}, lat: -10.65, lon: -68.50}
  wikidata: Q550176
  lede:
    en: "Brazilian rubber tapper and union leader in Acre. He organised the empates, blockades in which tappers stood between the chainsaws and the forest, and won the idea of extractive reserves before he was murdered in 1988."
    fr: "Seringueiro et syndicaliste brésilien de l'Acre. Il organise les empates, blocages où les récolteurs de caoutchouc s'interposent entre les tronçonneuses et la forêt, et fait admettre l'idée de réserves extractivistes avant d'être assassiné en 1988."
  seeds:
    - seed: environmentalism-of-the-poor
      text:
        en: "Defending the forest was first defending the livelihood of those who live from it, not a cause imported from outside."
        fr: "Défendre la forêt, c'était d'abord défendre la subsistance de ceux qui en vivent, et non une cause importée du dehors."
      source: mendes-1989
  works:
    - {id: mendes-1989, year: 1989, title: "Fight for the Forest: Chico Mendes in His Own Words", note: {en: "interviews with Tony Gross", fr: "entretiens avec Tony Gross"}}

- id: eduardo-viveiros-de-castro
  name: Eduardo Viveiros de Castro
  sort: Viveiros de Castro
  layer: leaf
  branch: political-ecology
  also: [anthropocene]
  born: 1951
  place: {city: {en: Rio de Janeiro, fr: Rio de Janeiro}, country: {en: Brazil, fr: Brésil}, lat: -22.91, lon: -43.17}
  wikidata: Q3048398
  lede:
    en: "Brazilian anthropologist at the National Museum in Rio de Janeiro. His Amerindian perspectivism reverses the modern scheme: one shared culture, the human, and many natures, as each kind of being sees itself as a person."
    fr: "Anthropologue brésilien du Musée national de Rio de Janeiro. Son perspectivisme amérindien renverse le schéma moderne : une seule culture partagée, l'humaine, et de multiples natures, chaque espèce d'êtres se voyant elle-même comme une personne."
  seeds:
    - seed: perspectivism
      text:
        en: "Every kind of being sees itself as human and the others as animals or spirits: one culture, many natures."
        fr: "Chaque espèce d'êtres se voit comme humaine et voit les autres comme des animaux ou des esprits : une seule culture, plusieurs natures."
      source: viveiros-2009
  works:
    - {id: viveiros-2009, year: 2009, title: Métaphysiques cannibales}
    - id: viveiros-2014
      year: 2014
      title: "Há mundo por vir? Ensaio sobre os medos e os fins"
      by: {en: Danowski and Viveiros de Castro, fr: Danowski et Viveiros de Castro}
      note: {en: with Déborah Danowski, fr: avec Déborah Danowski}

- id: enrique-leff
  name: Enrique Leff
  sort: Leff
  layer: leaf
  branch: political-ecology
  born: 1946
  place: {city: {en: Mexico City, fr: Mexico}, country: {en: Mexico, fr: Mexique}, lat: 19.43, lon: -99.13}
  wikidata: Q16242500
  lede:
    en: "Mexican environmental sociologist at the National Autonomous University of Mexico, a founder of Latin American political ecology. He argues that the crisis is one of knowledge: economic rationality has to give way to an environmental rationality rooted in places and cultures."
    fr: "Sociologue mexicain de l'environnement à l'université nationale autonome du Mexique, l'un des fondateurs de l'écologie politique latino-américaine. Il soutient que la crise est une crise du savoir : la rationalité économique doit céder la place à une rationalité environnementale ancrée dans les lieux et les cultures."
  seeds:
    - seed: environmental-rationality
      text:
        en: "The ecological crisis is a crisis of knowledge: the economy cannot think the conditions of life it destroys."
        fr: "La crise écologique est une crise du savoir : l'économie ne peut pas penser les conditions de la vie qu'elle détruit."
      source: leff-1998
  works:
    - {id: leff-1998, year: 1998, title: "Saber ambiental: sustentabilidad, racionalidad, complejidad, poder"}
