# Questions for the Clearing. Each one gathers the party measures of
# claims.yaml that answer the same question, so that one run covers them
# all: run the question, not each variant.
#
#   Actions > Clearing run > claim: nouveau-nucleaire
#
# stance is Ecosophia's reading of each quoted measure against the question:
#   for, against, or partly (supports part of it, or says it less sharply).
# The quotation is shown next to it, so the reading can be checked.
# Measures with no counterpart in another party are left out on purpose:
# ps-2026-fiscalite-carbone, pcf-2022-plan-emploi-climat.

- id: nouveau-nucleaire
  claim:
    en: "France should build new nuclear reactors."
    fr: "La France devrait construire de nouveaux réacteurs nucléaires."
  measures:
    - {id: lfi-2026-nucleaire, stance: against}
    - {id: eco-2026-nucleaire, stance: against}
    - {id: ps-2026-nucleaire, stance: partly}
    - {id: pcf-2022-mix-energetique, stance: partly}
    - {id: ens-2024-nouveaux-reacteurs, stance: for}
    - {id: rn-2024-relance-nucleaire, stance: for}
    - {id: lr-2026-nucleaire-80-ans, stance: for}

- id: eolien-solaire
  claim:
    en: "France should keep expanding wind and solar power."
    fr: "La France devrait continuer à développer l'éolien et le solaire."
  measures:
    - {id: lfi-2026-renouvelables, stance: for}
    - {id: ps-2026-nucleaire, stance: for}
    - {id: pcf-2022-mix-energetique, stance: for}
    - {id: rn-2022-moratoire-eolien, stance: against}
    - {id: lr-2026-fin-appels-offres-renouvelables, stance: against}

- id: pesticides
  claim:
    en: "France should set binding targets to reduce the use of synthetic pesticides."
    fr: "La France devrait se fixer des objectifs contraignants de réduction des pesticides de synthèse."
  measures:
    - {id: eco-2026-pesticides, stance: for}
    - {id: ps-2026-glyphosate, stance: for}
    - {id: ens-2024-pesticides, stance: for}
    - {id: lr-2026-phytosanitaires, stance: against}

- id: voitures-thermiques-2035
  claim:
    en: "The end of sales of new combustion-engine cars in 2035 should be kept."
    fr: "La fin de la vente des voitures neuves à moteur thermique en 2035 devrait être maintenue."
  measures:
    - {id: eco-2026-vehicules-2035, stance: for}
    - {id: rn-2024-voitures-thermiques, stance: against}

- id: rail-avion
  claim:
    en: "Rail and public transport should take over from short domestic flights, with public money."
    fr: "Le rail et les transports publics devraient remplacer les vols intérieurs courts, avec de l'argent public."
  measures:
    - {id: lfi-2026-vols-interieurs, stance: for}
    - {id: pcf-2022-petites-lignes-transports-gratuits, stance: partly}

- id: leasing-social
  claim:
    en: "The state should fund electric cars on social leasing for low- and middle-income households."
    fr: "L'État devrait financer des voitures électriques en leasing social pour les ménages modestes et des classes moyennes."
  measures:
    - {id: ens-2024-leasing-social, stance: for}
    - {id: lfi-2026-location-publique, stance: partly}

# --- Axioms -----------------------------------------------------------------
# Questions that divide the authors themselves rather than the parties. They
# carry no party measure. Each one is chosen because the corpus holds agents
# on both sides of it.

- id: croissance-verte
  kind: axiom
  claim:
    en: "Economic growth can be decoupled from environmental damage fast enough to stay within planetary boundaries."
    fr: "La croissance économique peut être découplée des dégâts environnementaux assez vite pour rester dans les limites planétaires."
  note: {en: "Ecomodernists against degrowth; Raworth and Rockström in between.", fr: "Les écomodernistes contre la décroissance ; Raworth et Rockström entre les deux."}

- id: valeur-intrinseque
  kind: axiom
  claim:
    en: "Nature has value in itself, independently of its usefulness to humans."
    fr: "La nature a une valeur en elle-même, indépendamment de son utilité pour les humains."
  note: {en: "Deep ecology against social ecology, ecosocialism and the ecomodernists.", fr: "L'écologie profonde contre l'écologie sociale, l'écosocialisme et les écomodernistes."}

- id: moitie-terre
  kind: axiom
  claim:
    en: "Half of the Earth's surface should be set aside as protected areas for other species."
    fr: "La moitié de la surface de la Terre devrait être réservée aux autres espèces sous forme d'aires protégées."
  note: {en: "Wilson's Half-Earth against the decolonial critique of conservation that removes people.", fr: "La Moitié de la Terre de Wilson contre la critique décoloniale d'une conservation qui chasse les habitants."}

- id: urgence-democratie
  kind: axiom
  claim:
    en: "The ecological emergency justifies limiting democratic procedures."
    fr: "L'urgence écologique justifie de limiter les procédures démocratiques."
  note: {en: "Hardin's mutual coercion and Lovelock's late pessimism against Bookchin, Gorz and Eckersley.", fr: "La coercition mutuelle de Hardin et le pessimisme tardif de Lovelock contre Bookchin, Gorz et Eckersley."}

- id: population
  kind: axiom
  claim:
    en: "Limiting population growth is necessary to solve the ecological crisis."
    fr: "Limiter la croissance démographique est nécessaire pour résoudre la crise écologique."
  note: {en: "Ehrlich and Hardin against Commoner, the ecofeminists and the decolonial branch.", fr: "Ehrlich et Hardin contre Commoner, les écoféministes et la branche décoloniale."}

- id: sabotage
  kind: axiom
  claim:
    en: "Damaging fossil fuel infrastructure is a legitimate form of climate action."
    fr: "Endommager des infrastructures fossiles est une forme légitime d'action climatique."
  note: {en: "A question Malm put at the centre of the debate; the tradition of non-violence answers.", fr: "Une question que Malm a placée au centre du débat ; la tradition de la non-violence lui répond."}

- id: geoingenierie
  kind: axiom
  claim:
    en: "Research on solar geoengineering should go ahead."
    fr: "La recherche sur la géo-ingénierie solaire devrait être poursuivie."
  note: {en: "Brand's ecopragmatism against the technocritics and the precaution of Jonas.", fr: "L'écopragmatisme de Brand contre les technocritiques et la précaution de Jonas."}

- id: capitalisme-reforme
  kind: axiom
  claim:
    en: "Capitalism can be reformed to respect ecological limits."
    fr: "Le capitalisme peut être réformé pour respecter les limites écologiques."
  note: {en: "Ecosocialists and degrowth against the ecomodernists; Ostrom asks another question.", fr: "Écosocialistes et décroissants contre les écomodernistes ; Ostrom pose une autre question."}

- id: dette-climatique
  kind: axiom
  claim:
    en: "Rich countries owe a climate debt to the Global South and should pay it."
    fr: "Les pays riches ont une dette climatique envers les pays du Sud et devraient la payer."
  note: {en: "Martínez-Alier's ecological debt and the decolonial branch against the language of shared responsibility.", fr: "La dette écologique de Martínez-Alier et la branche décoloniale contre le langage de la responsabilité partagée."}

- id: villes-denses
  kind: axiom
  claim:
    en: "Dense cities are the most ecological way for people to live."
    fr: "Les villes denses sont la manière la plus écologique d'habiter."
  note: {en: "Brand's case for cities against Berry's agrarianism and Bookchin's critique of the megalopolis.", fr: "L'éloge des villes par Brand contre l'agrarisme de Berry et la critique de la mégalopole par Bookchin."}
