# Claims taken from French party programmes, ready to be debated in the
# Clearing:  Actions > Clearing run > claim: lfi-2026-nucleaire
#
# Each claim rests on a verbatim quotation from an official party document,
# with its address and where in it the text sits. The claim itself is a
# neutral restatement that keeps the scope of the original. The agents are
# given the claim only, never the name of the party.
#
# Coverage: LFI, PCF, Les Écologistes, PS, Renaissance / Ensemble, LR, RN,
# from their most recent full programme found on an official site. A claim
# enters this file only after its quotation has been read in the party's own
# document; the year is the year of that document.
# --- La France insoumise -------------------------------------------------
- id: lfi-2026-nucleaire
  party: {short: LFI, name: La France insoumise}
  programme: {title: "L'Avenir en commun – Le programme de la Nouvelle France (édition 2027)", year: 2026, url: "https://melenchon2027.fr/programme/livre/pour-une-bifurcation-ecologique-et-sociale/chapitre3/"}
  locator: "Partie 1, chapitre 3, « Organiser le 100 % d’énergies renouvelables »"
  quote: "Planifier la fermeture progressive des centrales nucléaires existantes en ne prolongeant pas au-delà de 60 ans leur durée de vie et arrêter le programme de nouveau nucléaire (EPR2)"
  claim:
    fr: "La France devrait fermer progressivement ses centrales nucléaires existantes sans prolonger leur durée de vie au-delà de 60 ans, et arrêter le programme de nouveau nucléaire EPR2."
    en: "France should progressively close its existing nuclear plants without extending their lifetime beyond 60 years, and stop the new EPR2 nuclear programme."
  topic: energy
  checked: "2026-11-12"

