    en: "The state should replace the current social leasing scheme with a public service of affordable leasing, built on a public fleet of electric cars funded by a public banking pole."
  topic: transport
  checked: "2026-11-12"

- id: lfi-2026-renouvelables
  party: {short: LFI, name: La France insoumise}
  programme: {title: "L'Avenir en commun – Le programme de la Nouvelle France (édition 2027)", year: 2026, url: "https://melenchon2027.fr/programme/livre/pour-une-bifurcation-ecologique-et-sociale/chapitre3/"}
  locator: "Partie 1, chapitre 3, « Organiser le 100 % d’énergies renouvelables »"
  quote: "Atteindre le 100 % d’énergies renouvelables au plus tard en 2060, en commençant par organiser la sortie des énergies fossiles avant 2050 par la montée en puissance des énergies renouvelables, la sobriété et l’efficacité énergétiques"
  claim:
    fr: "La France devrait atteindre 100 % d’énergies renouvelables au plus tard en 2060, en sortant des énergies fossiles avant 2050 grâce aux renouvelables, à la sobriété et à l’efficacité énergétiques."
    en: "France should reach 100% renewable energy by 2060 at the latest, phasing out fossil fuels before 2050 through renewables, energy sufficiency and energy efficiency."
