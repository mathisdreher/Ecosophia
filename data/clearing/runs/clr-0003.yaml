  reasons:
    michael-shellenberger: Leading campaigner for nuclear power and co-author of the Ecomodernist Manifesto.
    andre-gorz: Wrote against the French nuclear programme as a technology that imposes centralised, technocratic power.
    james-lovelock: Gaia theorist who publicly backed nuclear power as the answer to global warming.
    francoise-deaubonne: French ecofeminist and anti-nuclear activist who tied nuclear power to patriarchal domination.
    jean-baptiste-fressoz: Historian who argues energy sources add up rather than replace each other, which bears on nuclear as a transition tool.
    william-nordhaus: Climate economist whose carbon pricing framework judges low-carbon sources on cost.
    murray-bookchin: Opposed nuclear power as centralised and hierarchical, against decentralised municipal energy.
    hans-jonas: His imperative of responsibility addresses technologies with irreversible, long-term risks such as nuclear waste.
    michael-lowy: Paris-based ecosocialist who rejects nuclear power within democratic ecological planning.
    jason-hickel: Degrowth economist who argues for cutting energy use in rich countries rather than expanding supply.
    malcom-ferdinand: French CNRS researcher on colonial inhabitation, relevant to uranium mining and nuclear tests in former colonies.
    robyn-eckersley: Theorist of the green state, relevant to state-led energy projects like the French nuclear fleet.
    timothy-morton: Uses radioactive waste as a central example of a hyperobject outlasting human time.
    arne-naess: Founder of deep ecology who questioned large energy systems and growth in energy demand.
    pope-francis: Laudato si condemns the technocratic paradigm while urging rapid decarbonisation.
    edward-o-wilson: Half-Earth gives a land-use angle where compact energy sources may spare habitat.
    stewart-brand: Former environmentalist who asked the movement to reverse its opposition to nuclear power.
    gunther-anders: Philosopher of the nuclear age and the Promethean gap between human power and imagination.
    jacques-ellul: French critic of the technological system and its self-justifying growth, including nuclear.
    starhawk: Activist of the anti-nuclear blockades of the 1980s.
    bruno-latour: French thinker of Gaia and the terrestrial, bearing on how to compose large technical choices.
    andreas-malm: Analyst of fossil capital who prioritises speed of decarbonisation over energy purity.
    pascal-bruckner: French essayist who defends progress and attacks anti-nuclear catastrophism.
    joan-martinez-alier: Documents ecological distribution conflicts, including over uranium mining and waste sites.
    eduardo-gudynas: Theorist of extractivism, relevant to the uranium supply chain in the Global South.
    roger-scruton: Conservative view of rooted, local care for the home, relevant to siting and national energy.
