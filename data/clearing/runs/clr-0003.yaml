summary:
  en: The line ran between agents judging reactors by carbon and land saved and agents judging them by who controls them and who bears the mines and waste, with a wide middle awaiting a prior condition. The Anthropocene branch split, with the Lovelock agent at 90 and the Fressoz and Latour agents at 50.
  fr: "La ligne de partage séparait les agents qui jugeaient les réacteurs au carbone et au sol épargnés de ceux qui les jugeaient à leur contrôle et au poids des mines et des déchets, avec un large centre suspendu à une condition préalable. La branche Anthropocène s'est scindée : l'agent Lovelock à 90, les agents Fressoz et Latour à 50."
