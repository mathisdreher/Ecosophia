plan:
  model: claude-opus-5-5
  note: The panel pairs car critics and extraction critics against pro-technology and justice-oriented voices, and covers every branch. Two rounds let agents answer each other on equity, mining and car dependence while keeping the cost near 1.8 USD.
  rounds: 2
  ranked: 24
  trimmed: false
  reasons:
    andre-gorz: Wrote The Social Ideology of the Motorcar, arguing that the private car cannot be democratised.
    ted-nordhaus: Breakthrough Institute decoupling view backs public support for clean technology adoption.
    ivan-illich: Energy and Equity argues that high-speed transport is counterproductive and widens inequality.
    jean-baptiste-fressoz: His no transition thesis questions whether electric cars substitute for fossil use or add to it.
    eduardo-gudynas: Analyst of extractivism, relevant to the lithium and metal mining behind EV batteries.
    giorgos-kallis: Degrowth scholar who favours less car use over replacing the car fleet.
    andreas-malm: Fossil Capital critic who weighs state intervention against car-centred capitalism.
    robert-bullard: Environmental justice scholar who has worked on transport inequity for low-income communities.
    joan-martinez-alier: Studies ecological distribution conflicts, including conflicts over mining for energy transitions.
    yayo-herrero: Ecofeminist who centres the needs of households and care over the industrial economy.
    murray-bookchin: Social ecology view of urban form and municipal control rather than state consumer subsidies.
    felix-guattari: Three ecologies frame individual consumption within integrated world capitalism.
    bill-devall: Deep ecology principle of simple means questions any policy that expands car ownership.
    timothy-morton: Queer ecology and hyperobjects frame offers a distinct angle on technofixes and climate.
    michael-shellenberger: Ecomodernist who favours technological substitution, though he has been critical of EV mandates.
    maristella-svampa: Studied the commodities consensus and lithium extraction in the Andean triangle.
    jason-hickel: Measures material throughput of rich countries and questions the decoupling claimed for EVs.
    kate-raworth: Doughnut framework weighs a social floor of mobility access against the ecological ceiling.
    kohei-saito: Degrowth communism opposes green growth based on private consumer goods.
    fatima-ouassak: Works on ecology from working-class neighbourhoods, the target households of social leasing.
    robyn-eckersley: Green state theorist on what role the state should take in ecological transition.
    pierre-charbonnier: Links freedom to material abundance, relevant to mobility as a social right.
    lewis-mumford: Historian of cities who criticised car-dominated urban planning.
    arne-naess: Founder of deep ecology who distinguished shallow pollution fixes from deeper change.
