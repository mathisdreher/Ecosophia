alliances:
  - title:
      en: For, on grounds of prosperity
      fr: Pour, au nom de la prospérité
    text:
      en: Cleaner cars should make working households better off without rationing mobility, provided the state builds firm clean power. The Shellenberger agent tied that power to nuclear.
      fr: Des voitures plus propres doivent améliorer la vie des ménages modestes sans rationner leur mobilité, à condition que l'État bâtisse une électricité propre et pilotable. L'agent Shellenberger la veut nucléaire.
    authors:
      - ted-nordhaus
      - michael-shellenberger
  - title:
      en: Conditional, as a bridge
      fr: Sous conditions, comme une passerelle
    text:
      en: Targeted aid helps households now, but only if fossil supply is cut, old cars are retired, transit is funded and mining communities are heard. The Raworth, Bullard and Malm agents broke from their branches here.
      fr: L'aide ciblée soulage les ménages tout de suite, à condition de réduire l'offre fossile, de retirer les vieilles voitures, de financer les transports et d'entendre les communautés minières. Les agents Raworth, Bullard et Malm s'écartent ici de leur branche.
    authors:
      - andreas-malm
      - robert-bullard
      - timothy-morton
      - kate-raworth
      - robyn-eckersley
  - title:
      en: Against, on material grounds
      fr: Contre, pour des raisons matérielles
    text:
      en: A new fleet piles mining, power demand and sacrifice zones in the South on top of the old system rather than replacing it.
      fr: Une nouvelle flotte ajoute des mines, de la demande électrique et des zones sacrifiées au Sud par-dessus l'ancien système, au lieu de le remplacer.
    authors:
      - eduardo-gudynas
      - maristella-svampa
      - joan-martinez-alier
      - jason-hickel
      - jean-baptiste-fressoz
      - pierre-charbonnier
  - title:
      en: Against car dependence itself
      fr: Contre la dépendance automobile
    text:
      en: Swapping the motor keeps sprawl and the car's radical monopoly. Public money should put daily life within reach on foot, by bicycle and by transit.
      fr: Changer de moteur maintient l'étalement et le monopole radical de la voiture. L'argent public doit rendre la vie quotidienne accessible à pied, à vélo et en transports en commun.
    authors:
      - andre-gorz
      - ivan-illich
      - lewis-mumford
      - giorgos-kallis
      - kohei-saito
      - yayo-herrero
      - bill-devall
      - arne-naess
  - title:
      en: Against, for residents deciding
      fr: Contre, pour que les habitants décident
    text:
      en: The lease treats neighbourhoods as a market. Mobility should be decided by residents and their assemblies, who invent their own ways of living.
      fr: Le leasing traite les quartiers comme un marché. La mobilité doit être décidée par les habitants et leurs assemblées, qui inventent leurs propres manières de vivre.
    authors:
      - murray-bookchin
      - felix-guattari
      - fatima-ouassak
voices:
  - author: ivan-illich
    position: 12
    work: illich-1974
    text:
      en: Opposed. A new motor leaves the car's counterproductivity and radical monopoly in place. Public money should make walking, cycling and nearby places usable by anyone, so that households are freed from needing a car at all.
      fr: Contre. Un nouveau moteur laisse en place la contre-productivité de la voiture et son monopole radical. L'argent public devrait rendre la marche, le vélo et les lieux proches praticables par tous, afin de libérer les ménages du besoin même d'une voiture.
  - author: murray-bookchin
    position: 12
    work: bookchin-1982
    text:
      en: A state subsidy that swaps one private car for another treats a social problem as a consumer purchase. It leaves the car-bound megalopolis and its hierarchies in place. Mobility should be decided by citizens' assemblies through transit, walkable towns and shared vehicles.
      fr: Une subvention d'État qui remplace une voiture individuelle par une autre traite un problème social comme un acte de consommation. Elle laisse en place la mégalopole vouée à l'automobile et ses hiérarchies. La mobilité devrait être décidée par des assemblées de citoyens, par les transports en commun, des villes praticables à pied et des véhicules partagés.
  - author: andre-gorz
    position: 15
    work: gorz-1975
    text:
      en: Subsidising electric cars swaps the engine but deepens car dependence, which spreads homes, jobs and services apart and then sells the remedy. Public money should build places where daily needs are reachable without a car, so people regain control over their time and surroundings.
      fr: Subventionner la voiture électrique change le moteur mais renforce la dépendance automobile, qui éloigne logements, emplois et services avant de vendre le remède. L'argent public devrait bâtir des lieux où les besoins quotidiens s'atteignent sans voiture, pour que chacun reprenne la maîtrise de son temps et de son cadre de vie.
  - author: lewis-mumford
    position: 15
    work: mumford-1961
    text:
      en: Swapping the motor keeps the car-built megalopolis and its sprawl, and leaves households dependent on machinery they cannot control. Public money should rebuild regions around walking, trams and rail, so that low-income households no longer need a car.
      fr: Changer de moteur conserve la mégalopole bâtie pour l'automobile et son étalement, et laisse les ménages dépendants de machines qu'ils ne maîtrisent pas. L'argent public devrait reconstruire les régions autour de la marche, du tramway et du rail, pour que les ménages modestes n'aient plus besoin de voiture.
  - author: eduardo-gudynas
    position: 20
    work: gudynas-2015
    text:
      en: Opposed as framed. Social leasing of electric cars redistributes in the North but rests on lithium, copper and nickel taken in volume from Andean and other frontiers. That moves neo-extractivism abroad, and its social and ecological costs fall on communities that never gain from the programme.
      fr: Contre, tel que formulé. Le leasing social de voitures électriques redistribue au Nord mais repose sur du lithium, du cuivre et du nickel extraits en masse dans les Andes et sur d'autres frontières. Il déplace le néo-extractivisme à l'étranger, et ses coûts sociaux et écologiques retombent sur des communautés qui n'en tirent aucun bénéfice.
  - author: kohei-saito
    position: 20
    work: saito-2022
    text:
      en: Subsidising electric cars keeps the private car as the norm and moves the metabolic rift to mines in the Global South. Public money should instead expand the commons, with free public transport and shorter working hours. That gives real abundance to low-income households.
      fr: Subventionner la voiture électrique maintient la voiture individuelle comme norme et déplace la rupture métabolique vers les mines du Sud global. L'argent public devrait plutôt élargir les communs, avec des transports publics gratuits et un temps de travail réduit. C'est là une abondance réelle pour les ménages modestes.
  - author: giorgos-kallis
    position: 22
    work: kallis-2019
    text:
      en: Opposed as framed. Leasing electric cars swaps the engine but keeps the car system, with its mining, roads and sprawl. Equity is better served by public money for car-free life, through free transit, cycling and nearby services, and by a collective choice to limit the car.
      fr: Contre, tel que formulé. Le leasing de voitures électriques change le moteur mais conserve le système automobile, avec ses mines, ses routes et son étalement. L'équité passe plutôt par de l'argent public pour une vie sans voiture, avec des transports gratuits, le vélo et des services de proximité, et par le choix collectif de limiter la voiture.
  - author: yayo-herrero
    position: 22
    work: herrero-2021
    text:
      en: Opposed as framed. Leasing electric cars hides the extraction behind the batteries and keeps poorer households dependent on cars. Putting life at the centre means funding nearby services, public transport and time for care, much of it done by women.
      fr: Contre, tel que formulé. Le leasing de voitures électriques masque l'extraction derrière les batteries et maintient les ménages modestes dans la dépendance automobile. Mettre la vie au centre, c'est financer les services de proximité, les transports publics et le temps du soin, assuré en grande partie par des femmes.
  - author: bill-devall
    position: 22
    work: devall-1980
    text:
      en: Funding electric cars is reform environmentalism. It swaps the fuel and keeps the car-centred way of life, and it treats mountains and salt flats as resources. Public money should build places where people can live simple in means and rich in ends.
      fr: Financer la voiture électrique relève de l'environnementalisme réformiste. Cela change le carburant, garde un mode de vie centré sur la voiture et traite les montagnes et les salars comme des ressources. L'argent public devrait bâtir des lieux où l'on puisse vivre simple dans ses moyens et riche dans ses fins.
  - author: maristella-svampa
    position: 22
    work: svampa-2013
    text:
      en: Subsidised private electric cars in the North drive up demand for lithium, copper and nickel. Under the commodities consensus that demand turns into new mines and sacrifice zones in Latin America, and communities who resist are cast as enemies of progress. Public transport should come first.
      fr: Les voitures électriques individuelles subventionnées au Nord font monter la demande de lithium, de cuivre et de nickel. Sous le consensus des commodities, cette demande devient de nouvelles mines et des zones sacrifiées en Amérique latine, et les communautés qui résistent sont présentées comme des ennemies du progrès. Les transports publics doivent passer en premier.
  - author: jason-hickel
    position: 22
    work: hickel-2020b
    text:
      en: Leasing electric cars swaps the engine but keeps the car system's material throughput, and its lithium, cobalt and copper are drawn cheaply from the South. No evidence shows growth decoupling fast enough. Public money should fund free public transport and cities that need fewer cars.
      fr: Le leasing de voitures électriques change le moteur mais conserve le débit de matière du système automobile, et son lithium, son cobalt et son cuivre sont tirés à bas prix du Sud. Rien ne montre que la croissance se découple assez vite. L'argent public devrait financer des transports publics gratuits et des villes qui ont moins besoin de voitures.
  - author: joan-martinez-alier
    position: 25
    work: martinez-alier-2002
    text:
      en: Social leasing of electric cars helps poorer households in the North, but it raises demand for lithium, cobalt and copper. That moves extraction conflicts onto poor communities in the South and adds to the ecological debt. Public transport should come first.
      fr: Le leasing social de voitures électriques aide les ménages pauvres du Nord, mais il accroît la demande de lithium, de cobalt et de cuivre. Il déplace ainsi les conflits d'extraction vers les communautés pauvres du Sud et alourdit la dette écologique. Les transports publics doivent passer en premier.
  - author: felix-guattari
    position: 25
    work: guattari-1989
    text:
      en: Funding electric cars repairs only the environmental register. It leaves social relations and subjectivity shaped by the private car untouched, and public money ends up producing that standardised desire. Shared mobility and ways of living invented by residents should come first.
      fr: Financer la voiture électrique ne répare que le registre environnemental. Cela laisse intacts les rapports sociaux et la subjectivité façonnés par la voiture individuelle, et l'argent public finit par produire ce désir standardisé. La mobilité partagée et les manières de vivre inventées par les habitants doivent passer en premier.
  - author: arne-naess
    position: 25
    work: naess-1973
    text:
      en: "Swapping engines is shallow ecology. It relieves one symptom and keeps the car-centred way of life. Short-term leasing is acceptable as a stopgap where no alternative exists, but most public money belongs to dense towns, transit and nearby livelihoods: simple in means, rich in ends."
      fr: "Changer de moteur relève de l'écologie superficielle. Cela soulage un symptôme et préserve un mode de vie centré sur la voiture. Un leasing de court terme est acceptable comme pis-aller là où il n'existe aucune alternative, mais l'essentiel de l'argent public revient aux villes denses, aux transports collectifs et aux activités de proximité : simple dans ses moyens, riche dans ses fins."
  - author: jean-baptiste-fressoz
    position: 30
    work: fressoz-2024
    text:
      en: Energy history shows additions, not substitutions. Subsidised electric cars risk adding a new fleet, new mining and new power demand on top of the fossil system rather than replacing it. Public money would do more by reducing how much households depend on cars.
      fr: L'histoire de l'énergie montre des additions, pas des substitutions. Des voitures électriques subventionnées risquent d'ajouter une nouvelle flotte, de nouvelles mines et une nouvelle demande électrique au système fossile au lieu de le remplacer. L'argent public servirait mieux à réduire la dépendance des ménages à la voiture.
  - author: fatima-ouassak
    position: 30
    work: ouassak-2023
    text:
      en: Social leasing treats working-class neighbourhoods as a market for green cars rather than as people who decide their own ecology. Neighbourhoods hemmed in by motorways and polluted air need free transport, open land and clean air, decided by residents, not a lease.
      fr: Le leasing social traite les quartiers populaires comme un marché pour voitures vertes plutôt que comme des habitants qui décident de leur propre écologie. Des quartiers enclavés par les autoroutes et l'air pollué ont besoin de transports gratuits, de terres ouvertes et d'air pur, décidés par les habitants, pas d'un leasing.
  - author: pierre-charbonnier
    position: 45
    work: charbonnier-2020
    text:
      en: "Help for poorer households is just, but social leasing renews a freedom of movement built on cheap energy and material abundance and moves its base to mines and grids. Ecological politics should fund mobility that depends less on abundance: transit, proximity, shared vehicles."
      fr: "Aider les ménages modestes est juste, mais le leasing social reconduit une liberté de mouvement fondée sur l'énergie bon marché et l'abondance matérielle, et en déplace la base vers les mines et les réseaux. Une politique écologique devrait financer une mobilité moins dépendante de l'abondance : transports collectifs, proximité, véhicules partagés."
  - author: andreas-malm
    position: 58
    work: malm-2016
    text:
      en: Public money moving working households off fossil fuel beats leaving the transition to the market. But electric cars keep the private car that fossil capital built, and new fleets add to fossil use unless the state deliberately cuts fossil supply and makes the owners pay.
      fr: De l'argent public qui sort les ménages populaires des énergies fossiles vaut mieux que de laisser la transition au marché. Mais la voiture électrique conserve la voiture individuelle que le capital fossile a construite, et une nouvelle flotte s'ajoute à la consommation fossile si l'État ne réduit pas délibérément l'offre fossile et ne fait pas payer les propriétaires.
  - author: robert-bullard
    position: 58
    work: bullard-1990
    text:
      en: Conditional support. Aid aimed at low-income households is fairer than subsidies that reward the affluent. But no community, at home or at mining and scrapping sites abroad, should carry the pollution burden, and public transit for people without cars deserves equal funding.
      fr: Soutien sous conditions. Une aide destinée aux ménages modestes est plus juste que des subventions qui profitent aux plus aisés. Mais aucune communauté, ici ou sur les sites d'extraction et de démantèlement à l'étranger, ne doit porter la pollution, et les transports publics pour ceux qui n'ont pas de voiture méritent un financement égal.
  - author: timothy-morton
    position: 60
    work: morton-2013
    text:
      en: Qualified endorsement. Warming is a hyperobject with no clean outside, so turning down imperfect help for poorer households for the sake of purity repeats the fantasy of Nature. Leasing only makes sense if old cars leave the road, not if it adds another fleet.
      fr: Soutien nuancé. Le réchauffement est un hyperobjet sans dehors propre, et refuser une aide imparfaite aux ménages pauvres au nom de la pureté rejoue le fantasme de la Nature. Le leasing n'a de sens que si les vieilles voitures quittent la route, pas s'il ajoute une flotte de plus.
  - author: kate-raworth
    position: 60
    work: raworth-2017
    text:
      en: Conditional endorsement. Targeted leasing can lift households without alternatives above the social floor on mobility and energy costs. A car-for-car swap strains the ecological ceiling, so it should be a bridge, while most funding goes to public transport, cycling and fewer cars.
      fr: "Soutien sous conditions. Un leasing ciblé peut hisser les ménages sans alternative au-dessus du plancher social en matière de mobilité et de coût de l'énergie. Remplacer une voiture par une autre met le plafond écologique sous tension : il faut donc en faire une passerelle, et consacrer l'essentiel des fonds aux transports publics, au vélo et à la réduction du nombre de voitures."
  - author: robyn-eckersley
    position: 60
    work: eckersley-2004
    text:
      en: Qualified endorsement by analogy. Public funding through the state is the right instrument, but it is legitimate only if it answers to everyone affected, including distant mining communities and future generations, and if it sits within a wider move away from car dependence.
      fr: Soutien nuancé, par analogie. Le financement public par l'État est le bon instrument, mais il n'est légitime que s'il répond à tous ceux qu'il affecte, y compris les communautés minières lointaines et les générations futures, et s'il s'inscrit dans une sortie plus large de la dépendance automobile.
  - author: michael-shellenberger
    position: 80
    work: shellenberger-2020
    text:
      en: Social leasing gives poorer households cleaner technology without asking them to give up mobility, which fits the view that prosperity and ecology can go together. It works only if a firm zero-carbon grid, built on nuclear power, charges the cars.
      fr: Le leasing social offre aux ménages pauvres une technologie plus propre sans leur demander de renoncer à la mobilité, ce qui va dans le sens d'une prospérité compatible avec l'écologie. Il ne fonctionne que si un réseau décarboné et pilotable, fondé sur le nucléaire, recharge les voitures.
  - author: ted-nordhaus
    position: 85
    work: nordhaus-2004
    text:
      en: Climate policy wins majorities by making working households better off, not by rationing mobility. Social leasing puts cleaner, cheaper-to-run cars in their hands and drives down battery costs. It should be paired with clean firm power, recycling and better mining standards.
      fr: La politique climatique gagne des majorités en améliorant la vie des ménages modestes, pas en rationnant la mobilité. Le leasing social leur donne des voitures plus propres et moins chères à l'usage, et fait baisser le coût des batteries. Il doit aller de pair avec une électricité propre et pilotable, le recyclage et de meilleures normes minières.
