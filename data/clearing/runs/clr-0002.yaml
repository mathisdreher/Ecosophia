claim:
  en: Economic growth can be decoupled from environmental damage fast enough to stay within planetary boundaries.
  fr: La croissance économique peut être découplée des dégâts environnementaux assez vite pour rester dans les limites planétaires.
question:
  id: croissance-verte
  kind: axiom
  measures: []
summary:
  en: The division ran between three Counterpoint agents, who endorsed the claim if societies build nuclear power, dense cities and intensive farming, and twenty-three others, mostly opposed over displaced damage or boundaries beyond carbon. Unexpectedly, the Lovelock agent agreed with them on nuclear power but wanted it for a planned retreat, not growth.
  fr: La ligne passait entre trois agents de la branche Contrepoint, favorables à condition de bâtir nucléaire, villes denses et agriculture intensive, et vingt-trois autres, opposés pour la plupart au nom des dégâts déplacés ou des autres limites planétaires. Fait inattendu, l'agent Lovelock partageait leur nucléaire, mais pour une retraite planifiée, non pour la croissance.
