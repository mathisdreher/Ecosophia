  reasons:
    jason-hickel: Has published empirical work arguing that absolute decoupling in rich countries is far too slow to meet climate and material targets.
    ted-nordhaus: Breakthrough Institute co-founder whose work on decoupling makes him the strongest advocate for the claim.
    johan-rockstrom: Led the definition of planetary boundaries, the yardstick the claim is measured against.
    giorgos-kallis: Ecological economist who argues that green growth is improbable and that rebound effects undermine efficiency gains.
    michael-shellenberger: Ecomodernist who argues that nuclear power and intensification can decouple prosperity from environmental impact.
    kate-raworth: Doughnut economics frames the question as staying under an ecological ceiling and is agnostic about growth.
    jean-baptiste-fressoz: Historian showing that energy sources have historically added up rather than replaced each other, which challenges the idea of a fast transition.
    nicholas-georgescu-roegen: His entropy law sets physical limits on any material economy, whatever its efficiency.
    kohei-saito: Degrowth communism explicitly rejects green growth and green Keynesianism as illusions.
    stewart-brand: Ecopragmatist who supports nuclear power, cities and genetic engineering as routes to lower impact.
    andreas-malm: Fossil Capital links the growth dynamics of capital to fossil fuel dependence.
    joan-martinez-alier: Ecological economist who documents rising material throughput and the distribution conflicts that come with it.
    eduardo-gudynas: Analyses the extractivism that the minerals of a decoupled economy would require.
    jacques-ellul: His idea of the technological bluff questions faith in technical fixes.
    yayo-herrero: Ecofeminist economics stresses biophysical limits and the dependence of the economy on care work.
    murray-bookchin: Social ecology holds that a grow-or-die market economy cannot be ecological.
    arne-naess: His distinction between shallow and deep ecology targets technical reform without changes in values.
    edward-o-wilson: Biologist who brings the biodiversity boundary into the debate through Half-Earth.
    timothy-morton: Hyperobjects framing questions whether measurable boundaries and managerial fixes can contain the problem.
    john-bellamy-foster: Metabolic rift theory and his writing on the Jevons paradox both argue against decoupling under capitalism.
    james-lovelock: Gaia scientist who backed nuclear power yet argued for a sustainable retreat.
    robyn-eckersley: Studies whether a green state could steer growth within ecological limits.
    andre-gorz: Early theorist of sufficiency who argued that ecological limits make growth-led capitalism unsustainable.
    pierre-charbonnier: Links modern freedoms to material abundance, which bears on the political stakes of decoupling.
    maria-mies: Her subsistence perspective rejects growth as the measure of welfare.
    maristella-svampa: Her commodities consensus shows how green transitions can deepen raw material exports in the Global South.
