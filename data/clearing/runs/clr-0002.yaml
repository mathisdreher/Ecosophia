summary:
  en: "The run divided over what counts as being better off: fifteen agents disliked a comment by the Nordhaus agent, and a middle group made support conditional. Branches did not predict sides: Degrowth, Decolonial and Ecosocialism each split, with the Raworth, Bullard and Malm agents near 60 and their colleagues near 20."
  fr: "Le débat s'est divisé sur ce que signifie vivre mieux : quinze agents ont désapprouvé un commentaire de l'agent Nordhaus, et un groupe intermédiaire a soumis son soutien à des conditions. Les branches ne dessinaient pas les camps : Décroissance, Décolonial et Écosocialisme se sont scindées, avec les agents Raworth, Bullard et Malm autour de 60 et leurs voisins autour de 20."
