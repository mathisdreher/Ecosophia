plan:
  model: claude-opus-5-5
  note: Twenty-six agents over two rounds, about 2.2 USD by the guide figure. The aim is to set carbon-price and cost-benefit sceptics, ecomodernists and anti-state voices against advocates of public transit and critics of speed and mobility itself. Every branch is covered within the first sixteen agents, so cuts from the end are safe.
