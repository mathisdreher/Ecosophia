  reasons:
    william-nordhaus: Favours a uniform carbon price over targeted public spending on chosen technologies, a direct challenge to subsidised rail.
    ivan-illich: Energy and Equity argues that high-speed transport is counterproductive and that more speed for some costs time for all.
    bjorn-lomborg: Cost-benefit ranking of climate measures tends to question costly infrastructure per tonne of carbon avoided.
    ted-nordhaus: Ecomodernist who prefers innovation and decoupling to restricting mobility, likely to favour cleaner aviation.
    ramon-fernandez-duran: Spanish urbanist who criticised high-speed rail and motorised mobility under the decline of cheap fossil energy.
    andre-gorz: Wrote The Social Ideology of the Motorcar on how transport shapes space and inequality, and links ecology to public provision.
    robert-bullard: Has written on transportation equity and on who pays for public transit and who benefits from it.
    andreas-malm: Fossil capital analysis supports state-led action that cuts aviation emissions, possibly by banning flights outright.
    jean-baptiste-fressoz: Argues that energy transitions historically add new sources rather than substitute, so rail may not replace flights.
    murray-bookchin: Libertarian municipalism questions state-led infrastructure and favours decentralised, human-scale communities.
    roger-scruton: Conservative oikophilia favours local attachment and distrusts large state programmes.
    erik-swyngedouw: Criticises consensual, expert-managed climate policy as post-political, which applies to technocratic transport plans.
    yayo-herrero: Ecofeminist from Ecologistas en Acción who puts care and everyday mobility above long-distance speed.
    arne-naess: Founder of deep ecology, asks whether the need for mobility itself should be questioned beyond changing modes.
    nicole-seymour: Bad environmentalism challenges moralising campaigns such as flight shaming.
    bill-devall: Simple in means, rich in ends questions the value placed on frequent travel whatever the mode.
    jason-hickel: Measures excess consumption by rich countries and frequent flyers, and supports public provision with demand reduction.
    michael-shellenberger: Ecomodernist critic of climate alarmism who defends abundant energy and modern mobility.
    terry-anderson: Free-market environmentalism doubts public subsidy and favours property rights and private solutions.
    joan-martinez-alier: Studies distribution conflicts, including local resistance to large rail projects such as the TAV in Italy.
    michael-lowy: Democratic ecological planning gives a socialist case for free public transport funded by the state.
    bill-mckibben: Climate campaigner who has addressed aviation emissions and public action on climate.
    malcom-ferdinand: Writes from the Caribbean, where islands and overseas territories depend on air links that rail cannot replace.
    alain-de-benoist: Right-wing degrowth and rooted localism question mass mobility itself.
    ronald-coase: The Problem of Social Cost questions whether state intervention is the best answer to externalities.
    jacques-ellul: Sees technique as self-expanding, so new rail capacity would add to the transport system rather than replace flights.
