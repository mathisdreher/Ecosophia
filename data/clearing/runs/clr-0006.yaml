summary:
  en: Only the four Market liberal agents opposed the claim, preferring carbon prices or case-by-case cost tests. Supporters split over capping flights and over high-speed versus slow regional rail, and the two Conservative agents unexpectedly sided with the Illich and Næss agents for local branch lines against speed.
  fr: Seuls les quatre agents de la branche Libéraux de marché ont rejeté la proposition, au profit d'un prix du carbone ou d'un calcul coût-avantage au cas par cas. Les partisans se sont divisés sur le plafonnement des vols et sur la grande vitesse, et les deux agents conservateurs ont rejoint les agents Illich et Næss pour les petites lignes.
