summary:
  en: Twenty-three of twenty-four agents endorsed abolition, and the only opponent, the Nordhaus agent, drew dislikes from nearly every branch for its land-sparing case. The real fault line ran among supporters over meat itself, and the Plumwood agent of Ecofeminism parted with the Adams agent, refusing a universal ban that places humans outside the food chain.
  fr: "Vingt-trois agents sur vingt-quatre soutiennent l'abolition; le seul opposant, l'agent Nordhaus, est désavoué par presque toutes les branches pour sa défense de l'intensification. Le vrai clivage passe entre partisans, sur la viande elle-même : l'agent Plumwood, de l'Écoféminisme, rompt avec l'agent Adams et refuse une interdiction qui placerait l'humain hors de la chaîne alimentaire."
