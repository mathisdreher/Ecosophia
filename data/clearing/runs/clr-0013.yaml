  reasons:
    peter-singer: Animal Liberation made the suffering in intensive animal farming a central case against speciesism.
    roger-scruton: Defended humane traditional husbandry and meat eating while condemning factory farms, so he separates reform from abolition of animal use.
    wendell-berry: Agrarian critic of industrial agriculture who still defends mixed farms with livestock.
    luc-ferry: Humanist critic of animal rights and deep ecology, likely to resist the moral framing of the claim.
    ted-nordhaus: Ecomodernist case for agricultural intensification and land sparing challenges the push to abolish intensive systems.
    donna-haraway: Companion species thinking criticises industrial animal production but rejects simple abolitionist positions.
    val-plumwood: Opposed factory farming yet criticised ontological veganism, offering an ecofeminist middle position.
    baird-callicott: His triangular affair essay set the land ethic against animal liberation on farming and domestic animals.
    john-bellamy-foster: Metabolic rift theory explains concentrated feedlots as a capitalist break in nutrient cycles.
    murray-bookchin: Social ecology links the domination of nature, including agribusiness, to social hierarchy.
    jason-hickel: Degrowth economist who points to industrial beef and feed crops as a major ecological overshoot to scale down.
    joan-martinez-alier: Studies distribution conflicts over feed soy, plantations and waste that come from livestock chains.
    ramachandra-guha: Decolonial critic of Western environmentalism who defends pastoralists and ecosystem people.
    arne-naess: Deep ecology platform about reducing human interference and respecting the flourishing of other beings.
    andrew-dobson: Ecological citizenship asks what duties and democratic means could carry a reform as large as abolition.
    timothy-morton: Queer ecology view that sees meat and animal agriculture as tied to ideas of nature and coexistence.
    rob-hopkins: Transition and permaculture practice favour small local food systems over industrial ones.
    tom-regan: Rights view demands the abolition of animal agriculture altogether, which goes beyond reform.
    carol-j-adams: The absent referent links industrial meat to the objectification of women.
    will-kymlicka: Zoopolis frames domesticated animals as co-citizens, which raises the question of what follows abolition.
    anna-tsing: Her Plantationocene work reads industrial pig and plantation systems as a model of alienated production.
    florence-burgat: Argues that eating meat is an unnecessary cultural choice and that industrial killing reveals it.
    robin-wall-kimmerer: The honorable harvest offers an Indigenous ethic of reciprocal taking, set against industrial extraction.
    corine-pelluchon: Her animalist manifesto makes ending intensive farming a concrete political programme.
