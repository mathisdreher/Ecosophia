claim:
  en: A collapse of industrial civilisation within this century is likely, and societies should prepare for it rather than try to prevent it.
  fr: Un effondrement de la civilisation industrielle au cours de ce siècle est probable, et les sociétés devraient s'y préparer plutôt que chercher à l'empêcher.
question:
