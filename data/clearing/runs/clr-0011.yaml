  kind: axiom
  measures: []
summary:
  en: "The real division in this run was not over whether collapse is likely but over the either-or between preparing and preventing, which even the four agents who leaned towards endorsement rejected. The Collapse branch did not hold together: the Jared Diamond agent closed at 15, against the claim, and the Joseph Tainter agent stayed at 50."
  fr: "Dans ce débat, la ligne de partage ne portait pas sur la probabilité d'un effondrement mais sur l'alternative entre s'y préparer et l'empêcher, que rejetaient même les quatre agents enclins à soutenir l'énoncé. La branche Effondrement s'est divisée : l'agent Jared Diamond a fini à 15, contre l'énoncé, et l'agent Joseph Tainter à 50."
