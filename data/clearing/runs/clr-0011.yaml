  reasons:
    jem-bendell: His Deep Adaptation paper states almost exactly this claim, that climate-driven collapse is likely and adaptation should take priority.
    pablo-servigne: He coined collapsology and argued that preparing for collapse is a reasonable response.
    michael-shellenberger: Apocalypse Never attacks climate catastrophism and defends nuclear power and growth as ways to prevent harm.
    andreas-malm: He calls for militant action against fossil capital and rejects fatalism in favour of fighting to prevent the worst.
    joseph-tainter: His theory of diminishing returns on complexity gives a historical mechanism for collapse that can be tested against the claim.
    pascal-bruckner: He reads ecological doom as a secular religion of fear, which goes directly against collapse prophecy.
    ailton-krenak: Ideas to Postpone the End of the World speaks from an Indigenous people whose world has already ended once.
    giorgos-kallis: He argues for planned and democratic degrowth, a chosen descent rather than a suffered collapse.
    jean-baptiste-fressoz: He is a historian who disputes the narrative of energy transition and who also distrusts grand collapse narratives.
    hans-jonas: His heuristics of fear and imperative of responsibility bear on how we should act under catastrophic risk.
    yayo-herrero: She is an ecofeminist active in Spanish collapse debates and puts care and the sustaining of life at the centre of any descent.
    murray-bookchin: Social ecology rejects apocalyptic passivity and insists on political reconstruction through municipalism.
    joan-martinez-alier: His environmentalism of the poor shows that ecological harm is already unevenly distributed, which challenges a single collapse framing.
    dominique-bourg: He is a French philosopher who takes collapse risk seriously and asks what institutions could govern the long term.
    pope-francis: Laudato si' combines alarm about the crisis with a call for conversion and prevention.
    baptiste-morizot: He frames the crisis as one of sensibility and proposes relations with other living beings rather than a survival plan.
    edward-o-wilson: Half-Earth is a large preventive conservation project aimed at averting a biological collapse.
    nicole-seymour: Bad environmentalism questions doom-laden affect and imagines caring for an uncertain future.
    corine-pelluchon: She grounds ethics in what we live from and brings other animals into the question of what should be preserved.
    rob-hopkins: Transition Towns plan energy descent in a positive and preventive spirit, between preparation and change.
    bjorn-lomborg: His cost-benefit approach disputes that collapse is likely and ranks the response by priorities.
    jared-diamond: Collapse argues that societies choose to fail or succeed, which supports prevention over resignation.
    ugo-bardi: His Seneca effect and his defence of The Limits to Growth give quantitative support to a rapid decline.
    bruno-latour: His Gaia and terrestrial politics reframe the question beyond a choice between preparing and preventing.
