summary:
  en: "The line ran less between endorsing and opposing than between agents measuring cuts by volume and those preferring harm per unit of food, land farmed or a price per substance. Unexpectedly, the Conservatives split: the Roger Scruton agent, at 30, sided with the Terry L. Anderson agent, while the Pope Francis agent endorsed at 85."
  fr: "La ligne de partage a moins opposé le pour et le contre que la mesure en volume au dommage par unité de nourriture, à la surface cultivée ou au prix par substance. Fait inattendu, les Conservateurs se sont scindés : l'agent Roger Scruton, à 30, a rejoint l'agent Terry L. Anderson, l'agent Pape François approuvant à 85."
