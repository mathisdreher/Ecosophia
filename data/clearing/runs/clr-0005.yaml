summary:
  en: The line ran less between endorsing and opposing than between open action led by those who bear the harm and secret damage by a few, a test most endorsing agents also accepted. That test split Ecofeminism, Decolonial and Political ecology from within, and put 30 points between the two Ecosocialism agents.
  fr: La ligne passait moins entre partisans et adversaires qu'entre l'action ouverte des populations touchées et la dégradation secrète commise par quelques-uns, critère admis par la plupart des agents favorables. Ce critère a divisé de l'intérieur les branches Écoféminisme, Décolonial et Écologie politique, et séparé de trente points les deux agents de l'Écosocialisme.
