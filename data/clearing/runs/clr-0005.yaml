  reasons:
    andreas-malm: Author of How to Blow Up a Pipeline, the central argument for sabotage of fossil infrastructure.
    bill-mckibben: Co-founder of 350.org, which built a mass climate movement on strictly nonviolent tactics.
    michael-shellenberger: Ecomodernist who attacks climate alarmism and would reject sabotage as harmful to energy access.
    arne-naess: Founder of deep ecology who drew on Gandhian nonviolence in environmental action.
    ken-saro-wiwa: Led the Ogoni movement against oil infrastructure damage in the Niger Delta through nonviolent mobilisation.
    francoise-deaubonne: Ecofeminist who defended direct action, including sabotage, against nuclear installations.
    roger-scruton: Conservative philosopher who grounds ecology in law, institutions and local attachment.
    william-nordhaus: Argues for carbon pricing through policy, a market path that is the opposite of sabotage.
    jacques-ellul: Wrote a Christian critique of violence, including violence used for just causes.
    murray-bookchin: Social ecologist who favoured democratic municipal power over isolated direct action.
    joan-martinez-alier: Documents ecological distribution conflicts, including resistance to fossil projects worldwide.
    giorgos-kallis: Degrowth researcher who writes on movements against extraction and on self-limitation.
    nicole-seymour: Theorist of bad environmentalism who questions moral purity and sanctioned forms of activism.
    bill-devall: Brought deep ecology into North American activism, where monkeywrenching was openly debated.
    naomi-klein: Named Blockadia, the grassroots physical resistance to fossil fuel projects.
    starhawk: Activist of nonviolent direct action and blockades with a clear stance on tactics.
    chico-mendes: Organised the empates, nonviolent physical blockades against forest destruction.
    pascal-bruckner: Reads political ecology as apocalyptic fanaticism, a frame he would apply to sabotage.
    robyn-eckersley: Theorist of the green state who weighs state legitimacy against ecological duty.
    hans-jonas: His ethics of responsibility toward future generations bears on the case for emergency action.
    pope-francis: Laudato si condemns the fossil technocratic paradigm while speaking from a tradition of peace.
    nnimmo-bassey: Campaigner against oil extractivism in Africa, speaking for communities harmed by fossil infrastructure.
    erik-swyngedouw: Argues that consensual climate politics depoliticises the question and that dissent must be restored.
    luc-ferry: Humanist critic of radical ecology who defends liberal democratic legitimacy.
