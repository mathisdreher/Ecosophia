  reasons:
    edward-o-wilson: Author of the Half-Earth proposal under debate.
    ramachandra-guha: Wrote the classic Third World critique of wilderness preservation and its cost to rural people.
    ted-nordhaus: Ecomodernist case for land sparing through intensification and decoupling, a different route to setting land aside.
    baptiste-morizot: Works on wolves, rewilding and cohabitation, arguing for diplomacy with other species on shared land.
    terry-anderson: Free-market environmentalism holds that property rights, not state set-asides, protect habitat.
    paul-robbins: Political ecologist who analyses how conservation enclosures dispossess local land users.
    joan-martinez-alier: Studies ecological distribution conflicts, including those caused by protected areas.
    murray-bookchin: Attacked deep ecology as misanthropic and traces the domination of nature to social hierarchy.
    bruno-latour: Rejects the separation of nature and society that a fenced half presupposes.
    val-plumwood: Critiqued the wilderness idea as part of the dualism of reason against nature.
    jason-hickel: Argues that cutting rich-country material throughput is the way to free land for ecosystems.
    john-bellamy-foster: Metabolic rift analysis sets the biodiversity crisis within capitalist land use.
    roger-scruton: Oikophilia grounds environmental care in local, inhabited homes rather than global targets.
    wendell-berry: Agrarian who defends people living well on the land rather than separating land from people.
    timothy-morton: Ecology without nature questions the ideal of Nature set apart and admired from a distance.
    arne-naess: Deep ecology platform calls for much larger areas of wilderness and a smaller human footprint.
    philippe-descola: His anthropology shows that the nature and culture divide behind protected areas is not universal.
    luc-ferry: Humanist critic of deep ecology and of giving priority to nature over people.
    johan-rockstrom: Planetary boundaries framework includes biosphere integrity and land system change limits.
    davi-kopenawa: Led the demarcation of Yanomami territory, an Indigenous model of forest protection.
    holmes-rolston: Defends intrinsic value in wild nature and the preservation of wildlands.
    vandana-shiva: Defends subsistence communities and biodiversity kept by farmers rather than by exclusion.
    elinor-ostrom: Showed that communities can govern forests and fisheries as commons without state exclusion.
    anna-tsing: Studies life in disturbed, shared landscapes rather than pristine reserves.
    robin-wall-kimmerer: Indigenous botanist who argues for reciprocal human care of land rather than absence.
