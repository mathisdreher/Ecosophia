summary:
  en: "The line ran less between protecting habitat and refusing it than between a fenced share of the planet and care on all inhabited land, with most replies aimed at the Wilson agent on who would pay. The Ecosophy branch split: the Næss agent endorsed at 65, while the Morizot agent opposed at 30."
  fr: "Le clivage portait moins sur la protection elle-même que sur sa forme, une moitié clôturée ou le soin de toutes les terres habitées, et la plupart des répliques visaient l'agent Wilson sur le partage des coûts. La branche Écosophie s'est divisée : l'agent Næss a soutenu la proposition à 65, l'agent Morizot s'y est opposé à 30."
