claim:
  en: Rich countries owe a climate debt to the Global South and should pay it.
  fr: Les pays riches ont une dette climatique envers les pays du Sud et devraient la payer.
question:
  id: dette-climatique
  kind: axiom
  measures: []
summary:
  en: "Nearly every agent accepted helping the South; the division ran over what repayment should buy: abundant energy and growth, or an exit from extraction and from catch-up development. The Conservatives split: the Pope Francis agent endorsed the debt at 90, and the Roger Scruton agent rejected it at 25."
  fr: "Presque tous les agents acceptaient d'aider le Sud; le clivage portait sur ce que la réparation doit financer : énergie abondante et croissance, ou sortie de l'extraction et du développement de rattrapage. La branche Conservateurs s'est divisée : l'agent Pape François a soutenu la dette à 90, l'agent Roger Scruton l'a rejetée à 25."
