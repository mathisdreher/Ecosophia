  reasons:
    joan-martinez-alier: Theorist of ecological debt and environmentalism of the poor, the core concept of the claim.
    bjorn-lomborg: Cost-benefit priorities argue against large climate transfers as poor value for the poor.
    jason-hickel: Quantifies rich countries' overshoot of fair shares and unequal exchange, giving a measure for the debt.
    ted-nordhaus: Ecomodernist who stresses energy access and growth in the South over reparative framing.
    nnimmo-bassey: Campaigner who has pressed climate and ecological debt claims from the Niger Delta.
    andreas-malm: Fossil Capital traces emissions to specific historical owners, which bears on who owes what.
    william-nordhaus: Optimal carbon pricing and discounting frame climate policy without historical liability.
    roger-scruton: Conservative oikophilia questions abstract global obligations and inherited national guilt.
    pope-francis: Laudato si' explicitly names an ecological debt between North and South.
    pascal-bruckner: Critiques ecological guilt and Western self-accusation, a direct challenge to the claim.
    alberto-acosta: Behind the Yasuni-ITT proposal asking the world to compensate for leaving oil underground.
    vandana-shiva: Maldevelopment and biopiracy describe Northern appropriation of Southern resources.
    hans-jonas: Imperative of responsibility grounds duties across time and distance, relevant to historical liability.
    pierre-charbonnier: Links Northern freedoms to appropriated abundance, a historical basis for debt.
    baird-callicott: Has written on climate ethics from the land ethic, bringing a nonhuman-centred view.
    leonardo-boff: Joins the cry of the poor and the cry of the Earth from Latin American liberation theology.
    murray-bookchin: Social ecology may doubt state-to-state payments that leave hierarchies intact.
    timothy-morton: Hyperobjects frame climate as diffuse in a way that complicates assigning responsibility.
    eduardo-gudynas: Neo-extractivism shows Southern governments sharing in the damage, complicating a North-South ledger.
    michael-shellenberger: Ecomodernist who argues that cheap energy and development, not guilt, help the poor.
    amitav-ghosh: The Nutmeg's Curse ties the climate crisis to colonial terraforming.
    kohei-saito: Degrowth communism and imperial mode of living connect Northern consumption to Southern costs.
    maria-mies: Analysed accumulation resting on unpaid extraction from colonies, women and peasants.
    ramachandra-guha: Environmentalism of the poor and critique of Northern environmentalism from India.
    julian-simon: Cornucopian view that growth enriches all, which weakens the case for debt.
    serge-latouche: Decolonising the imaginary doubts that money transfers within the development frame repair harm.
