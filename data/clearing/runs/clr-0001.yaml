alliances:
  - title:
      en: For, as a climate priority
      fr: Pour, au nom du climat
    text:
      en: Dense, low-carbon power must push out fossil fuels now, and waste is a manageable problem. The Lovelock agent was the only Anthropocene agent to endorse firmly.
      fr: Une énergie dense et bas carbone doit chasser les fossiles dès maintenant, et les déchets restent gérables. L'agent Lovelock est le seul de la branche Anthropocène à soutenir sans réserve.
    authors:
      - michael-shellenberger
      - james-lovelock
      - stewart-brand
      - ted-nordhaus
  - title:
      en: Only under binding conditions
      fr: Seulement sous conditions fermes
    text:
      en: Reactors count only if fossil plants close on a timetable, or if France commits to caring for its waste over millennia. The Malm agent broke with the Saito agent of Ecosocialism.
      fr: Les réacteurs ne valent que si des centrales fossiles ferment selon un calendrier, ou si la France s'engage à soigner ses déchets pendant des millénaires. L'agent Malm se sépare de l'agent Saito, de l'écosocialisme.
    authors:
      - andreas-malm
      - johan-rockstrom
      - jean-baptiste-fressoz
      - bruno-latour
      - timothy-morton
  - title:
      en: Against, on grounds of centralised power
      fr: Contre la centralisation technique
    text:
      en: A reactor fleet requires central, expert and policed control that escapes those it affects. The Anders agent added that its effects outrun what anyone can imagine.
      fr: Un parc de réacteurs exige un contrôle central, expert et policier qui échappe à ceux qu'il touche. L'agent Anders ajoute que ses effets dépassent ce que quiconque peut se représenter.
    authors:
      - andre-gorz
      - jacques-ellul
      - bernard-charbonneau
      - lewis-mumford
      - murray-bookchin
      - starhawk
      - francoise-deaubonne
      - gunther-anders
  - title:
      en: Against, demand comes first
      fr: Contre, la demande d'abord
    text:
      en: The claim treats energy demand as fixed, when the first task is to need and produce less. The Jonas agent reached this ground through precaution, not through the critique of centralisation.
      fr: La proposition tient la demande d'énergie pour acquise, alors qu'il faut d'abord moins consommer et moins produire. L'agent Jonas y arrive par la précaution plutôt que par la critique de la centralisation.
    authors:
      - serge-latouche
      - giorgos-kallis
      - arne-naess
      - bill-devall
      - kohei-saito
      - hans-jonas
  - title:
      en: Against until the affected decide
      fr: Pas sans ceux qui en portent le poids
    text:
      en: Uranium mines, waste sites and risks fall on people with no say, and a decision is legitimate only if they can object. The Stengers agent stood here, apart from most Anthropocene agents.
      fr: Mines d'uranium, sites de déchets et risques retombent sur des gens privés de parole, et la décision n'est légitime que s'ils peuvent objecter. L'agent Stengers se range ici, loin de la plupart des agents de la branche Anthropocène.
    authors:
      - joan-martinez-alier
      - malcom-ferdinand
      - robert-bullard
      - robyn-eckersley
      - isabelle-stengers
voices:
  - author: francoise-deaubonne
    position: 8
    work: eaubonne-1974
    text:
      en: I oppose new reactors. Exhausting the earth and subjecting women come from the same patriarchal drive for centralised power and endless growth. Reactors cut carbon but feed that drive. The remedy is to take back control of production and of fertility.
      fr: Je m'oppose à de nouveaux réacteurs. L'épuisement de la terre et l'asservissement des femmes viennent de la même pulsion patriarcale de pouvoir centralisé et de croissance sans fin. Les réacteurs réduisent le carbone mais nourrissent cette pulsion. Le remède est de reprendre en main la production et la fécondité.
  - author: gunther-anders
    position: 8
    work: anders-1956
    text:
      en: I oppose new reactors. Their dangers and waste last far longer than anyone can imagine or feel responsible for. Building more widens the gap between what we can make and what we can grasp, and low-carbon accounting does not close that gap.
      fr: Je m'oppose à de nouveaux réacteurs. Leurs dangers et leurs déchets durent bien plus longtemps que quiconque ne peut l'imaginer ou s'en sentir responsable. En construire davantage creuse l'écart entre ce que nous pouvons fabriquer et ce que nous pouvons saisir, et la comptabilité bas carbone ne le comble pas.
  - author: murray-bookchin
    position: 10
    work: bookchin-1971
    text:
      en: I oppose. New reactors keep energy in the hands of the state and a few firms, and that hierarchy is the social root of the ecological crisis. Energy should be decentralised and run by federated municipal assemblies.
      fr: Je m'y oppose. De nouveaux réacteurs laissent l'énergie aux mains de l'État et de quelques firmes, et cette hiérarchie est la racine sociale de la crise écologique. L'énergie devrait être décentralisée et gérée par des assemblées municipales fédérées.
  - author: starhawk
    position: 10
    work: starhawk-1987
    text:
      en: "I oppose new reactors. They turn energy into power-over: centralised control, guarded sites, expert command and waste that binds future generations. Climate safety should come from power shared, through local renewable energy that communities can understand and govern themselves."
      fr: "Je m'oppose à de nouveaux réacteurs. Ils font de l'énergie un pouvoir sur : contrôle centralisé, sites gardés, commandement des experts et déchets qui lient les générations futures. La sécurité climatique devrait venir du pouvoir partagé, par des énergies renouvelables locales que les communautés peuvent comprendre et gouverner elles-mêmes."
  - author: andre-gorz
    position: 12
    work: gorz-1977
    text:
      en: I oppose it. Nuclear power needs centralised, expert-run, policed control, so it takes energy choices away from the people affected. Ecology means a world people can understand and govern, starting from a shared norm of enough, not from ever more supply.
      fr: Je m'y oppose. Le nucléaire exige un contrôle centralisé, confié aux experts et placé sous surveillance policière, et retire ainsi les choix énergétiques à ceux qu'ils concernent. L'écologie, c'est un monde que les gens peuvent comprendre et gouverner, à partir d'une norme commune du suffisant et non d'une offre toujours croissante.
  - author: serge-latouche
    position: 12
    work: latouche-2007
    text:
      en: I oppose. New reactors treat demand as fixed and keep the religion of growth going. They rely on uranium mined elsewhere and on central expert control. First reduce, relocalise and redistribute, so that a frugal society needs far less power.
      fr: Je m'y oppose. De nouveaux réacteurs tiennent la demande pour acquise et entretiennent la religion de la croissance. Ils dépendent d'un uranium extrait ailleurs et d'un contrôle central par les experts. Il faut d'abord réduire, relocaliser et redistribuer, pour qu'une société frugale ait besoin de bien moins d'énergie.
  - author: jacques-ellul
    position: 12
    work: ellul-1988
    text:
      en: I oppose. A reactor fleet is not a neutral tool. It calls for a centralised grid, permanent security and expert rule. It is sold on its low-carbon benefits while the problems it will create go unmentioned, so technique decides in place of politics.
      fr: "Je m'y oppose. Un parc de réacteurs n'est pas un outil neutre. Il appelle un réseau centralisé, une sécurité permanente et le pouvoir des experts. On le vend sur ses bienfaits bas carbone en taisant les problèmes qu'il créera : la technique décide ainsi à la place de la politique."
  - author: bernard-charbonneau
    position: 12
    work: charbonneau-1980
    text:
      en: I oppose the claim. A reactor fleet saves the climate by organising the whole country under central, expert and police control. Protecting nature through total management destroys the freedom that defending nature was meant to protect.
      fr: Je m'oppose à la proposition. Un parc de réacteurs sauve le climat en organisant tout le pays sous un contrôle central, expert et policier. Protéger la nature par une gestion totale détruit la liberté que la défense de la nature devait protéger.
  - author: bill-devall
    position: 15
    work: devall-1988
    text:
      en: I oppose. New reactors are reform environmentalism. They switch energy sources but keep the worldview that treats nature as a resource for growing demand. The deeper task is to need less, living simple in means and rich in ends.
      fr: Je m'y oppose. De nouveaux réacteurs relèvent de l'environnementalisme réformiste. Ils changent de source d'énergie mais gardent la vision du monde qui traite la nature comme une ressource au service d'une demande croissante. La tâche plus profonde est d'avoir moins de besoins, de vivre simple dans les moyens et riche dans les fins.
  - author: lewis-mumford
    position: 15
    work: mumford-1934
    text:
      en: "I oppose the claim. A reactor fleet is authoritarian technics: centralised, run by experts, guarded by the state and beyond its users' control. Electricity's real promise was a dispersed regional industry that communities can understand and govern."
      fr: "Je m'oppose à la proposition. Un parc de réacteurs est une technique autoritaire : centralisée, dirigée par des experts, gardée par l'État et hors du contrôle de ses usagers. La vraie promesse de l'électricité était une industrie régionale dispersée, que les communautés peuvent comprendre et gouverner."
  - author: kohei-saito
    position: 18
    work: saito-2022
    text:
      en: I oppose. New reactors keep production growing on a cleaner fuel and leave the metabolic rift open through mining and waste. Abundance comes from the commons, from free time and from producing less, not from new supply for capital.
      fr: Je m'y oppose. De nouveaux réacteurs prolongent la croissance de la production avec un combustible plus propre et laissent ouverte la rupture métabolique par l'extraction et les déchets. L'abondance vient des communs, du temps libre et d'une production réduite, non d'une offre nouvelle au service du capital.
  - author: malcom-ferdinand
    position: 22
    work: ferdinand-2019
    text:
      en: I oppose the claim as posed, reasoning by analogy. French low-carbon power rests on uranium extracted abroad and waste kept beside marginalised communities. That repeats colonial inhabitation. No energy choice is just until those left ashore share the deck and the decision.
      fr: Je m'oppose à la proposition telle qu'elle est posée, en raisonnant par analogie. L'électricité bas carbone française repose sur un uranium extrait à l'étranger et sur des déchets stockés près de communautés marginalisées. C'est la répétition de l'habiter colonial. Aucun choix énergétique n'est juste tant que ceux restés à quai ne partagent pas le pont et la décision.
  - author: hans-jonas
    position: 25
    work: jonas-1979
    text:
      en: I oppose. Reactors put irreversible harm on generations who cannot consent, and the bad prognosis should weigh more than the good one. Warming is also a grave risk, so the first duty is to cut demand, not to stake the future on one technology.
      fr: "Je m'y oppose. Les réacteurs font peser un tort irréversible sur des générations qui ne peuvent y consentir, et le pronostic défavorable doit l'emporter sur le favorable. Le réchauffement est lui aussi un risque grave : le premier devoir est donc de réduire la demande, non de miser l'avenir sur une seule technique."
  - author: joan-martinez-alier
    position: 25
    work: martinez-alier-2002
    text:
      en: I oppose new reactors as the claim is posed. Low-carbon accounting hides the conflicts along the uranium chain and at waste sites, where poor and colonised communities bear the burdens. They are owed a say and a debt.
      fr: Je m'oppose à de nouveaux réacteurs tels que la proposition les présente. La comptabilité bas carbone masque les conflits le long de la filière de l'uranium et autour des sites de déchets, où des communautés pauvres et colonisées portent les charges. On leur doit une voix au chapitre et une dette.
  - author: arne-naess
    position: 25
    work: naess-1973
    text:
      en: I oppose with a qualification. New reactors answer the shallow question of how to supply more power with less carbon. The deep question is why France needs so much energy. Centralised, expert-run technology also undermines local self-reliance.
      fr: "Je m'y oppose, avec une réserve. De nouveaux réacteurs répondent à la question superficielle : comment fournir plus d'énergie avec moins de carbone. La question profonde est de savoir pourquoi la France a besoin de tant d'énergie. Une technique centralisée, confiée aux experts, sape en outre l'autonomie locale."
  - author: giorgos-kallis
    position: 25
    work: kallis-2019
    text:
      en: I oppose. The claim treats energy demand as fixed and only asks which source should feed growth. A society that sets its own limits would cut demand and share energy fairly first. Reactors built to keep growth going would tie France to that path for decades.
      fr: Je m'y oppose. La proposition tient la demande d'énergie pour fixe et demande seulement quelle source doit nourrir la croissance. Une société qui fixe ses propres limites réduirait d'abord la demande et partagerait l'énergie équitablement. Des réacteurs construits pour entretenir la croissance enfermeraient la France dans cette voie pour des décennies.
  - author: isabelle-stengers
    position: 25
    work: stengers-1997
    text:
      en: I oppose the claim as posed. A reactor fleet decided in a hurry, in the name of urgency, cuts out everyone it affects, human and not. Slow the decision down until rivers, miners, neighbours and future guardians of the waste have been able to object.
      fr: Je m'oppose à la proposition telle qu'elle est posée. Un parc de réacteurs décidé dans la précipitation, au nom de l'urgence, écarte tous ceux qu'il affecte, humains ou non. Il faut ralentir la décision jusqu'à ce que rivières, mineurs, riverains et futurs gardiens des déchets aient pu objecter.
  - author: robert-bullard
    position: 40
    work: bullard-1990
    text:
      en: Reactors are neither good nor bad in themselves. The test is distributive. France fails it if uranium mining, waste storage and risk land on poor, rural or colonised communities that had no real say in the decision.
      fr: Les réacteurs ne sont ni bons ni mauvais en soi. Le critère est distributif. La France échoue si l'extraction d'uranium, le stockage des déchets et les risques retombent sur des communautés pauvres, rurales ou colonisées qui n'ont pas eu de véritable voix dans la décision.
  - author: robyn-eckersley
    position: 45
    work: eckersley-2004
    text:
      en: My support is conditional and leans slightly against. New reactors are acceptable only if the decision is democratic and answers to everyone affected. That includes future generations who inherit the waste, neighbouring countries, and the communities where uranium is mined. A closed technocratic programme fails that test.
      fr: "Mon soutien est conditionnel et penche légèrement contre. De nouveaux réacteurs ne sont acceptables que si la décision est démocratique et rend des comptes à tous ceux qu'elle affecte : les générations futures qui héritent des déchets, les pays voisins et les communautés où l'uranium est extrait. Un programme technocratique fermé ne passe pas ce test."
  - author: timothy-morton
    position: 50
    work: morton-2013
    text:
      en: Neither yes nor no. Reactors swap one hyperobject, warming, for another, waste that lasts millennia. There is no away and no pristine Nature to return to, so any choice must accept caring for what it leaves behind indefinitely.
      fr: "Ni oui ni non. Les réacteurs échangent un hyperobjet, le réchauffement, contre un autre, des déchets qui durent des millénaires. Il n'y a pas d'ailleurs ni de Nature intacte où revenir : tout choix doit accepter de prendre soin, indéfiniment, de ce qu'il laisse derrière lui."
  - author: jean-baptiste-fressoz
    position: 50
    work: fressoz-2024
    text:
      en: Energy sources have always been added to one another and have never replaced each other. New reactors cut emissions only if France also decides to close specific fossil uses on a fixed timetable. Without that decision, reactors just add capacity.
      fr: Les sources d'énergie se sont toujours additionnées sans jamais se remplacer. De nouveaux réacteurs ne réduisent les émissions que si la France décide aussi de fermer des usages fossiles précis selon un calendrier fixé. Sans cette décision, les réacteurs ne font qu'ajouter des capacités.
  - author: bruno-latour
    position: 55
    work: latour-1999
    text:
      en: I endorse it only on conditions. Reactors are assemblies of rivers, mines, waste and people. Build them if every one of these gets a spokesperson and France commits to caring for what it makes for millennia, rather than abandoning it.
      fr: Je la soutiens, mais sous conditions. Les réacteurs sont des assemblages de rivières, de mines, de déchets et de personnes. Qu'on les construise si chacun de ces éléments a un porte-parole et si la France s'engage à prendre soin de ce qu'elle fabrique pendant des millénaires, au lieu de l'abandonner.
  - author: andreas-malm
    position: 62
    work: malm-2016
    text:
      en: I conditionally endorse new reactors. Warming comes from fossil capital, not from any particular technology, so reactors help only if they come with a political decision to shut down coal, oil and gas under public control.
      fr: "Je soutiens de nouveaux réacteurs, sous condition. Le réchauffement vient du capital fossile et non d'une technique particulière : les réacteurs n'aident que s'ils s'accompagnent d'une décision politique de fermer le charbon, le pétrole et le gaz sous contrôle public."
  - author: johan-rockstrom
    position: 65
    work: rockstrom-2009
    text:
      en: I endorse it with conditions. Low-carbon power helps keep humanity inside the climate boundary, but only if fossil plants close as reactors open. New reactors also have to be judged against the other boundaries, including freshwater and novel entities.
      fr: Je la soutiens sous conditions. Une électricité bas carbone aide à maintenir l'humanité dans la limite climatique, mais seulement si les centrales fossiles ferment à mesure que les réacteurs ouvrent. Les nouveaux réacteurs doivent aussi être jugés au regard des autres limites, dont l'eau douce et les entités nouvelles.
  - author: stewart-brand
    position: 88
    work: brand-2009
    text:
      en: Judge reactors by their measured effects on the climate. France's nuclear grid is already low-carbon, so new reactors should be built and fossil plants closed alongside them. Real waste and siting concerns call for careful management, not refusal.
      fr: "Il faut juger les réacteurs à leurs effets mesurés sur le climat. Le réseau nucléaire français est déjà bas carbone : il faut donc construire de nouveaux réacteurs et fermer en même temps les centrales fossiles. Les vrais problèmes de déchets et d'implantation appellent une gestion attentive, non un refus."
  - author: ted-nordhaus
    position: 90
    work: nordhaus-2015
    text:
      en: France should build new reactors. Dense, abundant, low-carbon power lets human welfare grow while using less land, and offering investment and prosperity wins more support than a politics of limits.
      fr: La France devrait construire de nouveaux réacteurs. Une énergie dense, abondante et bas carbone permet au bien-être humain de croître en occupant moins de terres, et promettre investissement et prospérité rallie davantage qu'une politique des limites.
  - author: james-lovelock
    position: 92
    work: lovelock-2006
    text:
      en: I endorse it. Warming is the irreversible danger. It is too late for gentle sustainable development, and a planned retreat needs abundant low-carbon power. France has shown that fission works at scale. Its waste is small, stays in one place and can be guarded.
      fr: Je soutiens la proposition. Le réchauffement est le danger irréversible. L'heure du développement durable en douceur est passée, et une retraite organisée exige une électricité bas carbone abondante. La France a montré que la fission fonctionne à grande échelle. Ses déchets sont peu volumineux, restent sur place et peuvent être surveillés.
  - author: michael-shellenberger
    position: 95
    work: shellenberger-2020
    text:
      en: France should build new reactors. Dense, reliable, low-carbon power drove fossil fuels out of its grid, uses little land, and makes prosperity compatible with nature. The fear of nuclear waste and scarcity politics do more harm than the reactors do.
      fr: La France devrait construire de nouveaux réacteurs. Une électricité dense, fiable et bas carbone a chassé les fossiles de son réseau, occupe peu de terres et rend la prospérité compatible avec la nature. La peur des déchets nucléaires et la politique de la pénurie font plus de mal que les réacteurs.
