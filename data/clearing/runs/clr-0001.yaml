  reasons:
    michael-shellenberger: Ecomodernist who campaigns openly for nuclear power, the strongest case for the claim.
    hans-jonas: His imperative of responsibility bears on technologies with irreversible, long-term risks such as reactors and waste.
    james-lovelock: Gaia theorist who argued that nuclear power is needed against climate change.
    francoise-deaubonne: French ecofeminist who took part in direct action against French nuclear sites.
    andre-gorz: Wrote that nuclear power implies a centralised, policed society, against his ideal of autonomy.
    andreas-malm: Historian of fossil capital who weighs speed of decarbonisation against the forms of energy.
    serge-latouche: French degrowth theorist who opposes the energy-intensive growth that reactors support.
    murray-bookchin: Social ecologist who opposed centralised energy and favoured decentralised, municipal technics.
    joan-martinez-alier: Studies ecological distribution conflicts, including uranium mining and nuclear sites.
    malcom-ferdinand: French CNRS researcher on colonial inhabitation, relevant to uranium supply and nuclear testing in French territories.
    arne-naess: Founder of deep ecology who questioned large energy systems and the growth they serve.
    bill-devall: Deep ecologist who set reform environmentalism against simple means, a test for technical fixes.
    timothy-morton: His idea of hyperobjects uses nuclear waste and its long timescales as a central example.
    stewart-brand: Former counterculture figure who asked environmentalists to accept nuclear power.
    jacques-ellul: French theorist of technique as a self-expanding system, with a critique of the technological bluff.
    gunther-anders: Philosopher of the Promethean gap who wrote on nuclear danger after Hiroshima.
    jean-baptiste-fressoz: French historian who argues there has been no energy transition, only additions of energy sources.
    bruno-latour: French thinker of the terrestrial who questions modernising projects and how they are decided.
    starhawk: Activist of the anti-nuclear blockades of the 1980s.
    lewis-mumford: His contrast between authoritarian and democratic technics fits large reactor programmes directly.
    giorgos-kallis: Degrowth researcher on self-limitation who disputes the need for more energy supply.
    johan-rockstrom: Earth system scientist whose planetary boundaries frame the climate case for low-carbon power.
    isabelle-stengers: Philosopher of science who criticises expert-led decisions on risky technologies.
    ted-nordhaus: Breakthrough Institute co-founder who supports nuclear power as part of decoupling.
    robyn-eckersley: Theorist of the green state, relevant to state-led energy planning as in France.
    bernard-charbonneau: French critic of industrial society who wrote against the nuclear programme of the 1970s.
    robert-bullard: Documented the unequal siting of hazardous facilities, which applies to waste and plants.
    kohei-saito: Degrowth communist who questions productivist technology even when it is low-carbon.
