summary:
  en: "The run split four agents backing reactors as a climate priority from a broad opposition, while a conditional middle converged on one test: reactors count only if fossil plants close. Branches did not hold, as the Anthropocene agents ranged from the Lovelock agent at 92 to the Stengers agent at 25."
  fr: "Quatre agents ont soutenu les réacteurs au nom du climat face à une large opposition, et le centre conditionnel s'est accordé sur un critère : fermer des centrales fossiles. Les branches n'ont pas tenu : dans la branche Anthropocène, l'agent Lovelock finit à 92 et l'agent Stengers à 25."
