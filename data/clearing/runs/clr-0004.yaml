claim:
  en: Capitalism can be reformed to respect ecological limits.
  fr: Le capitalisme peut être réformé pour respecter les limites écologiques.
question:
  id: capitalisme-reforme
  kind: axiom
  measures: []
summary:
  en: "The run split between six agents trusting prices, property rights or clean technology to steer markets and a majority holding that growth and accumulation defeat any reform. The surprise came from Degrowth: the Raworth agent closed at 42, beside the Rockström agent, while the Hickel and Kallis agents stayed at 10 and 12."
  fr: "Le débat oppose six agents qui misent sur les prix, la propriété ou les technologies propres pour orienter les marchés à une majorité pour qui croissance et accumulation déjouent toute réforme. Surprise côté Décroissance : l'agent Raworth finit à 42, près de l'agent Rockström, quand les agents Hickel et Kallis restent à 10 et 12."
