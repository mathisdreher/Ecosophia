  reasons:
    william-nordhaus: Argues a carbon price inside growth models can align markets with climate limits, the core reformist case.
    jason-hickel: Measures decoupling in rich countries and finds it insufficient under growth imperatives.
    ted-nordhaus: Defends absolute decoupling through technology within a growing market economy.
    john-bellamy-foster: His metabolic rift thesis holds that capital accumulation structurally breaks natural cycles.
    kate-raworth: Doughnut economics sets an ecological ceiling and is agnostic on growth, a middle position on reform.
    johan-rockstrom: Defined the planetary boundaries that give the claim its measurable ecological limits.
    andre-gorz: Wrote directly on whether capitalism can absorb ecological constraints and on sufficiency.
    murray-bookchin: Held that capitalism must grow or die and that ecology requires ending hierarchy.
    robyn-eckersley: The Green State asks whether a growth-built state can regulate markets toward ecological limits.
    eduardo-gudynas: Shows how extractivism persists under governments that promised reform, including progressive ones.
    maria-mies: Argues accumulation rests on unpaid work of women, peasants and nature, which reform does not remove.
    roger-scruton: Conservative case that markets, property and local attachment can support environmental care.
    bill-devall: Explicitly contrasted reform environmentalism with deep environmentalism.
    felix-guattari: Integrated world capitalism describes a system that absorbs and reshapes ecological concerns.
    timothy-morton: Questions the framing of nature and limits that the reform debate assumes.
    kohei-saito: Proposes degrowth communism and rejects green capitalism as a contradiction.
    arthur-cecil-pigou: Originated the tax on external costs, the root of market-based environmental reform.
    jean-baptiste-fressoz: Historical evidence that energy transitions have added sources rather than replaced them.
    james-oconnor: Second contradiction theory says capital undermines its own natural conditions, prompting but limiting reform.
    naomi-klein: Argues climate action is impossible within deregulated capitalism, while engaging policy reform.
    terry-anderson: Free-market environmentalism holds that property rights protect nature better than regulation.
    pope-francis: Laudato si condemns the technocratic paradigm and market faith from a religious standpoint.
    nancy-fraser: Cannibal capitalism describes a system that consumes the natural conditions it does not pay for.
    joan-martinez-alier: Ecological economics and distribution conflicts show costs shifted to the poor under growth.
    giorgos-kallis: Develops degrowth as a research programme on why growth economies cannot respect limits.
    michael-shellenberger: Ecomodernist case for nuclear power and abundance within market societies.
