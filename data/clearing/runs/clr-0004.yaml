alliances:
  - title:
      en: For, markets corrected or steered
      fr: Pour, des marchés corrigés ou orientés
    text:
      en: "Damage taxes, completed property rights or cheap clean technology can bring ecological costs into market economies. They split on the tool: the Pigou agent defended taxes against the Anderson agent's property rights."
      fr: "Taxe sur les dommages, droits de propriété complets ou technologie propre bon marché feraient entrer les coûts écologiques dans le marché. Reste l'outil : l'agent Pigou défend la taxe face aux droits de propriété de l'agent Anderson."
    authors:
      - william-nordhaus
      - arthur-cecil-pigou
      - terry-anderson
      - roger-scruton
      - ted-nordhaus
      - michael-shellenberger
  - title:
      en: Undecided, judged against boundaries
      fr: Sans verdict, jugé aux limites planétaires
    text:
      en: Any reform is judged by whether it returns the economy inside planetary boundaries, ends growth dependence or transforms the state. The Raworth agent stands well apart from its Degrowth branch.
      fr: Toute réforme se juge à sa capacité à ramener l'économie dans les limites planétaires, à sortir de la dépendance à la croissance ou à transformer l'État. L'agent Raworth s'écarte nettement de sa branche Décroissance.
    authors:
      - kate-raworth
      - johan-rockstrom
      - robyn-eckersley
  - title:
      en: Against, because of accumulation itself
      fr: Contre, à cause de l'accumulation
    text:
      en: Profit rests on endless expansion and on unpaid nature, labour and care, so pricing or green reform moves the damage elsewhere rather than ending it.
      fr: Le profit repose sur une expansion sans fin et sur une nature, un travail et un soin non payés, si bien que la tarification ou la réforme verte déplacent les dégâts sans y mettre fin.
    authors:
      - john-bellamy-foster
      - kohei-saito
      - james-oconnor
      - nancy-fraser
      - maria-mies
      - murray-bookchin
      - andre-gorz
      - naomi-klein
  - title:
      en: Against, on the growth record
      fr: Contre, au vu de l'histoire de la croissance
    text:
      en: No fast absolute decoupling, no past energy substitution, and extraction pushed onto the South. The Fressoz agent parts from the Rockström agent, its Anthropocene peer, by doubting the claim on history.
      fr: Pas de découplage absolu rapide, pas de substitution énergétique dans le passé, et une extraction reportée sur le Sud. L'agent Fressoz se sépare de l'agent Rockström, de la même branche Anthropocène, en doutant au nom de l'histoire.
    authors:
      - jason-hickel
      - giorgos-kallis
      - joan-martinez-alier
      - eduardo-gudynas
      - jean-baptiste-fressoz
  - title:
      en: Against, on worldview and desire
      fr: Contre, au nom du rapport au monde
    text:
      en: Prices and decoupling leave untouched the way nature is seen and desire is produced. The Pope Francis agent parts from the Scruton agent, its fellow Conservative, at 25 against 68.
      fr: Les prix et le découplage laissent intacts le regard porté sur la nature et la production du désir. L'agent Pape François se sépare de l'agent Scruton, de la même branche conservatrice, à 25 contre 68.
    authors:
      - bill-devall
      - felix-guattari
      - pope-francis
      - timothy-morton
voices:
  - author: murray-bookchin
    position: 5
    work: bookchin-1982
    text:
      en: Capitalism is a grow-or-die economy, and the domination of nature comes from the domination of human by human. Carbon prices and property rights leave both in place. Only dissolving hierarchy through federated citizens' assemblies can bring society into balance with nature.
      fr: Le capitalisme est une économie de croissance ou de mort, et la domination de la nature naît de la domination de l'homme par l'homme. Prix du carbone et droits de propriété laissent l'une et l'autre en place. Seule la dissolution de la hiérarchie par des assemblées citoyennes fédérées peut rétablir l'équilibre entre la société et la nature.
  - author: maria-mies
    position: 5
    work: mies-1986
    text:
      en: Opposed. Capital accumulates by treating nature, colonies and women's unpaid work as free resources. Reform cannot remove this appropriation because profit depends on it. Respecting limits requires an economy built around producing life, not commodities.
      fr: Contre. Le capital accumule en traitant la nature, les colonies et le travail non rémunéré des femmes comme des ressources gratuites. Aucune réforme ne peut supprimer cette appropriation, car le profit en dépend. Respecter les limites exige une économie organisée autour de la production de la vie, et non des marchandises.
  - author: kohei-saito
    position: 5
    work: saito-2022
    text:
      en: Capital has to grow, and its growth keeps reopening the metabolic rift between society and nature. Green reforms move the damage to other places or later times. Respecting limits needs degrowth communism, with abundance coming from the commons and free time.
      fr: Le capital doit croître, et sa croissance ne cesse de rouvrir la rupture métabolique entre la société et la nature. Les réformes vertes déplacent les dégâts vers d'autres lieux ou les reportent à plus tard. Respecter les limites exige un communisme de décroissance, où l'abondance vient des communs et du temps libre.
  - author: john-bellamy-foster
    position: 6
    work: foster-1999
    text:
      en: Opposed. The metabolic rift is built into the structure of capitalism, because accumulation rather than natural cycles governs production. Reforms such as pricing or intensification move the rift elsewhere instead of closing it. Respecting limits requires production for use under collective control of the social metabolism.
      fr: Contre. La rupture métabolique est inscrite dans la structure du capitalisme, car c'est l'accumulation, et non les cycles naturels, qui gouverne la production. Les réformes comme la tarification ou l'intensification déplacent la rupture au lieu de la refermer. Respecter les limites exige une production pour l'usage, sous contrôle collectif du métabolisme social.
  - author: nancy-fraser
    position: 8
    work: fraser-2022
    text:
      en: "Capitalism feeds on background conditions it does not pay for: nature, care work, public power and the wealth of colonised peoples. Reforms such as carbon pricing only move the damage from one of these conditions to another. Respecting limits requires changing the system."
      fr: "Le capitalisme se nourrit de conditions d'arrière-plan qu'il ne paie pas : la nature, le travail de soin, la puissance publique et la richesse des peuples colonisés. Les réformes comme la tarification du carbone ne font que déplacer les dégâts de l'une de ces conditions vers une autre. Respecter les limites exige de changer de système."
  - author: jason-hickel
    position: 10
    work: hickel-2020b
    text:
      en: The claim is opposed. Capitalism depends on growth, and no evidence shows GDP decoupling from material use and emissions fast enough to stay within planetary boundaries. Respecting limits requires planned degrowth in the rich North, which is a matter of justice toward the South.
      fr: La thèse est rejetée. Le capitalisme dépend de la croissance, et rien ne montre que le PIB se découple de l'usage de matières et des émissions assez vite pour rester dans les limites planétaires. Respecter les limites exige une décroissance planifiée dans le Nord riche, ce qui relève de la justice envers le Sud.
  - author: andre-gorz
    position: 10
    work: gorz-1975
    text:
      en: Capitalism can absorb ecological constraints only as new scarcity and profit, rationed by price and run by experts. Respecting limits needs a common norm of enough, set by those concerned, and that breaks with production for accumulation.
      fr: Le capitalisme ne peut intégrer les contraintes écologiques que sous forme de nouvelle rareté et de profit, rationnés par les prix et gérés par des experts. Respecter les limites exige une norme commune du suffisant, fixée par les intéressés, et cela rompt avec la production pour l'accumulation.
  - author: eduardo-gudynas
    position: 12
    work: gudynas-2015
    text:
      en: Opposed. Reform that only changes who captures and spends the rent leaves extractivism intact. Latin America's progressive governments showed this. Northern decoupling can also push extraction onto the South. Respecting limits requires leaving the export-of-raw-materials model of development behind.
      fr: Contre. Une réforme qui change seulement qui capte et dépense la rente laisse l'extractivisme intact. Les gouvernements progressistes d'Amérique latine l'ont montré. Le découplage au Nord peut aussi reporter l'extraction sur le Sud. Respecter les limites exige de sortir du modèle de développement fondé sur l'exportation de matières premières.
  - author: felix-guattari
    position: 12
    work: guattari-1989
    text:
      en: Reform aimed at prices or emissions treats only the environmental register. Integrated world capitalism also produces desires and standardised ways of living, and it wears down social bonds. Without joint change in environmental, social and mental ecology, the damage comes back.
      fr: Une réforme qui vise les prix ou les émissions ne traite que le registre environnemental. Le capitalisme mondial intégré produit aussi des désirs et des modes de vie standardisés, et il use le lien social. Sans transformation conjointe des écologies environnementale, sociale et mentale, les dégâts reviennent.
  - author: giorgos-kallis
    position: 12
    work: kallis-2018
    text:
      en: Capitalism stays stable only by growing. The evidence shows no absolute decoupling that is fast or large enough. Reform can soften the damage but cannot remove the drive to expand. Respecting limits requires a society that chooses to stop growing and organises its economy around enough.
      fr: Le capitalisme ne reste stable qu'en croissant. Les faits ne montrent aucun découplage absolu assez rapide ni assez ample. La réforme peut atténuer les dégâts mais pas supprimer la pulsion d'expansion. Respecter les limites exige une société qui choisit d'arrêter de croître et organise son économie autour du suffisant.
  - author: bill-devall
    position: 15
    work: devall-1980
    text:
      en: Reforming capitalism is reform environmentalism. It manages nature more efficiently as a resource for people and leaves in place the worldview that turns forests and rivers into inputs. Respecting limits needs a change in that worldview and a life simple in means, rich in ends.
      fr: Réformer le capitalisme relève de l'environnementalisme réformiste. Il gère plus efficacement la nature comme ressource pour les humains et laisse intacte la vision du monde qui fait des forêts et des rivières des intrants. Respecter les limites exige de changer cette vision et de mener une vie simple dans ses moyens, riche dans ses fins.
  - author: james-oconnor
    position: 15
    work: oconnor-1988
    text:
      en: Capital degrades the land, labour and cities it depends on, which raises its own costs. Reform through the state or through pricing turns that contradiction into a political fight over who pays. It moves the contradiction somewhere else and does not resolve it.
      fr: Le capital dégrade la terre, le travail et les villes dont il dépend, ce qui fait monter ses propres coûts. La réforme par l'État ou par les prix transforme cette contradiction en lutte politique pour savoir qui paie. Elle déplace la contradiction ailleurs sans la résoudre.
  - author: naomi-klein
    position: 15
    work: klein-2014
    text:
      en: Deregulated capitalism and the planet are at war, and only one can change. Carbon pricing and minor reforms are not enough. Respecting limits takes public planning, regulation and investment, carried out as a programme of social justice that breaks with growth-first market rules.
      fr: Le capitalisme dérégulé et la planète sont en guerre, et un seul des deux peut changer. La tarification du carbone et les réformes mineures ne suffisent pas. Respecter les limites exige planification, régulation et investissement publics, menés comme un programme de justice sociale qui rompt avec les règles de marché soumises à la croissance.
  - author: joan-martinez-alier
    position: 18
    work: martinez-alier-2002
    text:
      en: Unlikely. A growing economy uses more energy and materials and pushes the extraction frontier onto the poor. Pricing damage in money ignores other languages of value. Reform moves the ecological distribution conflicts elsewhere but does not end them.
      fr: Peu probable. Une économie en croissance consomme davantage d'énergie et de matières et repousse la frontière d'extraction vers les pauvres. Chiffrer les dommages en argent ignore les autres langages de la valeur. La réforme déplace les conflits de distribution écologique sans y mettre fin.
  - author: jean-baptiste-fressoz
    position: 22
    work: fressoz-2024
    text:
      en: Reform of capitalism leans on a coming energy transition, but history records none. Coal, oil and wood grew together, each feeding the others. Green growth that depends on new energy pushing out old energy is a bet against the whole historical record.
      fr: La réforme du capitalisme s'appuie sur une transition énergétique à venir, mais l'histoire n'en connaît aucune. Le charbon, le pétrole et le bois ont crû ensemble, chacun alimentant les autres. Une croissance verte qui compte sur des énergies nouvelles chassant les anciennes est un pari contre toute l'histoire connue.
  - author: timothy-morton
    position: 25
    work: morton-2007
    text:
      en: Reform assumes that limits fence off Nature as a pristine elsewhere that markets can learn to respect. Ecological thought drops that outside, because humans are already inside hyperobjects like global warming. This work does not settle the economic question, but by analogy the claim looks doubtful.
      fr: La réforme suppose que les limites clôturent une Nature conçue comme un ailleurs intact que les marchés pourraient apprendre à respecter. La pensée écologique abandonne ce dehors, car les humains sont déjà à l'intérieur d'hyperobjets comme le réchauffement climatique. Ce travail ne tranche pas la question économique, mais par analogie la thèse paraît douteuse.
  - author: pope-francis
    position: 25
    work: francis-2015
    text:
      en: Reforming markets and prices can't respect limits while the technocratic paradigm and the throwaway culture stay in place. It takes an ecological conversion of goals and ways of living, and repaying the ecological debt to the poor, so the earth and the poor stop paying the bill.
      fr: Réformer les marchés et les prix ne peut pas faire respecter les limites tant que demeurent le paradigme technocratique et la culture du déchet. Il faut une conversion écologique des fins et des modes de vie, et le remboursement de la dette écologique envers les pauvres, pour que la terre et les pauvres cessent de payer l'addition.
  - author: robyn-eckersley
    position: 35
    work: eckersley-2004
    text:
      en: Capitalism will not reform itself, because the state draws its legitimacy from growth and guards accumulation before ecology. Respecting limits is possible only through a transformed green state that answers to everyone its decisions affect, including future generations and people beyond its borders.
      fr: Le capitalisme ne se réformera pas de lui-même, car l'État tire sa légitimité de la croissance et protège l'accumulation avant l'écologie. Respecter les limites n'est possible que par un État vert transformé, qui rende des comptes à tous ceux que ses décisions affectent, y compris les générations futures et les populations au-delà de ses frontières.
  - author: kate-raworth
    position: 42
    work: raworth-2017
    text:
      en: The system's label matters less than whether it meets everyone's needs within planetary boundaries. Economies that depend on growth keep pushing through the ecological ceiling. Reform counts only if it ends that dependence and redesigns the economy to be regenerative and distributive.
      fr: L'étiquette du système compte moins que sa capacité à répondre aux besoins de tous dans les limites planétaires. Les économies dépendantes de la croissance continuent de percer le plafond écologique. Une réforme ne vaut que si elle met fin à cette dépendance et refonde l'économie pour la rendre régénératrice et redistributive.
  - author: johan-rockstrom
    position: 45
    work: rockstrom-2009
    text:
      en: The planetary boundaries framework does not choose an economic system. Reform counts only if it brings all nine Earth processes back inside the safe operating space quickly. Pricing that treats damage as smooth misses thresholds, and the record so far gives little cause for confidence.
      fr: Le cadre des limites planétaires ne choisit pas de système économique. Une réforme ne compte que si elle ramène rapidement les neuf processus terrestres dans l'espace de fonctionnement sûr. Une tarification qui traite les dommages comme continus ignore les seuils, et le bilan à ce jour donne peu de raisons d'avoir confiance.
  - author: roger-scruton
    position: 68
    work: scruton-2012
    text:
      en: Markets can respect ecological limits when they rest on rooted ownership, local institutions and love of home. The threat to nature comes from global corporations and global plans, which answer to no place. Revolution and technocratic schemes do not remedy that.
      fr: Les marchés peuvent respecter les limites écologiques lorsqu'ils reposent sur une propriété enracinée, des institutions locales et l'amour du foyer. La menace pour la nature vient des grandes entreprises mondiales et des plans mondiaux, qui ne répondent à aucun lieu. Ni la révolution ni les dispositifs technocratiques n'y remédient.
  - author: ted-nordhaus
    position: 78
    work: nordhaus-2015
    text:
      en: Market economies can be steered to leave more room for nature. Public investment in cheap clean energy, higher farm yields and denser cities decouples human welfare from land use. A politics of limits and restraint cannot win majorities or meet the needs of the poor.
      fr: Les économies de marché peuvent être orientées pour laisser plus de place à la nature. L'investissement public dans une énergie propre bon marché, de meilleurs rendements agricoles et des villes plus denses découple le bien-être humain de l'usage des terres. Une politique des limites et de la retenue ne peut ni gagner de majorités ni répondre aux besoins des pauvres.
  - author: arthur-cecil-pigou
    position: 80
    work: pigou-1920
    text:
      en: Ecological harm is a gap between private and social cost, not proof that markets must be abolished. A state tax equal to the damage brings the two costs back together. Where harm falls on many people at once, bargaining fails and fiscal correction is needed.
      fr: Les atteintes écologiques sont un écart entre coût privé et coût social, non la preuve qu'il faut abolir les marchés. Une taxe d'État égale aux dommages rapproche les deux coûts. Lorsque le dommage touche beaucoup de personnes à la fois, la négociation échoue et une correction fiscale s'impose.
  - author: terry-anderson
    position: 80
    work: anderson-1991
    text:
      en: Capitalism can respect ecological limits once property rights are completed. Resources decay where nobody owns them and nobody pays for neglect. Clear, enforceable, tradable rights, including those of local communities, make owners guard scarce resources better than regulators or damage taxes do.
      fr: Le capitalisme peut respecter les limites écologiques une fois les droits de propriété complétés. Les ressources se dégradent là où personne ne les possède et où personne ne paie pour leur abandon. Des droits clairs, opposables et cessibles, y compris ceux des communautés locales, font des propriétaires de meilleurs gardiens des ressources rares que les régulateurs ou les taxes sur les dommages.
  - author: william-nordhaus
    position: 82
    work: w-nordhaus-2008
    text:
      en: Climate damage is an externality that market prices miss. A carbon price that matches the damage and rises along an optimal path brings ecological costs into market decisions. Reform through pricing does this at lower cost than halting growth.
      fr: Les dommages climatiques sont une externalité que les prix du marché ignorent. Un prix du carbone égal aux dommages, et qui augmente selon une trajectoire optimale, fait entrer les coûts écologiques dans les décisions de marché. La réforme par les prix y parvient à moindre coût que l'arrêt de la croissance.
  - author: michael-shellenberger
    position: 82
    work: shellenberger-2020
    text:
      en: Market economies can square prosperity with a thriving planet through technology, not restraint. Nuclear power, intensive farming and urbanization separate human welfare from land use and emissions. The idea of limits misleads, because the goal is decoupling, not an end to growth.
      fr: Les économies de marché peuvent concilier prospérité et planète florissante par la technologie, non par la retenue. Le nucléaire, l'agriculture intensive et l'urbanisation séparent le bien-être humain de l'usage des terres et des émissions. L'idée de limites égare, car l'objectif est le découplage, non la fin de la croissance.
