  reasons:
    hans-jonas: The Imperative of Responsibility openly weighed whether an enlightened authority could act better than democracies facing technological danger.
    james-lovelock: Late in life he said democracy might have to be put on hold to face climate change.
    dominique-bourg: Argues that representative democracy is built for the short term and proposes new long-term institutions.
    john-dryzek: Founder of deliberative democracy who argues that ecological rationality calls for more democratic learning, not less.
    andreas-malm: Defends an ecological Leninism and state emergency action, and so tests the claim from the radical left.
    murray-bookchin: Libertarian municipalism makes direct democracy the core of ecology and rejects any authoritarian route.
    erik-swyngedouw: Criticises expert-led consensual climate politics as post-political and depoliticising.
    robyn-eckersley: The Green State asks how a democratic state can be made into a guardian of ecological limits.
    yves-cochet: Green former minister who holds that the end of cheap oil calls for rationing and emergency politics.
    pascal-bruckner: Reads catastrophism as a doom ideology that serves to justify coercion.
    michael-shellenberger: Ecomodernist who rejects the emergency framing and the restrictions built on it.
    andre-gorz: Warned that ecology could become expertocratic and technofascist unless it is tied to autonomy.
    cornelius-castoriadis: Grounds self-limitation in collective autonomy and democratic self-institution.
    arne-naess: Deep ecology founder who insisted on nonviolent, democratic means for deep change.
    baird-callicott: Land ethic holism was charged with ecofascism, and he answered on the relation of the whole to individuals.
    wangari-maathai: The Green Belt Movement tied tree planting to the democratic struggle against authoritarian rule in Kenya.
    malcom-ferdinand: Shows how environmental protection imposed from above repeats colonial domination.
    catriona-sandilands: Theorised a radical democracy for ecology without fixed identities.
    will-kymlicka: Political philosopher who extends democratic citizenship to animals rather than suspending it.
    roger-scruton: Conservative who ties ecology to local attachment and distrusts centralised top-down schemes.
    chantal-mouffe: Agonism and a green democratic revolution keep conflict inside democracy.
    bruno-latour: Parliament of things proposes widening representation rather than limiting it.
    elinor-ostrom: Showed that communities govern commons without central coercion.
    naomi-klein: The Shock Doctrine warns that emergencies are used to bypass democratic choice.
    alberto-acosta: Led a constituent assembly that wrote rights of nature into a constitution by democratic means.
    luc-ferry: Humanist critic who sees in deep ecology a threat to liberal democracy.
