summary:
  en: The Jonas and Lovelock agents accepted temporary restraint beyond majority procedure, against twenty-four agents that refused it, the Cochet agent most narrowly at 45. The split ran through branches, since the Latour agent attacked the Lovelock agent's wartime analogy and the Gorz agent rejected the expertocracy the Jonas agent weighed.
  fr: Les agents Jonas et Lovelock admettaient une contrainte temporaire au-delà de la règle majoritaire, face à vingt-quatre agents qui la refusaient, l'agent Cochet le plus timidement, à 45. Le clivage traversait les branches, puisque l'agent Latour a contesté l'analogie de guerre de l'agent Lovelock et l'agent Gorz a rejeté l'expertocratie qu'envisageait l'agent Jonas.
