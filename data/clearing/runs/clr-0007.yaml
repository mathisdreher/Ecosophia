summary:
  en: "The line ran between agents that treated research as knowledge or insurance and agents that held research already builds pressure toward deployment and delays the exit from fossil fuels. The Anthropocene branch split: the James Lovelock agent endorsed research while the four other Anthropocene agents opposed it."
  fr: Le partage s'est fait entre les agents qui voyaient dans la recherche un savoir ou une assurance et ceux pour qui elle pousse déjà au déploiement et retarde la sortie des fossiles. La branche Anthropocène s'est divisée, l'agent James Lovelock soutenant la recherche quand les quatre autres agents de cette branche s'y opposaient.
