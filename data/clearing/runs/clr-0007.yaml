  reasons:
    stewart-brand: His ecopragmatism openly endorses researching planetary engineering, the strongest case for the claim.
    hans-jonas: His imperative of responsibility addresses technologies with irreversible planetary reach.
    naomi-klein: This Changes Everything has a chapter attacking solar radiation management as a technofix.
    bjorn-lomborg: His cost-benefit priorities have ranked climate engineering research as a cheap, high-value option.
    bruno-latour: His work on Gaia and the terrestrial questions the idea of steering the Earth system.
    vandana-shiva: She has campaigned against geoengineering as a corporate and Northern control of the climate.
    amitav-ghosh: His colonial terraforming thesis reads planetary engineering as a continuation of conquest.
    erik-swyngedouw: He criticises expert-managed climate policy as post-political, which bears on who governs geoengineering.
    jason-hickel: He argues that technofixes defer the cuts in rich-country consumption that justice requires.
    pope-francis: Laudato si condemns the technocratic paradigm that geoengineering exemplifies.
    arne-naess: His deep versus shallow ecology distinction frames geoengineering as a shallow response.
    baird-callicott: His land ethic judges actions by their effects on the integrity of the biotic community.
    murray-bookchin: He ties the domination of nature to social hierarchy and centralised technics.
    timothy-morton: His hyperobjects concept addresses climate as something beyond human mastery.
    james-lovelock: As a Gaia scientist he weighed geoengineering as a desperate but possibly necessary measure.
    ted-nordhaus: The Breakthrough Institute he co-founded backs research into technological climate options.
    andreas-malm: He has analysed solar geoengineering as a way for fossil capital to keep burning.
    william-nordhaus: His climate-economy models treat geoengineering as a potentially cheap substitute for abatement.
    gunther-anders: His Promethean gap describes making technologies whose consequences we cannot imagine.
    elinor-ostrom: Her work on governing commons bears on who could legitimately control a global thermostat.
    bill-mckibben: The End of Nature argues that engineering the climate completes the loss of an independent nature.
    isabelle-stengers: She warns against technical answers to the intrusion of Gaia and calls for slow science.
    jacques-ellul: His theory of autonomous technique predicts that research builds momentum toward deployment.
    pascal-bruckner: He defends progress and technical solutions against what he calls ecological catastrophism.
    carolyn-merchant: The Death of Nature traces the mechanistic will to master the Earth that geoengineering extends.
    jean-baptiste-fressoz: His history of known industrial risks challenges promises that technical fixes will be controlled.
